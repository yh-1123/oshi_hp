<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root{
  --oshi-color: #e0233a;
  --oshi-color-deep: #b81b30;
  --oshi-color-soft: #ffe2e6;
  --accent2: #ece6e8;
  --ink: #2b2331;
  --sub-ink: #7d6b78;
  --paper: #fffaf9;
  --line: #f0dde6;
  --card: #ffffff;
  --shadow-sm: 0 2px 10px rgba(43,35,49,0.06);
  --shadow-md: 0 10px 26px rgba(43,35,49,0.12);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--oshi-color); outline-offset:2px; border-radius:4px;
}
html{ scroll-behavior:smooth; }
body{ font-family:'Noto Sans JP', sans-serif; background:var(--paper); color:var(--ink); line-height:1.75; overflow-x:hidden; padding-bottom:72px; font-size:15px; }
h1,h2,h3,.brand{ font-family:'Zen Maru Gothic', sans-serif; }
a{ color:inherit; text-decoration:none; }
.wrap{ max-width:640px; margin:0 auto; padding:0 18px; }

.topnav{ position:sticky; top:0; z-index:50; background:rgba(255,250,249,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
.topnav .wrap{ display:flex; align-items:center; justify-content:space-between; height:46px; }
.back-link{ font-size:12.5px; font-weight:700; color:var(--oshi-color); }
.brand{ font-size:12px; color:var(--sub-ink); }
.nav-icon-btn{ flex:none; border:none; background:transparent; font-size:15px; cursor:pointer; padding:4px 2px; color:var(--sub-ink); line-height:1; }
.nav-icon-btn:hover{ color:var(--oshi-color); }
.arch-nav-link{ font-size:11.5px; font-weight:700; color:var(--oshi-color); white-space:nowrap; }
.arch-nav-link:hover{ opacity:0.8; }

/* SNSリンク */
.sns-links-row{ display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin-top:14px; }
.sns-icon-item{ position:relative; }
.sns-icon-item .edit-edit{ top:-6px; left:-6px; right:auto; width:20px; height:20px; font-size:10px; }
.sns-icon-item .edit-remove{ top:-6px; right:-6px; width:20px; height:20px; font-size:11px; }
.sns-icon-link{
  display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%;
  color:#fff; font-size:17px; box-shadow:0 4px 10px rgba(43,35,49,0.18); border:2px solid #fff;
  transition:transform .15s ease, box-shadow .15s ease;
}
.sns-icon-link:hover{ transform:translateY(-2px) scale(1.06); box-shadow:0 6px 14px rgba(43,35,49,0.24); }
.sns-icon-link:active{ transform:translateY(0) scale(0.96); }
.sns-icon-link.x{ background:#000; font-size:15px; font-weight:900; }
.sns-icon-link.instagram{ background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4); }
.sns-icon-link.tiktok{ background:#000; }
.sns-icon-link.other{ background:var(--oshi-color); }
.sns-icon-link.has-icon{ background-size:cover; background-position:center; color:transparent; font-size:0; }
.sns-icon-preview{ width:60px; height:60px; border-radius:50%; background:var(--oshi-color-soft) center/cover; margin:0 auto; display:none; }
.platform-select{ display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; }
.plat-btn{ flex:1 1 70px; border:1.5px solid var(--line); background:#fff; color:var(--sub-ink); font-size:12px; font-weight:700; padding:8px 0; border-radius:10px; cursor:pointer; font-family:inherit; }
.plat-btn.active{ border-color:var(--oshi-color); color:var(--oshi-color); background:var(--oshi-color-soft); }

/* 経歴:年ごとのグループ */
.year-group{ margin-bottom:22px; }
.year-group:last-child{ margin-bottom:0; }
.year-label{ font-size:12.5px; font-weight:700; color:var(--oshi-color); margin-bottom:10px; }
.tl-photo{ width:100%; max-width:220px; border-radius:10px; margin:6px 0; display:block; box-shadow:var(--shadow-sm); }

.p-hero{ position:relative; padding:28px 0 20px; text-align:center; overflow:hidden; }
.p-hero::before{
  content:""; position:absolute; top:8px; left:50%; width:150px; height:150px; transform:translateX(-50%);
  background:radial-gradient(circle, var(--oshi-color-soft) 0%, transparent 68%);
  opacity:0.9; pointer-events:none;
}
.p-photo-wrap{ position:relative; width:104px; height:104px; margin:0 auto 12px; }
.p-photo{
  position:relative; z-index:1; width:100%; height:100%; border-radius:50%; overflow:hidden;
  background:linear-gradient(135deg, var(--oshi-color-soft), var(--accent2));
  background-size:cover; background-position:center;
  display:flex; align-items:center; justify-content:center; font-size:10.5px; color:var(--sub-ink);
  border:3px solid #fff; box-shadow:0 6px 16px rgba(43,35,49,0.14), 0 0 0 2px var(--oshi-color);
}
.p-photo.has-photo .p-photo-placeholder{ display:none; }
.p-photo-edit{
  display:none; position:absolute; bottom:-2px; right:-2px; z-index:2; width:30px; height:30px; border-radius:50%;
  background:var(--oshi-color); color:#fff; border:2px solid #fff; font-size:13px; cursor:pointer;
  align-items:center; justify-content:center;
}
body.editing .p-photo-edit{ display:flex; }
.p-hero h1{ position:relative; font-size:clamp(22px,7vw,30px); font-weight:900; }
.p-kana{ position:relative; font-size:12px; color:var(--sub-ink); margin-top:3px; }
.p-catch{ position:relative; margin:10px auto 0; max-width:380px; font-size:13px; }

section{ padding:30px 0; border-top:1px solid var(--line); }
.sec-head{ margin-bottom:16px; }
.sec-head h2{ font-size:16.5px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
.sec-head h2 .mark{ color:var(--oshi-color); font-size:14px; }
.sec-head p{ color:var(--sub-ink); font-size:12px; margin-top:4px; }
.sec-head p:empty{ display:none; margin-top:0; }

/* 基本情報 */
.info-list{ display:flex; flex-direction:column; }
.info-row{ position:relative; padding:11px 80px 11px 2px; border-bottom:1px solid var(--line); transition:background .15s ease; }
.info-row:last-child{ border-bottom:none; }
.info-link{ display:flex; gap:12px; color:inherit; }
.info-link[href]:hover{ color:var(--oshi-color); }
.info-label{ flex:0 0 104px; font-size:12px; font-weight:700; color:var(--oshi-color); white-space:nowrap; }
.info-value{ flex:1; min-width:0; font-size:13px; }

/* 経歴 */
.timeline{ position:relative; padding-left:20px; }
.timeline::before{ content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line); }
.tl-item{ position:relative; padding-bottom:24px; padding-right:80px; }
.tl-item:last-child{ padding-bottom:0; }
.tl-link{ display:block; color:inherit; }
.tl-link[href]:hover{ color:var(--oshi-color); }
.tl-item::before{ content:""; position:absolute; left:-20px; top:4px; width:9px; height:9px; border-radius:50%; background:var(--oshi-color); box-shadow:0 0 0 4px var(--oshi-color-soft); }
.tl-date{ font-size:11.5px; color:var(--oshi-color); font-weight:700; }
.tl-item p{ font-size:13px; margin-top:2px; }

.bio-text{ font-size:13.5px; white-space:pre-line; }
.bio-text:empty{ display:none; }

footer{ text-align:center; padding:30px 0 16px; color:var(--sub-ink); font-size:11px; }
.last-updated{ margin-top:8px; font-size:10.5px; color:var(--sub-ink); }
.last-updated:empty{ display:none; }

.back-to-top{
  position:fixed; right:16px; bottom:78px; z-index:90; width:42px; height:42px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--oshi-color); font-size:18px; cursor:pointer;
  box-shadow:0 6px 18px rgba(43,35,49,0.15); display:none; align-items:center; justify-content:center;
  opacity:0; transition:opacity .2s ease;
}
.back-to-top.show{ display:flex; opacity:1; }
.back-to-top:hover{ background:var(--oshi-color-soft); }

/* 編集モード */
.editable{ outline:none; }
body.editing .editable{ outline:1.5px dashed var(--oshi-color); outline-offset:2px; border-radius:4px; cursor:text; }
body.editing .editable:hover{ background:var(--oshi-color-soft); }
.edit-remove{
  display:none; position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:16px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
.edit-edit{
  display:none; position:absolute; top:8px; right:44px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:14px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
body.editing .edit-remove, body.editing .edit-edit{ display:flex; }
body.editing .edit-remove:hover, body.editing .edit-edit:hover{ background:var(--oshi-color); color:#fff; border-color:var(--oshi-color); }

.reorder-row{ display:none; gap:6px; margin-top:8px; }
body.editing .reorder-row{ display:flex; }
.reorder-btn{
  border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:10.5px; font-weight:700;
  padding:4px 10px; border-radius:8px; cursor:pointer; font-family:inherit;
}
.reorder-btn:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }
.info-row .reorder-row{ margin-top:4px; margin-left:auto; margin-right:26px; }

.add-row{ display:none; margin-top:12px; }
body.editing .add-row{ display:flex; }
.add-btn{
  border:1.5px dashed var(--oshi-color); color:var(--oshi-color); background:#fff; border-radius:12px;
  padding:9px 16px; font-size:12.5px; font-weight:700; cursor:pointer; width:100%; text-align:center;
  transition:background .15s ease;
}
.add-btn:hover{ background:var(--oshi-color-soft); }

.edit-toolbar{
  display:none; position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
  border-radius:999px; padding:7px 8px; box-shadow:0 8px 24px rgba(43,35,49,0.18); z-index:100;
  max-width:94vw; overflow-x:auto; scrollbar-width:none;
}
.edit-toolbar.unlocked{ display:flex; }
.edit-toolbar::-webkit-scrollbar{ display:none; }
#footer-tap-target{ cursor:default; -webkit-tap-highlight-color:transparent; user-select:none; display:inline-block; }
.tb-btn{ flex:none; border:none; border-radius:999px; padding:9px 15px; font-size:12px; font-weight:700; cursor:pointer; background:var(--paper); color:var(--ink); white-space:nowrap; transition:background .15s ease; }
.tb-btn.primary{ background:var(--oshi-color); color:#fff; }
.tb-btn.primary:hover{ background:var(--oshi-color-deep); }
.tb-btn-icon{
  flex:none; border:none; border-radius:50%; width:34px; height:34px; font-size:14px; cursor:pointer;
  background:var(--paper); color:var(--ink); display:inline-flex; align-items:center; justify-content:center;
}
.tb-btn-icon:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }

.modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(43,35,49,0.45); z-index:200; align-items:center; justify-content:center; padding:20px; }
.modal-backdrop.open{ display:flex; }
.modal{ background:#fff; border-radius:18px; padding:20px; width:100%; max-width:380px; max-height:84vh; overflow-y:auto; }
.modal h3{ font-size:15px; margin-bottom:14px; }
.qa-label{ font-size:11px; color:var(--sub-ink); margin-top:12px; margin-bottom:2px; }
.qa-label:first-child{ margin-top:0; }
.qa-input{ border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); width:100%; }
.qa-input:focus{ outline:2px solid var(--oshi-color); outline-offset:1px; }
.modal-actions{ display:flex; gap:8px; margin-top:18px; }
.modal-actions button{ flex:1; }
.modal-actions .tb-btn{ background:var(--paper); border:1px solid var(--line); }
.modal-actions .add-btn{ border-style:solid; background:var(--oshi-color); color:#fff; }
.modal-actions .add-btn:hover{ background:var(--oshi-color-deep); }

/* トリミングUI */
.crop-wrap{ margin-top:8px; display:none; }
.crop-viewport{
  position:relative; width:100%; aspect-ratio:1/1; max-width:240px; margin:0 auto; overflow:hidden; border-radius:50%;

.crop-viewport:active{ cursor:grabbing; }
.crop-viewport img{ position:absolute; top:0; left:0; max-width:none; user-select:none; pointer-events:none; }
.crop-wrap input[type="range"]{ width:100%; margin-top:8px; accent-color:var(--oshi-color); }
.crop-hint{ font-size:10.5px; color:var(--sub-ink); margin-top:4px; text-align:center; }
.photo-preview{ width:100%; aspect-ratio:16/9; background-size:cover; background-position:center; border-radius:10px; margin-top:6px; border:1px solid var(--line); display:none; }

@media (max-width:480px){
  .wrap{ padding:0 14px; }
  .p-hero{ padding:22px 0 16px; }
  section{ padding:24px 0; }
}
</style>

/* ==========================================================
   編集用パスワード。oshi-tool.html と同じ仕組み(SHA-256ハッシュ)。

async function sha256Hex(text){
  if(!window.crypto || !window.crypto.subtle){ return Promise.reject(new Error("subtlecrypto-unavailable")); }
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function infoRowHTML(i){

let cropState = null;
function initCropUI(){
  const fileInput = document.getElementById("f-photo-file");
  if(!fileInput) return;
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = document.getElementById("crop-img");
      img.onload = () => setupCrop(img);
      img.src = e.target.result;
      document.getElementById("crop-wrap").style.display = "block";
    };
    reader.readAsDataURL(file);
  });
}
function setupCrop(img){
  const viewport = document.getElementById("crop-viewport");
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const coverScale = Math.max(vw / iw, vh / ih);
  cropState = { vw, vh, iw, ih, coverScale, zoom: 1, x: (vw - iw * coverScale) / 2, y: (vh - ih * coverScale) / 2, hasImage: true };
  document.getElementById("crop-zoom").value = "1";
  applyCropTransform();
  bindCropDrag();
}
function applyCropTransform(){
  const img = document.getElementById("crop-img");
  const s = cropState.coverScale * cropState.zoom;
  img.style.width = (cropState.iw * s) + "px";
  img.style.height = (cropState.ih * s) + "px";
  img.style.transform = `translate(${cropState.x}px, ${cropState.y}px)`;
}
function clampCropPosition(){
  const s = cropState.coverScale * cropState.zoom;
  const dispW = cropState.iw * s, dispH = cropState.ih * s;
  const minX = cropState.vw - dispW, minY = cropState.vh - dispH;
  cropState.x = Math.min(0, Math.max(minX, cropState.x));
  cropState.y = Math.min(0, Math.max(minY, cropState.y));
}
function bindCropDrag(){
  const viewport = document.getElementById("crop-viewport");
  let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
  viewport.onpointerdown = (e) => { dragging = true; startX = e.clientX; startY = e.clientY; origX = cropState.x; origY = cropState.y; viewport.setPointerCapture(e.pointerId); };
  viewport.onpointermove = (e) => {
    if(!dragging) return;
    cropState.x = origX + (e.clientX - startX);
    cropState.y = origY + (e.clientY - startY);
    clampCropPosition();
    applyCropTransform();
  };
  viewport.onpointerup = () => { dragging = false; };
  viewport.onpointercancel = () => { dragging = false; };
  document.getElementById("crop-zoom").oninput = (e) => {
    cropState.zoom = parseFloat(e.target.value);
    clampCropPosition();
    applyCropTransform();
  };
}
function getCroppedDataUrl(outW, outH){
  outW = outW || 480; outH = outH || 480;
  if(!cropState || !cropState.hasImage) return "";
  const img = document.getElementById("crop-img");
  const canvas = document.createElement("canvas");
  canvas.width = outW; canvas.height = outH;
  const ctx = canvas.getContext("2d");
  const s = cropState.coverScale * cropState.zoom;
  const ratio = outW / cropState.vw;
  ctx.drawImage(img, cropState.x * ratio, cropState.y * ratio, cropState.iw * s * ratio, cropState.ih * s * ratio);
  return canvas.toDataURL("image/jpeg", 0.85);
}

let pendingSnsIcon = "";
let modalOriginalSnsIcon = "";
function initSnsIconUpload(){
  const input = document.getElementById("f-sns-icon-file");
  if(!input) return;
  input.addEventListener("change", () => {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const size = Math.min(img.naturalWidth, img.naturalHeight);
        const sx = (img.naturalWidth - size) / 2;
        const sy = (img.naturalHeight - size) / 2;
        const canvas = document.createElement("canvas");
        canvas.width = 120; canvas.height = 120;
        canvas.getContext("2d").drawImage(img, sx, sy, size, size, 0, 0, 120, 120);
        pendingSnsIcon = canvas.toDataURL("image/jpeg", 0.85);
        const preview = document.getElementById("sns-icon-preview");
        if(preview){ preview.style.backgroundImage = `url('${pendingSnsIcon}')`; preview.style.display = "block"; }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function watchDirty(id){
  const el = document.getElementById(id);
  if(!el) return;
  new MutationObserver((mutations) => {
    const relevant = mutations.some(m => !(m.type === "attributes" && m.attributeName === "style"));
    if(relevant) hasUnsavedChanges = true;
  }).observe(el, { childList: true, subtree: true, characterData: true, attributes: true });
}

    if(modalEditTarget){ modalEditTarget.outerHTML = html; } else { document.getElementById("info-list").insertAdjacentHTML("beforeend", html); }
  } else if(modalType === "career"){
    const photo = pendingCareerPhoto || modalOriginalCareerPhoto || "";
    const item = { date: val("f-date","20XX年X月"), event: val("f-event","できごと"), url: val("f-url",""), photo };
    if(modalEditTarget){
      const parentGroup = modalEditTarget.closest(".year-group");
      modalEditTarget.remove();
      if(parentGroup && !parentGroup.querySelector(".tl-item")) parentGroup.remove();
      insertCareerItem(item);
    } else {
      insertCareerItem(item);
    }
  } else if(modalType === "sns"){
    const icon = pendingSnsIcon || modalOriginalSnsIcon || "";
    const html = snsIconHTML({ platform: pendingSnsPlatform, label: pendingSnsPlatform === "other" ? val("f-snslabel","Web") : "", url: val("f-url",""), icon });
    if(modalEditTarget){ modalEditTarget.outerHTML = html; } else { document.getElementById("sns-links-row").insertAdjacentHTML("beforeend", html); }
  } else if(modalType === "profilePhoto"){
    if(!(cropState && cropState.hasImage)){ alert("写真を選択してください"); return; }
    const dataUrl = getCroppedDataUrl(480, 480);
    const photoEl = document.getElementById("p-photo");
    photoEl.style.backgroundImage = `url('${dataUrl}')`;
    photoEl.classList.add("has-photo");
    hasUnsavedChanges = true;
  }
  setEditable(editMode);
  closeModal();
});

/* 既存項目の編集(✎) */
function openEditModal(card){
  if(card.classList.contains("info-row")){
    openModal("info", {
      editTarget: card,
      label: card.querySelector(".info-label")?.textContent || "",
      value: card.querySelector(".info-value")?.textContent || "",
      url: card.dataset.url || "",
    });
  } else if(card.classList.contains("tl-item")){
    openModal("career", {
      editTarget: card,
      date: card.querySelector(".tl-date")?.textContent || "",
      event: card.querySelector("p")?.textContent || "",
      url: card.dataset.url || "",
      careerPhoto: card.dataset.photo || "",
    });
  } else if(card.classList.contains("sns-icon-item")){
    openModal("sns", {
      editTarget: card,
      platform: card.dataset.platform || "x",
      snslabel: card.dataset.label || "",
      url: card.querySelector(".sns-icon-link")?.getAttribute("href") || "",
      icon: card.dataset.icon || "",
    });
  }
}
document.addEventListener("click", (e) => {
  if(e.target.closest(".edit-edit")){
    const card = e.target.closest(".info-row, .tl-item, .sns-icon-item");
    if(card) openEditModal(card);
    return;
  }
  if(e.target.classList.contains("edit-remove")){
    const card = e.target.closest(".info-row, .tl-item, .sns-icon-item");
    if(card){
      const parentGroup = card.closest(".year-group");
      card.remove();
      if(parentGroup && !parentGroup.querySelector(".tl-item")) parentGroup.remove();
    }
    return;
  }
  const upBtn = e.target.closest(".move-up");
  const downBtn = e.target.closest(".move-down");
  if(upBtn || downBtn){
    const card = e.target.closest(".info-row");
    if(card && card.parentElement){
      if(upBtn && card.previousElementSibling){ card.parentElement.insertBefore(card, card.previousElementSibling); }
      if(downBtn && card.nextElementSibling){ card.parentElement.insertBefore(card.nextElementSibling, card); }
      hasUnsavedChanges = true;
    }
  }
});
/* @EDIT_ONLY_END */

/* ---------- データのエクスポート・インポート(JSON) ---------- */
/* @EDIT_ONLY_START */
function extractProfileData(){
  const photoEl = document.getElementById("p-photo");
  const photoMatch = (photoEl.style.backgroundImage || "").match(/url\(["']?(.+?)["']?\)$/);
  return {
    name: document.getElementById("p-name").textContent,
    kana: document.getElementById("p-kana").textContent,
    catch: document.getElementById("p-catch").textContent,
    photo: photoMatch ? photoMatch[1] : "",
    basicInfo: Array.from(document.querySelectorAll("#info-list .info-row")).map(el => ({
      label: el.querySelector(".info-label")?.textContent || "",
      value: el.querySelector(".info-value")?.textContent || "",
      url: el.dataset.url || "",
    })),
    sns: Array.from(document.querySelectorAll("#sns-links-row .sns-icon-item")).map(el => ({
      platform: el.dataset.platform || "x",
      label: el.dataset.label || "",
      url: el.querySelector(".sns-icon-link")?.getAttribute("href") || "",
      icon: el.dataset.icon || "",
    })),
    career: Array.from(document.querySelectorAll("#career-list .tl-item")).map(el => ({
      date: el.querySelector(".tl-date")?.textContent || "",
      event: el.querySelector("p")?.textContent || "",
      url: el.dataset.url || "",
      photo: el.dataset.photo || "",
    })),
    bio: document.getElementById("bio-text").textContent,
    sectionText: Object.fromEntries(["basic-info","career","bio"].map(key => [
      key,
      {
        heading: document.getElementById(key + "-heading")?.textContent || "",
        desc: document.getElementById(key + "-desc")?.textContent || "",
      },
    ])),
  };
}
/* @EDIT_ONLY_END */
function rebuildProfileFromData(data){
  if(data.name !== undefined) document.getElementById("p-name").textContent = data.name;
  if(data.kana !== undefined) document.getElementById("p-kana").textContent = data.kana;
  if(data.catch !== undefined) document.getElementById("p-catch").textContent = data.catch;
  if(data.photo){
    const photoEl = document.getElementById("p-photo");
    photoEl.style.backgroundImage = `url('${data.photo}')`;
    photoEl.classList.add("has-photo");
  }
  if(data.basicInfo) document.getElementById("info-list").innerHTML = data.basicInfo.map(infoRowHTML).join("");
  if(data.sns) document.getElementById("sns-links-row").innerHTML = data.sns.map(snsIconHTML).join("");
  if(data.career){
    document.getElementById("career-list").innerHTML = "";
    data.career.forEach(insertCareerItem);
  }
  if(data.bio !== undefined) document.getElementById("bio-text").textContent = data.bio;
  if(data.sectionText){
    Object.keys(data.sectionText).forEach(key => {
      const h = document.getElementById(key + "-heading");
      const d = document.getElementById(key + "-desc");
      if(h) h.textContent = data.sectionText[key].heading;
      if(d) d.textContent = data.sectionText[key].desc;
    });
  }
  setEditable(editMode);
  syncOgpTags();
  hasUnsavedChanges = true;
}
/* @EDIT_ONLY_START */
document.getElementById("export-data").addEventListener("click", () => {
  const json = JSON.stringify(extractProfileData(), null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "member-profile-data.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  hasUnsavedChanges = false;
});
document.getElementById("import-data").addEventListener("click", () => {
  document.getElementById("import-file-input").click();
});
document.getElementById("import-file-input").addEventListener("change", (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  if(!confirm("現在の内容を、選んだファイルの内容で上書きします。よろしいですか?")) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      rebuildProfileFromData(data);
      alert("データを読み込みました。内容を確認して「🌐 公開用HTMLを書き出す」または「📤 データを書き出し」をご利用ください。");
    }catch(err){
      alert("ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。");
    }
  };
  reader.readAsText(file);
});
/* @EDIT_ONLY_END */

/* 編集モード中は、リンク化された項目をタップしても遷移させず編集を優先 */
document.addEventListener("click", (e) => {
  if(!document.body.classList.contains("editing")) return;
  const link = e.target.closest("a.info-link, a.tl-link, a.sns-icon-link");
  if(link) e.preventDefault();
});

/* タップ数の計測(GA4イベント) */
document.addEventListener("click", (e) => {
  const link = e.target.closest("a[href]");
  if(!link) return;
  if(typeof gtag === "function"){
    const label = (link.textContent || "").trim().slice(0, 60) || link.getAttribute("href");
    gtag("event", "tap", { event_category: "link", event_label: label });
  }
});

/* 公開用HTML(編集機能を削除した閲覧専用版)を書き出す */
/* @EDIT_ONLY_START */
function generatePublicHtml(){
  const clone = document.documentElement.cloneNode(true);
  clone.querySelectorAll(".edit-toolbar, #modal-backdrop, .edit-edit, .edit-remove, .add-row, .reorder-row").forEach(el => el.remove());
  const cloneBody = clone.querySelector("body");
  if(cloneBody) cloneBody.classList.remove("editing");
  const scripts = clone.querySelectorAll("script");
  const mainScript = scripts[scripts.length - 1];
  if(mainScript){
    mainScript.textContent = mainScript.textContent.replace(/\/\* @EDIT_ONLY_START \*\/[\s\S]*?\/\* @EDIT_ONLY_END \*\//g, "");
  }
  const htmlOut = "<!DOCTYPE html>\n" + clone.outerHTML;
  const blob = new Blob([htmlOut], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "member-profile-public.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
publicHtmlBtn.addEventListener("click", generatePublicHtml);
/* @EDIT_ONLY_END */

/* ---------- 同じ場所にある member-profile-data.json があれば自動で読み込む ----------
   ・https(またはローカルサーバー)環境でのみ動作します(file:// では読み込めません)
   ・見つかった場合は、そちらの内容でページを上書きします
   ・見つからない/読み込めない場合は、何も起きず今の内容のまま表示されます */
(async function loadExternalDataIfAvailable(){
  try{
    const res = await fetch("member-profile-data.json", { cache: "no-store" });
    if(!res.ok) return;
    const data = await res.json();
    rebuildProfileFromData(data);
    hasUnsavedChanges = false;
  }catch(e){
    /* file:// で開いている場合や、ファイルが存在しない場合はここに来ます。何もしません */
  }
})();
