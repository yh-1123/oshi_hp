<script>
/* ---------- サイト全体のお知らせバナー(index.htmlで編集・書き出し) ---------- */
function renderSiteBanner(data){
  const banner = document.getElementById("site-banner");
  if(!banner) return;
  if(!data || !data.active || !data.text){ banner.style.display = "none"; return; }
  let dismissed = "";
  try{ dismissed = localStorage.getItem("oshi_banner_dismissed") || ""; }catch(e){ /* localStorage不可の環境 */ }
  document.getElementById("site-banner-text").textContent = data.text;
  document.getElementById("site-banner-link").href = data.url || "#";
  banner.style.display = (dismissed === data.text) ? "none" : "block";
}
document.getElementById("site-banner-close")?.addEventListener("click", () => {
  const text = document.getElementById("site-banner-text").textContent.trim();
  try{ localStorage.setItem("oshi_banner_dismissed", text); }catch(e){ /* localStorage不可の環境 */ }
  document.getElementById("site-banner").style.display = "none";
});
(async function loadBannerIfAvailable(){
  try{
    if(location.href.indexOf("file://") === 0) return;
    const res = await fetch("announcement-data.json?_=" + Date.now(), { cache: "no-store" });
    if(!res.ok) return;
    const data = await res.json();
    renderSiteBanner(data);
  }catch(e){ /* ファイルが無い場合は何もしない */ }
})();

/* ---------- 更新ログのデータ ---------- */
function escapeHtml(str){
  return String(str || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
const DEFAULT_PAGES = [
  { date:"2026.09", title:"サイトを公開しました", desc:"" },
];
const REORDER_ROW = '<div class="reorder-row"><button type="button" class="reorder-btn move-up">↑ 上へ</button><button type="button" class="reorder-btn move-down">↓ 下へ</button></div>';
function pageCardHTML(p){
  return `<div class="page-card" data-date="${escapeHtml(p.date)}">
    <button type="button" class="edit-edit" aria-label="編集">✎</button>
    <button type="button" class="edit-remove" aria-label="削除">×</button>
    <span class="page-icon editable" contenteditable="false">${escapeHtml(p.date)}</span>
    <span class="page-body">
      <span class="page-title editable" contenteditable="false">${escapeHtml(p.title)}</span>
      <span class="page-desc editable" contenteditable="false">${escapeHtml(p.desc)}</span>
      ${REORDER_ROW}
    </span>
  </div>`;
}
function renderPageList(pages){
  document.getElementById("page-list").innerHTML = pages.map(pageCardHTML).join("");
}
renderPageList(DEFAULT_PAGES);


/* ---------- 編集モード ---------- */
const EDIT_PASSWORD_HASH = "ce9d9c91a8374c694448bdb6f6591003c96353d8eaf6ee9e32c7e47d47c1ac14";
async function sha256Hex(text){
  if(!window.crypto || !window.crypto.subtle){ return Promise.reject(new Error("subtlecrypto-unavailable")); }
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
}
let authenticated = false;
let editMode = false;
let hasUnsavedChanges = false;
function setEditable(on){ document.querySelectorAll(".editable").forEach(el => { el.contentEditable = on; }); }
const editToggleBtn = document.getElementById("toggle-edit");
function enterEditMode(){
  editMode = true;
  setEditable(true);
  document.body.classList.add("editing");
  editToggleBtn.textContent = "編集を終える";
  document.getElementById("generate-public-html").style.display = "inline-flex";
  document.getElementById("export-data").style.display = "inline-flex";
  document.getElementById("import-data").style.display = "inline-flex";
}
function exitEditMode(){
  editMode = false;
  setEditable(false);
  document.body.classList.remove("editing");
  editToggleBtn.textContent = "編集する";
  document.getElementById("generate-public-html").style.display = "none";
  document.getElementById("export-data").style.display = "none";
  document.getElementById("import-data").style.display = "none";
}
function closePasswordModal(){
  document.getElementById("modal-backdrop").classList.remove("open");
}
function requestEditAccess(){
  if(authenticated){ enterEditMode(); return; }
  modalType = "password";
  document.getElementById("modal-title").textContent = "編集用パスワード";
  document.getElementById("modal-fields").innerHTML = `<div class="qa-label">編集用パスワード</div><input class="qa-input" type="password" id="f-password" placeholder="パスワードを入力">`;
  document.getElementById("modal-submit").textContent = "確認する";
  document.getElementById("modal-backdrop").classList.add("open");
}
editToggleBtn?.addEventListener("click", () => { if(editMode){ exitEditMode(); } else { requestEditAccess(); } });
/* フッターの文字を2秒以内に5回タップすると、編集ツールバーが出てくる */
(function initSecretUnlock(){
  const target = document.querySelector("footer");
  const toolbar = document.querySelector(".edit-toolbar");
  if(!target || !toolbar) return;
  let tapCount = 0, resetTimer = null;
  target.addEventListener("click", () => {
    tapCount++;
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { tapCount = 0; }, 2000);
    if(tapCount >= 5){ tapCount = 0; toolbar.classList.add("unlocked"); }
  });
})();

/* ---------- モーダル(更新履歴の追加・編集) ---------- */
let modalType = null;
let modalEditTarget = null;
function val(id, fallback){ return document.getElementById(id)?.value.trim() || fallback; }
function openAddModal(){
  modalType = "page";
  modalEditTarget = null;
  document.getElementById("modal-title").textContent = "更新履歴を追加";
  document.getElementById("modal-fields").innerHTML = `
    <div class="qa-label">日付</div><input type="date" class="qa-input" id="f-date">
    <div class="qa-label">更新内容</div><input class="qa-input" id="f-title" placeholder="例:年表・名言集ページを追加しました">
    <div class="qa-label">詳細(任意・改行できます)</div><textarea class="qa-input" id="f-desc" placeholder="例:○期生として活動を開始" style="min-height:60px; resize:vertical; font-family:inherit;"></textarea>`;
  document.getElementById("modal-submit").textContent = "追加する";
  document.getElementById("modal-backdrop").classList.add("open");
}
function openEditModal(card){
  modalType = "page";
  modalEditTarget = card;
  document.getElementById("modal-title").textContent = "更新履歴を編集";
  document.getElementById("modal-fields").innerHTML = `
    <div class="qa-label">日付</div><input type="date" class="qa-input" id="f-date" value="${escapeHtml(card.querySelector(".page-icon")?.textContent || "")}">
    <div class="qa-label">更新内容</div><input class="qa-input" id="f-title" value="${escapeHtml(card.querySelector(".page-title")?.textContent || "")}">
    <div class="qa-label">詳細(任意・改行できます)</div><textarea class="qa-input" id="f-desc" style="min-height:60px; resize:vertical; font-family:inherit;">${escapeHtml(card.querySelector(".page-desc")?.textContent || "")}</textarea>`;
  document.getElementById("modal-submit").textContent = "更新する";
  document.getElementById("modal-backdrop").classList.add("open");
}
document.getElementById("add-page")?.addEventListener("click", openAddModal);
document.getElementById("modal-cancel")?.addEventListener("click", closePasswordModal);
document.getElementById("modal-backdrop")?.addEventListener("click", (e) => { if(e.target.id === "modal-backdrop") closePasswordModal(); });
document.getElementById("modal-submit")?.addEventListener("click", () => {
  if(modalType === "password"){
    const pw = val("f-password", "");
    sha256Hex(pw).then(hash => {
      if(hash !== EDIT_PASSWORD_HASH){ alert("パスワードが違います"); return; }
      authenticated = true;
      closePasswordModal();
      enterEditMode();
    }).catch(() => {
      alert("この環境ではパスワード確認に必要な機能が使えません。実際に公開したURL(https)で開いてお試しください。");
    });
    return;
  }
  if(modalType === "page"){
    const html = pageCardHTML({ date: val("f-date","2026-09-01"), title: val("f-title","更新内容"), desc: val("f-desc","") });
    if(modalEditTarget){ modalEditTarget.outerHTML = html; } else { document.getElementById("page-list").insertAdjacentHTML("beforeend", html); }
    hasUnsavedChanges = true;
  }
  closePasswordModal();
});

/* ---------- 一覧内の編集・削除・並び替え ---------- */
document.getElementById("page-list").addEventListener("click", (e) => {
  const card = e.target.closest(".page-card");
  if(!card) return;
  if(e.target.closest(".edit-edit")){ e.preventDefault(); openEditModal(card); return; }
  if(e.target.closest(".edit-remove")){
    e.preventDefault();
    if(confirm("この更新履歴を削除しますか？")){ card.remove(); hasUnsavedChanges = true; }
    return;
  }
  if(e.target.closest(".move-up")){
    e.preventDefault();
    const prev = card.previousElementSibling;
    if(prev) card.parentNode.insertBefore(card, prev);
    hasUnsavedChanges = true;
    return;
  }
  if(e.target.closest(".move-down")){
    e.preventDefault();
    const next = card.nextElementSibling;
    if(next) card.parentNode.insertBefore(next, card);
    hasUnsavedChanges = true;
    return;
  }
  if(editMode) e.preventDefault(); /* 編集モード中はリンク先へ飛ばない */
});

/* ---------- データの書き出し・読み込み ---------- */
function extractSitemapData(){
  return {
    title: document.getElementById("s-title").textContent,
    desc: document.getElementById("s-desc").textContent,
    pages: Array.from(document.querySelectorAll("#page-list .page-card")).map(el => ({
      date: el.querySelector(".page-icon")?.textContent || "",
      title: el.querySelector(".page-title")?.textContent || "",
      desc: el.querySelector(".page-desc")?.textContent || "",
    })),
  };
}
function rebuildSitemapData(data){
  if(!data) return;
  if(data.title !== undefined) document.getElementById("s-title").textContent = data.title;
  if(data.desc !== undefined) document.getElementById("s-desc").textContent = data.desc;
  if(Array.isArray(data.pages)) renderPageList(data.pages);
  setEditable(editMode);
}
document.getElementById("export-data")?.addEventListener("click", () => {
  const json = JSON.stringify(extractSitemapData(), null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "updates-data.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  hasUnsavedChanges = false;
});
document.getElementById("import-data")?.addEventListener("click", () => {
  document.getElementById("import-file-input").click();
});
document.getElementById("import-file-input")?.addEventListener("change", (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  if(!confirm("現在の内容を、選んだファイルの内容で上書きします。よろしいですか？")) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      rebuildSitemapData(data);
      alert("データを読み込みました。");
    }catch(err){
      alert("ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。");
    }
  };
  reader.readAsText(file);
});

/* 公開用HTML(編集機能を削除した閲覧専用版)を書き出す */
function generatePublicHtml(){
  const clone = document.documentElement.cloneNode(true);
  clone.querySelectorAll(".edit-toolbar, #modal-backdrop, .edit-edit, .edit-remove, .add-row, .reorder-row").forEach(el => el.remove());
  clone.querySelectorAll("[contenteditable]").forEach(el => el.removeAttribute("contenteditable"));
  const cloneBody = clone.querySelector("body");
  if(cloneBody) cloneBody.classList.remove("editing");
  const htmlOut = "<!DOCTYPE html>\n" + clone.outerHTML;
  const blob = new Blob([htmlOut], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "updates.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById("generate-public-html")?.addEventListener("click", generatePublicHtml);
window.addEventListener("beforeunload", (e) => {
  if(hasUnsavedChanges){ e.preventDefault(); e.returnValue = ""; }
});

/* ---------- 同じ場所にある sitemap-data.json があれば自動で読み込む ---------- */
(async function loadSitemapDataIfAvailable(){
  try{
    if(location.href.indexOf("file://") === 0) return;
    const res = await fetch("updates-data.json?_=" + Date.now(), { cache: "no-store" });
    if(!res.ok) return;
    const data = await res.json();
    rebuildSitemapData(data);
    hasUnsavedChanges = false;
  }catch(e){ /* ファイルが無い場合は何もしない */ }
})();

document.getElementById("dark-mode-toggle")?.addEventListener("click", () => {
  const isDark = document.documentElement.classList.toggle("dark-mode");
  try{ localStorage.setItem("oshi_dark_mode", isDark ? "1" : "0"); }catch(e){ /* localStorage不可の環境 */ }
});
