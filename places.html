<title>推しゆかりの場所まとめ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root{
  --oshi-color: #e0233a;
  --oshi-color-deep: #b81b30;
  --oshi-color-soft: #ffe2e6;
  --accent2: #ece6e8;
  --ink: #2b2331;
  --sub-ink: #7d6b78;
  --paper: #fffaf9;
  --line: #f0dde6;
  --card: #ffffff;
  --shadow-sm: 0 2px 10px rgba(43,35,49,0.06);
  --shadow-md: 0 10px 26px rgba(43,35,49,0.12);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--oshi-color); outline-offset:2px; border-radius:4px;
}
html{ scroll-behavior:smooth; }
body{ font-family:'Noto Sans JP', sans-serif; background:var(--paper); color:var(--ink); line-height:1.75; overflow-x:hidden; padding-bottom:72px; font-size:15px; }
h1,h2,h3,.brand{ font-family:'Zen Maru Gothic', sans-serif; }
a{ color:inherit; text-decoration:none; }
.wrap{ max-width:640px; margin:0 auto; padding:0 18px; }

.topnav{ position:sticky; top:0; z-index:50; background:rgba(255,250,249,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
.topnav .wrap{ display:flex; align-items:center; justify-content:space-between; height:46px; }
.back-link{ font-size:12.5px; font-weight:700; color:var(--oshi-color); }
.brand{ font-size:12px; color:var(--sub-ink); }
.nav-icons{ display:flex; align-items:center; gap:10px; }
.nav-icon-btn{ flex:none; border:none; background:transparent; font-size:15px; cursor:pointer; padding:4px 2px; color:var(--sub-ink); line-height:1; }
.nav-icon-btn:hover{ color:var(--oshi-color); }

.p-hero{ position:relative; padding:26px 0 18px; text-align:center; overflow:hidden; }
.p-hero::before{
  content:""; position:absolute; top:4px; left:50%; width:170px; height:120px; transform:translateX(-50%);
  background:radial-gradient(circle, var(--oshi-color-soft) 0%, transparent 68%);
  opacity:0.9; pointer-events:none;
}
.p-hero .eyebrow{ position:relative; display:inline-block; font-size:10px; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:999px; padding:3px 10px; margin-bottom:9px; font-weight:700; }
.p-hero h1{ position:relative; font-size:clamp(19px,6.6vw,25px); font-weight:900; }
.p-hero p{ position:relative; margin:9px auto 0; max-width:420px; font-size:12.5px; color:var(--sub-ink); }

.search-wrap{ position:relative; margin-top:16px; }
.search-input{
  width:100%; border:1px solid var(--line); border-radius:999px; padding:11px 16px; font-size:13px;
  font-family:inherit; background:#fff; color:var(--ink); box-shadow:var(--shadow-sm);
}
.search-input:focus{ outline:2px solid var(--oshi-color); outline-offset:1px; }
.category-filter{ display:none; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
.category-filter.show{ display:flex; }
.tag-filter-btn{
  border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:10.5px; font-weight:700;
  padding:5px 12px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.tag-filter-btn.active{ background:var(--oshi-color); border-color:var(--oshi-color); color:#fff; }

section{ padding:26px 0 30px; }
.sec-head{ margin-bottom:16px; }
.sec-head h2{ font-size:16.5px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
.sec-head h2 .mark{ color:var(--oshi-color); font-size:14px; }
.sec-head p{ color:var(--sub-ink); font-size:12px; margin-top:4px; }
.no-results{ display:none; text-align:center; color:var(--sub-ink); font-size:12.5px; padding:20px 0; }
.no-results.show{ display:block; }

/* 場所カード */
.place-list{ display:flex; flex-direction:column; gap:14px; }
.place-item{ position:relative; padding:16px 84px 16px 16px; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-sm); }
.place-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.place-category{ font-size:10px; font-weight:700; color:#fff; background:var(--oshi-color); border-radius:6px; padding:2px 9px; }
.place-source{ font-size:10px; font-weight:700; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:6px; padding:2px 9px; }
.place-new-badge{ font-size:10px; font-weight:700; color:#7a5c00; background:#ffd447; border-radius:6px; padding:2px 9px; }
.place-status-badge{ font-size:10px; font-weight:700; border-radius:6px; padding:2px 9px; }
.place-status-badge.status-closed{ background:#e6e6e6; color:#555; }
.place-status-badge.status-stale{ background:#fff1b8; color:#8a6d00; }
.status-select{ display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; }
.status-btn{ flex:1 1 86px; border:1.5px solid var(--line); background:#fff; color:var(--sub-ink); font-size:11.5px; font-weight:700; padding:8px 4px; border-radius:10px; cursor:pointer; font-family:inherit; }
.status-btn.active{ border-color:var(--oshi-color); color:var(--oshi-color); background:var(--oshi-color-soft); }
.place-name{ font-size:14px; font-weight:700; margin-bottom:2px; }
.place-area{ font-size:11.5px; color:var(--sub-ink); margin-bottom:6px; display:flex; align-items:center; gap:4px; }
.place-body{ font-size:13px; white-space:pre-line; }
.place-visit{ font-size:10px; font-weight:700; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:6px; padding:2px 9px; }
.place-recommend{
  margin-top:10px; background:#fffaf0; border:1px dashed #e0a800; border-radius:10px; padding:10px 12px;
  font-size:12.5px; color:#7a5c00;
}
.place-recommend-mark{ display:block; font-size:10.5px; font-weight:700; color:#c98a00; margin-bottom:3px; }
.place-photo{ width:100%; max-width:280px; border-radius:10px; margin-top:10px; display:block; box-shadow:var(--shadow-sm); }
.place-gallery{ display:flex; gap:8px; overflow-x:auto; margin-top:10px; padding-bottom:2px; scroll-snap-type:x mandatory; scrollbar-width:none; }
.place-gallery::-webkit-scrollbar{ display:none; }
.place-gallery-img{ flex:0 0 78%; max-width:280px; aspect-ratio:4/3; object-fit:cover; border-radius:10px; box-shadow:var(--shadow-sm); scroll-snap-align:start; }

/* 今日のピックアップ */
.daily-pick{ display:none; margin-top:16px; text-align:left; background:linear-gradient(135deg, var(--oshi-color-soft), #fff); border:1px solid var(--oshi-color); border-radius:14px; padding:14px 16px; cursor:pointer; }
.daily-pick.show{ display:block; }
.daily-pick-label{ font-size:10px; font-weight:700; color:var(--oshi-color); }
.daily-pick-title{ font-size:14px; font-weight:700; margin-top:4px; }
.daily-pick-body{ font-size:12.5px; color:var(--sub-ink); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* 表示切り替え(通常/エリア別/時系列) */
.sec-head-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.view-mode-group{ display:flex; gap:6px; margin-bottom:2px; }
.view-mode-btn{
  flex:none; border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:10.5px; font-weight:700;
  padding:6px 11px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.view-mode-btn.active{ background:var(--oshi-color); border-color:var(--oshi-color); color:#fff; }

/* 関連する場所リンク */
.place-related{ display:none; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; }
.related-label{ font-size:11px; color:var(--sub-ink); font-weight:700; }
.related-link-btn{ border:1px solid var(--line); background:#fff; color:var(--oshi-color); font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; cursor:pointer; font-family:inherit; }
.related-link-btn:hover{ background:var(--oshi-color-soft); }

.jp-map{ display:none; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
.jp-map.show{ display:flex; }
.jp-region{
  display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:#fff; border-radius:999px;
  padding:6px 12px; font-size:11px; font-weight:700; color:var(--sub-ink); cursor:pointer; transition:background .15s ease;
}
.jp-region.has-pin{ border-color:var(--oshi-color); color:var(--oshi-color); background:var(--oshi-color-soft); }
.jp-region.active{ background:var(--oshi-color); border-color:var(--oshi-color); color:#fff; }
.jp-region-pin{
  display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; border-radius:999px;
  background:var(--oshi-color); color:#fff; font-size:9px; font-weight:700; padding:0 4px;
}
.jp-region.active .jp-region-pin{ background:#fff; color:var(--oshi-color); }
.place-link-row{ display:flex; flex-wrap:wrap; gap:8px; }
.place-map-link{
  display:inline-flex; align-items:center; gap:5px; margin-top:10px; border:1px solid var(--oshi-color); background:#fff;
  color:var(--oshi-color); font-size:11.5px; font-weight:700; padding:6px 13px; border-radius:999px;
}
.place-map-link:hover{ background:var(--oshi-color-soft); }
@keyframes placeFlash{ 0%,100%{ box-shadow:var(--shadow-sm); } 30%{ box-shadow:0 0 0 4px var(--oshi-color-soft), var(--shadow-md); } }
.place-flash{ animation: placeFlash 1.4s ease; }

.load-more-btn{
  display:flex; align-items:center; justify-content:center; width:100%; margin-top:14px;
  border:1px solid var(--line); background:#fff; color:var(--oshi-color); font-weight:700; font-size:12.5px;
  padding:10px 16px; border-radius:12px; cursor:pointer; font-family:inherit; transition:background .15s ease;
}
.load-more-btn:hover{ background:var(--oshi-color-soft); }

footer{ text-align:center; padding:30px 0 16px; color:var(--sub-ink); font-size:11px; }
.last-updated{ margin-top:8px; font-size:10.5px; color:var(--sub-ink); }
.last-updated:empty{ display:none; }

.back-to-top{
  position:fixed; right:16px; bottom:78px; z-index:90; width:42px; height:42px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--oshi-color); font-size:18px; cursor:pointer;
  box-shadow:0 6px 18px rgba(43,35,49,0.15); display:none; align-items:center; justify-content:center;
  opacity:0; transition:opacity .2s ease;
}
.back-to-top.show{ display:flex; opacity:1; }
.back-to-top:hover{ background:var(--oshi-color-soft); }

/* 編集モード */
.editable{ outline:none; }
body.editing .editable{ outline:1.5px dashed var(--oshi-color); outline-offset:2px; border-radius:4px; cursor:text; }
body.editing .editable:hover{ background:var(--oshi-color-soft); }
.edit-remove{
  display:none; position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:16px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
.edit-edit{
  display:none; position:absolute; top:8px; right:44px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:14px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
body.editing .edit-remove, body.editing .edit-edit{ display:flex; }
body.editing .edit-remove:hover, body.editing .edit-edit:hover{ background:var(--oshi-color); color:#fff; border-color:var(--oshi-color); }

.reorder-row{ display:none; gap:6px; margin-top:10px; }
body.editing .reorder-row{ display:flex; }
.reorder-btn{
  border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:10.5px; font-weight:700;
  padding:4px 10px; border-radius:8px; cursor:pointer; font-family:inherit;
}
.reorder-btn:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }

.add-row{ display:none; margin-top:12px; }
body.editing .add-row{ display:flex; }
.add-btn{
  border:1.5px dashed var(--oshi-color); color:var(--oshi-color); background:#fff; border-radius:12px;
  padding:9px 16px; font-size:12.5px; font-weight:700; cursor:pointer; width:100%; text-align:center;
  transition:background .15s ease;
}
.add-btn:hover{ background:var(--oshi-color-soft); }

.edit-toolbar{
  display:none; position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
  border-radius:999px; padding:7px 8px; box-shadow:0 8px 24px rgba(43,35,49,0.18); z-index:100;
  max-width:94vw; overflow-x:auto; scrollbar-width:none;
}
.edit-toolbar.unlocked{ display:flex; }
.edit-toolbar::-webkit-scrollbar{ display:none; }
#footer-tap-target{ cursor:default; -webkit-tap-highlight-color:transparent; user-select:none; display:inline-block; }
.tb-btn{ flex:none; border:none; border-radius:999px; padding:9px 15px; font-size:12px; font-weight:700; cursor:pointer; background:var(--paper); color:var(--ink); white-space:nowrap; transition:background .15s ease; }
.tb-btn.primary{ background:var(--oshi-color); color:#fff; }
.tb-btn.primary:hover{ background:var(--oshi-color-deep); }
.tb-btn-icon{
  flex:none; border:none; border-radius:50%; width:34px; height:34px; font-size:14px; cursor:pointer;
  background:var(--paper); color:var(--ink); display:inline-flex; align-items:center; justify-content:center;
}
.tb-btn-icon:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }

.modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(43,35,49,0.45); z-index:200; align-items:center; justify-content:center; padding:20px; }
.modal-backdrop.open{ display:flex; }
.modal{ background:#fff; border-radius:18px; padding:20px; width:100%; max-width:380px; max-height:84vh; overflow-y:auto; }
.modal h3{ font-size:15px; margin-bottom:14px; }
.qa-label{ font-size:11px; color:var(--sub-ink); margin-top:12px; margin-bottom:2px; }
.qa-label:first-child{ margin-top:0; }
.qa-input{ border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); width:100%; }
.qa-textarea{ border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); width:100%; min-height:90px; resize:vertical; }
.qa-input:focus, .qa-textarea:focus{ outline:2px solid var(--oshi-color); outline-offset:1px; }
.photo-preview{ width:100%; aspect-ratio:16/9; background-size:cover; background-position:center; border-radius:10px; margin-top:6px; border:1px solid var(--line); display:none; }
.sns-icon-preview{ width:56px; height:56px; border-radius:50%; background:var(--oshi-color-soft) center/cover; margin:6px auto 0; display:none; }
.place-sns-icon-img{ width:16px; height:16px; border-radius:50%; object-fit:cover; vertical-align:-3px; margin-right:2px; }
.photo-upload-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.photo-thumb{ position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; background-size:cover; background-position:center; border:1px solid var(--line); }
.photo-thumb-remove{ position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(20,20,20,0.7); color:#fff; border:none; font-size:10px; cursor:pointer; line-height:1; }
.category-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.category-chip{
  display:inline-flex; align-items:center; gap:5px; background:var(--oshi-color); color:#fff; font-size:11.5px;
  font-weight:700; padding:5px 8px 5px 12px; border-radius:999px;
}
.category-chip-remove{ border:none; background:rgba(255,255,255,0.3); color:#fff; width:16px; height:16px; border-radius:50%; font-size:10px; cursor:pointer; line-height:1; }
.category-input-row{ display:flex; gap:6px; margin-top:6px; }
.category-input-row .qa-input{ flex:1; }
.category-add-btn{
  flex:none; border:1px solid var(--oshi-color); background:#fff; color:var(--oshi-color); font-size:12px; font-weight:700;
  padding:0 14px; border-radius:10px; cursor:pointer; font-family:inherit;
}
.category-add-btn:hover{ background:var(--oshi-color-soft); }
.category-suggest-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
.category-suggest-label{ font-size:10.5px; color:var(--sub-ink); }
.category-suggest-btn{
  border:1px dashed var(--line); background:#fff; color:var(--sub-ink); font-size:11px; font-weight:700;
  padding:4px 10px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.category-suggest-btn:hover{ border-color:var(--oshi-color); color:var(--oshi-color); }
.modal-actions{ display:flex; gap:8px; margin-top:18px; }
.modal-actions button{ flex:1; }
.modal-actions .tb-btn{ background:var(--paper); border:1px solid var(--line); }
.modal-actions .add-btn{ border-style:solid; background:var(--oshi-color); color:#fff; }
.modal-actions .add-btn:hover{ background:var(--oshi-color-deep); }

@media (max-width:480px){
  .wrap{ padding:0 14px; }
  .p-hero{ padding:20px 0 14px; }
  section{ padding:20px 0 24px; }
}

/* ---------- 印刷用レイアウト ---------- */
@media print{
  .topnav, .edit-toolbar, .back-to-top, .search-wrap, .category-filter,
  .load-more-btn, .add-row, .edit-edit, .edit-remove, .reorder-row, .jp-map, .daily-pick, .view-mode-group{ display:none !important; }
  body{ padding-bottom:0; background:#fff; }
  .place-item{ break-inside:avoid; box-shadow:none; border:1px solid #ccc; }
  a{ text-decoration:underline; }
}
</style>

<nav class="topnav">

  </div>
</nav>

    <div class="daily-pick" id="daily-pick"></div>

      <button type="button" class="jp-region" data-key="chubu">中部</button>
      <button type="button" class="jp-region" data-key="kinki">近畿</button>

</header>

<section id="places">
  <div class="wrap">
    <div class="sec-head sec-head-row">
      <div>
        <h2><span class="mark">◆</span>場所一覧</h2>
      </div>

const EDIT_PASSWORD_HASH = "ce9d9c91a8374c694448bdb6f6591003c96353d8eaf6ee9e32c7e47d47c1ac14";
async function sha256Hex(text){
  if(!window.crypto || !window.crypto.subtle){ return Promise.reject(new Error("subtlecrypto-unavailable")); }
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
}
let authenticated = false;

function escHtml(s){ return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function isRecentlyAdded(addedAt){
  if(!addedAt) return false;
  const added = new Date(addedAt + "T00:00:00");
  if(isNaN(added.getTime())) return false;
  const diffDays = (new Date() - added) / (1000 * 60 * 60 * 24);
  return diffDays >= 0 && diffDays <= 7;
}
function mapsLinkFor(place){
  if(place.url) return place.url;
  const q = [place.name, place.area].filter(Boolean).join(" ");
  if(!q) return "";
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
}
const JAPAN_REGIONS = {
  hokkaido: { label: "北海道", keywords: ["北海道"] },
  tohoku: { label: "東北", keywords: ["青森","岩手","宮城","秋田","山形","福島"] },
  kanto: { label: "関東", keywords: ["東京","神奈川","埼玉","千葉","茨城","栃木","群馬"] },
  chubu: { label: "中部", keywords: ["新潟","富山","石川","福井","山梨","長野","岐阜","静岡","愛知"] },
  kinki: { label: "近畿", keywords: ["三重","滋賀","京都","大阪","兵庫","奈良","和歌山"] },
  chugoku: { label: "中国", keywords: ["鳥取","島根","岡山","広島","山口"] },

};
function regionFor(area){
  const text = String(area || "");
  for(const key in JAPAN_REGIONS){
    if(JAPAN_REGIONS[key].keywords.some(k => text.includes(k))) return key;

}
let placeOrderCounter = 0;
function normalizeCategories(p){
  if(Array.isArray(p.categories) && p.categories.length) return p.categories;
  if(typeof p.categories === "string" && p.categories.trim()) return p.categories.split("|||").map(s => s.trim()).filter(Boolean);
  if(p.category) return [p.category];
  return ["その他"];
}
function detectSnsPlatform(url){
  if(!url) return null;
  try{
    const host = new URL(url).hostname.replace(/^www\./, "");
    if(host === "x.com" || host === "twitter.com") return { label: "X", icon: "🐦" };
    if(host.endsWith("instagram.com")) return { label: "Instagram", icon: "📷" };
    if(host.endsWith("tiktok.com")) return { label: "TikTok", icon: "🎵" };
    if(host.endsWith("youtube.com") || host === "youtu.be") return { label: "YouTube", icon: "▶️" };
    if(host.endsWith("threads.net")) return { label: "Threads", icon: "🧵" };
    if(host.endsWith("line.me")) return { label: "LINE", icon: "💬" };
    if(host.endsWith("facebook.com")) return { label: "Facebook", icon: "📘" };
  }catch(e){ /* 不正なURLは無視 */ }
  return null;
}
function placeItemHTML(p){
  const photos = Array.isArray(p.photos) ? p.photos : (p.photo ? [p.photo] : []);
  const photosHtml = photos.length

  const newBadgeHtml = isRecentlyAdded(p.addedAt) ? `<span class="place-new-badge">NEW</span>` : "";
  const mapUrl = mapsLinkFor(p);
  const mapLinkHtml = mapUrl ? `<a class="place-map-link" href="${mapUrl}" target="_blank" rel="noopener">📍 地図で見る</a>` : "";
  const detectedSns = detectSnsPlatform(p.snsUrl);
  const snsLabel = p.snsLabel || (detectedSns ? detectedSns.label : "SNS");
  const snsIconDisplay = p.snsIcon ? `<img class="place-sns-icon-img" src="${p.snsIcon}" alt="">` : (detectedSns ? detectedSns.icon : "🔗");
  const snsLinkHtml = p.snsUrl ? `<a class="place-map-link place-sns-link" href="${p.snsUrl}" target="_blank" rel="noopener">${snsIconDisplay} ${escHtml(snsLabel)}を見る</a>` : "";
  const region = regionFor(p.area);
  const order = (p.order !== undefined && p.order !== "") ? p.order : placeOrderCounter++;
  const recommendHtml = p.recommend
    ? `<div class="place-recommend editable" contenteditable="false"><span class="place-recommend-mark">💡 おすすめポイント</span>${p.recommend}</div>`
    : `<div class="place-recommend editable" contenteditable="false" style="display:none;"><span class="place-recommend-mark">💡 おすすめポイント</span></div>`;
  const visitHtml = p.visitPeriod
    ? `<span class="place-visit editable" contenteditable="false">🗓 ${p.visitPeriod}</span>`
    : `<span class="place-visit editable" contenteditable="false" style="display:none;"></span>`;
  const relatedRaw = Array.isArray(p.related) ? p.related.join("|||") : (p.related || "");
  const categories = normalizeCategories(p);
  const categoriesRaw = categories.join("|||");
  const categoryBadgesHtml = categories.map(c => `<span class="place-category">${c}</span>`).join("");
  const statusBadgeHtml = p.status === "closed" ? `<span class="place-status-badge status-closed">⚠ 閉店・終了</span>`
    : p.status === "stale" ? `<span class="place-status-badge status-stale">⚠ 情報が古いかも</span>`
    : "";
  return `<div class="place-item" data-categories="${escAttr(categoriesRaw)}" data-area="${escAttr(p.area)}" data-url="${escAttr(p.url)}" data-sns="${escAttr(p.snsUrl)}" data-sns-label="${escAttr(p.snsLabel)}" data-sns-icon="${escAttr(p.snsIcon)}" data-status="${escAttr(p.status)}" data-photos="${escAttr(JSON.stringify(photos))}" data-added="${escAttr(p.addedAt)}" data-region="${region}" data-order="${order}" data-visit="${escAttr(p.visitPeriod)}" data-related="${escAttr(relatedRaw)}">
    <button class="edit-edit" aria-label="編集">✎</button>
    <button class="edit-remove" aria-label="削除">×</button>
    <div class="place-meta">
      ${newBadgeHtml}
      ${statusBadgeHtml}
      ${categoryBadgesHtml}
      ${visitHtml}
      ${sourceHtml}
    </div>
    <h3 class="place-name editable" contenteditable="false">${p.name}</h3>

/* ---------- 画像アップロード(複数対応・自動リサイズ) ---------- */
/* @EDIT_ONLY_START */
let pendingPlacePhotos = [];
let modalOriginalAddedAt = "";
let modalOriginalOrder = "";
const PLACE_PHOTO_MAX_DIMENSION = 900;
function renderPhotoUploadRow(){
  const wrap = document.getElementById("photo-upload-row");
  if(!wrap) return;
  wrap.innerHTML = pendingPlacePhotos.map((src, i) => `<div class="photo-thumb" style="background-image:url('${src}')"><button type="button" class="photo-thumb-remove" data-idx="${i}" aria-label="削除">×</button></div>`).join("");
}
function resizeImageFile(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, PLACE_PHOTO_MAX_DIMENSION / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function initPlacePhotoUpload(){
  const input = document.getElementById("f-photo-file");
  if(!input) return;
  input.addEventListener("change", async () => {
    const files = Array.from(input.files || []);
    for(const file of files){
      const dataUrl = await resizeImageFile(file);
      pendingPlacePhotos.push(dataUrl);
    }
    input.value = "";
    renderPhotoUploadRow();
  });
  const wrap = document.getElementById("photo-upload-row");
  if(wrap){
    wrap.addEventListener("click", (e) => {
      const btn = e.target.closest(".photo-thumb-remove");
      if(!btn) return;
      pendingPlacePhotos.splice(parseInt(btn.dataset.idx, 10), 1);
      renderPhotoUploadRow();
    });
  }
}

/* ---------- SNSアイコン画像アップロード(自動で正方形にトリミング) ---------- */
let pendingSnsIcon = "";
let modalOriginalSnsIcon = "";
function initSnsIconUpload(){
  const input = document.getElementById("f-sns-icon-file");
  if(!input) return;
  input.addEventListener("change", () => {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const size = Math.min(img.naturalWidth, img.naturalHeight);
        const sx = (img.naturalWidth - size) / 2;
        const sy = (img.naturalHeight - size) / 2;
        const canvas = document.createElement("canvas");
        canvas.width = 120; canvas.height = 120;
        canvas.getContext("2d").drawImage(img, sx, sy, size, size, 0, 0, 120, 120);
        pendingSnsIcon = canvas.toDataURL("image/jpeg", 0.85);
        const preview = document.getElementById("sns-icon-preview");
        if(preview){ preview.style.backgroundImage = `url('${pendingSnsIcon}')`; preview.style.display = "block"; }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let hasUnsavedChanges = false;

function watchDirty(id){
  const el = document.getElementById(id);
  if(!el) return;
  new MutationObserver((mutations) => {
    const relevant = mutations.some(m => !(m.type === "attributes" && m.attributeName === "style"));
    if(relevant) hasUnsavedChanges = true;
  }).observe(el, { childList: true, subtree: true, characterData: true, attributes: true });
}
["nav-brand","p-eyebrow","p-title","p-desc","place-list"].forEach(watchDirty);

/* ---------- カテゴリ絞り込み・検索・もっと見る ---------- */
let currentCategoryFilter = "all";
let currentRegionFilter = "";
let showAllItems = false;
const PLACE_INITIAL_VISIBLE = 6;
function currentSearchQuery(){
  const el = document.getElementById("place-search");
  return el ? el.value.trim().toLowerCase() : "";
}
function itemCategories(item){
  return (item.dataset.categories || "").split("|||").map(s => s.trim()).filter(Boolean);
}
function applyPlaceFilter(){
  const q = currentSearchQuery();
  const allItems = Array.from(document.querySelectorAll("#place-list .place-item"));
  const matched = allItems.filter(item => {
    const categoryOk = (currentCategoryFilter === "all" || itemCategories(item).includes(currentCategoryFilter));
    const regionOk = (!currentRegionFilter || item.dataset.region === currentRegionFilter);
    const searchOk = !q || item.textContent.toLowerCase().includes(q);
    return categoryOk && regionOk && searchOk;
  });
  const isNarrowed = currentCategoryFilter !== "all" || !!currentRegionFilter || !!q;
  const limitActive = !showAllItems && !isNarrowed && matched.length > PLACE_INITIAL_VISIBLE;
  allItems.forEach(item => { item.style.display = "none"; });
  matched.forEach((item, i) => {
    if(limitActive && i >= PLACE_INITIAL_VISIBLE) return;
    item.style.display = "";
  });
  document.getElementById("no-results").classList.toggle("show", matched.length === 0 && allItems.length > 0);
  const loadMoreBtn = document.getElementById("load-more-places");
  if(limitActive){
    loadMoreBtn.style.display = "flex";
    loadMoreBtn.textContent = `＋ もっと見る(残り${matched.length - PLACE_INITIAL_VISIBLE}件)`;
  } else {
    loadMoreBtn.style.display = "none";
  }
}
document.getElementById("load-more-places").addEventListener("click", () => { showAllItems = true; applyPlaceFilter(); });
function renderCategoryFilter(){
  const wrap = document.getElementById("category-filter");
  const cats = [];
  document.querySelectorAll("#place-list .place-item").forEach(item => {
    itemCategories(item).forEach(c => { if(!cats.includes(c)) cats.push(c); });
  });
  if(cats.length < 2){
    wrap.classList.remove("show");
    wrap.innerHTML = "";
    currentCategoryFilter = "all";
    applyPlaceFilter();
    return;
  }
  const current = cats.includes(currentCategoryFilter) ? currentCategoryFilter : "all";
  currentCategoryFilter = current;
  wrap.classList.add("show");
  wrap.innerHTML = [`<button type="button" class="tag-filter-btn${current === "all" ? " active" : ""}" data-cat="all">すべて</button>`]
    .concat(cats.map(c => `<button type="button" class="tag-filter-btn${current === c ? " active" : ""}" data-cat="${escAttr(c)}">${c}</button>`))
    .join("");
  applyPlaceFilter();
}
document.getElementById("category-filter").addEventListener("click", (e) => {
  const btn = e.target.closest(".tag-filter-btn");
  if(!btn) return;
  currentCategoryFilter = btn.dataset.cat;
  showAllItems = false;
  document.querySelectorAll("#category-filter .tag-filter-btn").forEach(b => b.classList.toggle("active", b === btn));
  applyPlaceFilter();
});
document.getElementById("place-search").addEventListener("input", () => { showAllItems = false; applyPlaceFilter(); });

/* ---------- 日本地図(地域ごとのピン) ---------- */
function renderJapanMap(){
  const items = Array.from(document.querySelectorAll("#place-list .place-item"));
  const counts = {};
  items.forEach(item => { const r = item.dataset.region; if(r) counts[r] = (counts[r] || 0) + 1; });
  const hasAny = Object.keys(counts).length > 0;
  document.getElementById("jp-map").classList.toggle("show", hasAny);
  document.querySelectorAll(".jp-region").forEach(btn => {
    const key = btn.dataset.key;
    const count = counts[key] || 0;
    btn.classList.toggle("has-pin", count > 0);
    btn.classList.toggle("active", currentRegionFilter === key);
    const existingPin = btn.querySelector(".jp-region-pin");
    if(existingPin) existingPin.remove();
    if(count > 0){
      const pin = document.createElement("span");
      pin.className = "jp-region-pin";
      pin.textContent = count;
      btn.appendChild(pin);
    }
  });
}
function toggleRegionFilter(key){
  currentRegionFilter = (currentRegionFilter === key) ? "" : key;
  showAllItems = true;
  renderJapanMap();

function hashString(s){
  let h = 0;
  for(let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

/* ---------- 表示切替(通常/エリア別/時系列) ---------- */
function visitSortKey(visitedAt){
  const m = String(visitedAt || "").match(/(\d{4})年?(?:(\d{1,2})月)?/);
  if(!m) return "0000-00";
  const y = m[1];
  const mo = (m[2] || "00").padStart(2, "0");
  return `${y}-${mo}`;
}
const REGION_ORDER = ["hokkaido","tohoku","kanto","chubu","kinki","chugoku","shikoku","kyushu"];
let currentViewMode = "normal";
function applyPlaceViewMode(){
  const list = document.getElementById("place-list");
  const items = Array.from(list.querySelectorAll(".place-item"));
  if(currentViewMode === "timeline"){
    items.sort((a, b) => {
      const ka = visitSortKey(a.dataset.visit);
      const kb = visitSortKey(b.dataset.visit);
      if(ka !== kb) return kb.localeCompare(ka);
      return (parseInt(a.dataset.order || "0", 10) - parseInt(b.dataset.order || "0", 10));
    });
  } else if(currentViewMode === "area"){
    items.sort((a, b) => {
      const ia = REGION_ORDER.indexOf(a.dataset.region); const ib = REGION_ORDER.indexOf(b.dataset.region);
      const ra = ia === -1 ? 999 : ia; const rb = ib === -1 ? 999 : ib;
      if(ra !== rb) return ra - rb;
      return (parseInt(a.dataset.order || "0", 10) - parseInt(b.dataset.order || "0", 10));
    });
  } else {
    items.sort((a, b) => (parseInt(a.dataset.order || "0", 10) - parseInt(b.dataset.order || "0", 10)));
  }
  items.forEach(item => list.appendChild(item));
  applyPlaceFilter();
}

function generatePublicHtml(){
  const clone = document.documentElement.cloneNode(true);
  clone.querySelectorAll(".edit-toolbar, #modal-backdrop, .edit-edit, .edit-remove, .add-row, .reorder-row").forEach(el => el.remove());
  const cloneBody = clone.querySelector("body");
  if(cloneBody) cloneBody.classList.remove("editing");
  const scripts = clone.querySelectorAll("script");
  const mainScript = scripts[scripts.length - 1];
  if(mainScript){
    mainScript.textContent = mainScript.textContent.replace(/\/\* @EDIT_ONLY_START \*\/[\s\S]*?\/\* @EDIT_ONLY_END \*\//g, "");
  }
  const htmlOut = "<!DOCTYPE html>\n" + clone.outerHTML;
  const blob = new Blob([htmlOut], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "places-public.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
publicHtmlBtn.addEventListener("click", generatePublicHtml);
/* @EDIT_ONLY_END */

/* ---------- 同じ場所にある places-data.json があれば自動で読み込む ----------
   ・https(またはローカルサーバー)環境でのみ動作します(file:// では読み込めません)
   ・見つかった場合は、そちらの内容でページを上書きします
   ・見つからない/読み込めない場合は、何も起きず今の内容のまま表示されます */
(async function loadExternalDataIfAvailable(){
  try{
    const res = await fetch("places-data.json", { cache: "no-store" });
    if(!res.ok) return;
    const data = await res.json();
    rebuildPlacesFromData(data);
    hasUnsavedChanges = false;
  }catch(e){
    /* file:// で開いている場合や、ファイルが存在しない場合はここに来ます。何もしません */
  }
})();
