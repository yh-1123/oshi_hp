<script>


const PLACES = {
  navBrand: "ゆかりの場所まとめ",
  eyebrow: "聖地巡礼・お店・旅行先",
  title: "推しゆかりの場所まとめ",
  desc: "配信やSNSで紹介していたお店や、旅行・撮影で訪れた場所をまとめています。巡礼の参考にどうぞ。",
  items: [],
};

const REORDER_ROW = '<div class="reorder-row"><button class="reorder-btn move-up" type="button">↑ 上へ</button><button class="reorder-btn move-down" type="button">↓ 下へ</button></div>';
function escHtml(s){ return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function isRecentlyAdded(addedAt){
  if(!addedAt) return false;
  const added = new Date(addedAt + "T00:00:00");
  if(isNaN(added.getTime())) return false;
  const diffDays = (new Date() - added) / (1000 * 60 * 60 * 24);
  return diffDays >= 0 && diffDays <= 7;
}
function mapsLinkFor(place){
  if(place.url) return place.url;
  const q = [place.name, place.area].filter(Boolean).join(" ");
  if(!q) return "";
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
}
const JAPAN_REGIONS = {
  hokkaido: { label: "北海道", keywords: ["北海道"] },
  tohoku: { label: "東北", keywords: ["青森","岩手","宮城","秋田","山形","福島"] },
  kanto: { label: "関東", keywords: ["東京","神奈川","埼玉","千葉","茨城","栃木","群馬"] },
  chubu: { label: "中部", keywords: ["新潟","富山","石川","福井","山梨","長野","岐阜","静岡","愛知"] },
  kinki: { label: "近畿", keywords: ["三重","滋賀","京都","大阪","兵庫","奈良","和歌山"] },
  chugoku: { label: "中国", keywords: ["鳥取","島根","岡山","広島","山口"] },
  shikoku: { label: "四国", keywords: ["徳島","香川","愛媛","高知"] },
  kyushu: { label: "九州・沖縄", keywords: ["福岡","佐賀","長崎","熊本","大分","宮崎","鹿児島","沖縄"] },
};
function regionFor(area){
  const text = String(area || "");
  for(const key in JAPAN_REGIONS){
    if(JAPAN_REGIONS[key].keywords.some(k => text.includes(k))) return key;
  }
  return "";
}
let placeOrderCounter = 0;
function normalizeCategories(p){
  if(Array.isArray(p.categories) && p.categories.length) return p.categories;
  if(typeof p.categories === "string" && p.categories.trim()) return p.categories.split("|||").map(s => s.trim()).filter(Boolean);
  if(p.category) return [p.category];
  return ["その他"];
}
function detectSnsPlatform(url){
  if(!url) return null;
  try{
    const host = new URL(url).hostname.replace(/^www\./, "");
    if(host === "x.com" || host === "twitter.com") return { label: "X", icon: "🐦" };
    if(host.endsWith("instagram.com")) return { label: "Instagram", icon: "📷" };
    if(host.endsWith("tiktok.com")) return { label: "TikTok", icon: "🎵" };
    if(host.endsWith("youtube.com") || host === "youtu.be") return { label: "YouTube", icon: "▶️" };
    if(host.endsWith("threads.net")) return { label: "Threads", icon: "🧵" };
    if(host.endsWith("line.me")) return { label: "LINE", icon: "💬" };
    if(host.endsWith("facebook.com")) return { label: "Facebook", icon: "📘" };
  }catch(e){ /* 不正なURLは無視 */ }
  return null;
}
function placeItemHTML(p){
  const photos = Array.isArray(p.photos) ? p.photos : (p.photo ? [p.photo] : []);
  const photosHtml = photos.length
    ? `<div class="place-gallery">${photos.map(src => `<img class="place-gallery-img" src="${src}" alt="">`).join("")}</div>`
    : "";
  const sourceHtml = p.source ? `<span class="place-source editable" contenteditable="false">${p.source}</span>` : `<span class="place-source editable" contenteditable="false" style="display:none;"></span>`;
  const newBadgeHtml = isRecentlyAdded(p.addedAt) ? `<span class="place-new-badge">NEW</span>` : "";
  const mapUrl = mapsLinkFor(p);
  const mapLinkHtml = mapUrl ? `<a class="place-map-link" href="${mapUrl}" target="_blank" rel="noopener">📍 地図で見る</a>` : "";
  const detectedSns = detectSnsPlatform(p.snsUrl);
  const snsLabel = p.snsLabel || (detectedSns ? detectedSns.label : "SNS");
  const snsIconDisplay = p.snsIcon ? `<img class="place-sns-icon-img" src="${p.snsIcon}" alt="">` : (detectedSns ? detectedSns.icon : "🔗");
  const snsLinkHtml = p.snsUrl ? `<a class="place-map-link place-sns-link" href="${p.snsUrl}" target="_blank" rel="noopener">${snsIconDisplay} ${escHtml(snsLabel)}を見る</a>` : "";
  const region = regionFor(p.area);
  const order = (p.order !== undefined && p.order !== "") ? p.order : placeOrderCounter++;
  const recommendHtml = p.recommend
    ? `<div class="place-recommend editable" contenteditable="false"><span class="place-recommend-mark">💡 おすすめポイント</span>${p.recommend}</div>`
    : `<div class="place-recommend editable" contenteditable="false" style="display:none;"><span class="place-recommend-mark">💡 おすすめポイント</span></div>`;
  const visitHtml = p.visitPeriod
    ? `<span class="place-visit editable" contenteditable="false">🗓 ${p.visitPeriod}</span>`
    : `<span class="place-visit editable" contenteditable="false" style="display:none;"></span>`;
  const relatedRaw = Array.isArray(p.related) ? p.related.join("|||") : (p.related || "");
  const categories = normalizeCategories(p);
  const categoriesRaw = categories.join("|||");
  const categoryBadgesHtml = categories.map(c => `<span class="place-category">${c}</span>`).join("");
  const statusBadgeHtml = p.status === "closed" ? `<span class="place-status-badge status-closed">⚠ 閉店・終了</span>`
    : p.status === "stale" ? `<span class="place-status-badge status-stale">⚠ 情報が古いかも</span>`
    : "";
  return `<div class="place-item" data-categories="${escAttr(categoriesRaw)}" data-area="${escAttr(p.area)}" data-url="${escAttr(p.url)}" data-sns="${escAttr(p.snsUrl)}" data-sns-label="${escAttr(p.snsLabel)}" data-sns-icon="${escAttr(p.snsIcon)}" data-status="${escAttr(p.status)}" data-photos="${escAttr(JSON.stringify(photos))}" data-added="${escAttr(p.addedAt)}" data-region="${region}" data-order="${order}" data-visit="${escAttr(p.visitPeriod)}" data-related="${escAttr(relatedRaw)}">
    <button class="edit-edit" aria-label="編集">✎</button>
    <button class="edit-remove" aria-label="削除">×</button>
    <div class="place-meta">
      ${newBadgeHtml}
      ${statusBadgeHtml}
      ${categoryBadgesHtml}
      ${visitHtml}
      ${sourceHtml}
    </div>
    <h3 class="place-name editable" contenteditable="false">${p.name}</h3>
    <div class="place-area editable" contenteditable="false">${p.area ? "📍 " + p.area : ""}</div>
    <p class="place-body editable" contenteditable="false">${p.body}</p>
    ${recommendHtml}
    ${photosHtml}
    <div class="place-link-row">
      ${mapLinkHtml}
      ${snsLinkHtml}
    </div>
    <div class="place-related" data-role="related"></div>
    ${REORDER_ROW}
  </div>`;
}

if(!document.body.dataset.rendered){
  document.getElementById("nav-brand").textContent = PLACES.navBrand;
  document.getElementById("p-eyebrow").textContent = PLACES.eyebrow;
  document.getElementById("p-title").textContent = PLACES.title;
  document.getElementById("p-desc").textContent = PLACES.desc;
  document.getElementById("place-list").innerHTML = PLACES.items.map(placeItemHTML).join("");
  document.body.dataset.rendered = "true";
}

/* ---------- SNSシェア用OGPタグの同期 ---------- */
const OGP_IMAGE_URL = "";
function syncOgpTags(){
  const title = document.getElementById("p-title").textContent.trim();
  const desc = document.getElementById("p-desc").textContent.trim();
  const setMeta = (selector, value) => {
    const el = document.querySelector(selector);
    if(el && value) el.setAttribute("content", value);
  };
  setMeta('meta[property="og:title"]', title || "推しゆかりの場所まとめ");
  setMeta('meta[property="og:description"]', desc);
  setMeta('meta[name="twitter:title"]', title || "推しゆかりの場所まとめ");
  setMeta('meta[name="twitter:description"]', desc);
  if(OGP_IMAGE_URL){ setMeta('meta[property="og:image"]', OGP_IMAGE_URL); setMeta('meta[name="twitter:image"]', OGP_IMAGE_URL); }
  if(location.href.indexOf("file://") !== 0){ setMeta('meta[property="og:url"]', location.href); }
}
syncOgpTags();

/* ---------- PWA:Service Worker登録 ---------- */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ---------- 画像アップロード(複数対応・自動リサイズ) ---------- */


/* ---------- 未保存の変更を警告 ---------- */
let hasUnsavedChanges = false;


/* ---------- シェアボタン ---------- */
document.getElementById("share-btn-nav").addEventListener("click", async () => {
  const title = document.getElementById("p-title").textContent.trim();
  const desc = document.getElementById("p-desc").textContent.trim();
  const shareText = desc ? `${title}｜${desc}` : title;
  const shareUrl = location.href;
  if(navigator.share){
    try{ await navigator.share({ title, text: shareText, url: shareUrl }); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  const intent = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`;
  const opened = window.open(intent, "_blank", "noopener");
  if(!opened){
    const fallbackText = `${shareText} ${shareUrl}`;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(fallbackText)
        .then(() => alert("シェア用の文章をコピーしました。SNSに貼り付けてご利用ください。\n\n" + fallbackText))
        .catch(() => alert("シェアウィンドウを開けませんでした(ポップアップブロックの可能性)。以下をコピーしてご利用ください。\n\n" + fallbackText));
    } else {
      alert("シェアウィンドウを開けませんでした(ポップアップブロックの可能性)。以下をコピーしてご利用ください。\n\n" + fallbackText);
    }
  }
});

/* ---------- 印刷 ---------- */
document.getElementById("print-btn").addEventListener("click", () => window.print());
let wasShowAllBeforePrint = false;
window.addEventListener("beforeprint", () => { wasShowAllBeforePrint = showAllItems; showAllItems = true; applyPlaceFilter(); });
window.addEventListener("afterprint", () => { showAllItems = wasShowAllBeforePrint; applyPlaceFilter(); });

/* ---------- トップに戻るボタン ---------- */
(function initBackToTop(){
  const btn = document.getElementById("back-to-top");
  window.addEventListener("scroll", () => { btn.classList.toggle("show", window.scrollY > 400); });
  btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
})();

/* ---------- 隠し編集メニュー(フッターを5回タップで解錠) ---------- */


/* ---------- カテゴリ絞り込み・検索・もっと見る ---------- */
let currentCategoryFilter = "all";
let currentRegionFilter = "";
let showAllItems = false;
const PLACE_INITIAL_VISIBLE = 6;
function currentSearchQuery(){
  const el = document.getElementById("place-search");
  return el ? el.value.trim().toLowerCase() : "";
}
function itemCategories(item){
  return (item.dataset.categories || "").split("|||").map(s => s.trim()).filter(Boolean);
}
function applyPlaceFilter(){
  const q = currentSearchQuery();
  const allItems = Array.from(document.querySelectorAll("#place-list .place-item"));
  const matched = allItems.filter(item => {
    const categoryOk = (currentCategoryFilter === "all" || itemCategories(item).includes(currentCategoryFilter));
    const regionOk = (!currentRegionFilter || item.dataset.region === currentRegionFilter);
    const searchOk = !q || item.textContent.toLowerCase().includes(q);
    return categoryOk && regionOk && searchOk;
  });
  const isNarrowed = currentCategoryFilter !== "all" || !!currentRegionFilter || !!q;
  const limitActive = !showAllItems && !isNarrowed && matched.length > PLACE_INITIAL_VISIBLE;
  allItems.forEach(item => { item.style.display = "none"; });
  matched.forEach((item, i) => {
    if(limitActive && i >= PLACE_INITIAL_VISIBLE) return;
    item.style.display = "";
  });
  document.getElementById("no-results").classList.toggle("show", matched.length === 0 && allItems.length > 0);
  const loadMoreBtn = document.getElementById("load-more-places");
  if(limitActive){
    loadMoreBtn.style.display = "flex";
    loadMoreBtn.textContent = `＋ もっと見る(残り${matched.length - PLACE_INITIAL_VISIBLE}件)`;
  } else {
    loadMoreBtn.style.display = "none";
  }
}
document.getElementById("load-more-places").addEventListener("click", () => { showAllItems = true; applyPlaceFilter(); });
function renderCategoryFilter(){
  const wrap = document.getElementById("category-filter");
  const cats = [];
  document.querySelectorAll("#place-list .place-item").forEach(item => {
    itemCategories(item).forEach(c => { if(!cats.includes(c)) cats.push(c); });
  });
  if(cats.length < 2){
    wrap.classList.remove("show");
    wrap.innerHTML = "";
    currentCategoryFilter = "all";
    applyPlaceFilter();
    return;
  }
  const current = cats.includes(currentCategoryFilter) ? currentCategoryFilter : "all";
  currentCategoryFilter = current;
  wrap.classList.add("show");
  wrap.innerHTML = [`<button type="button" class="tag-filter-btn${current === "all" ? " active" : ""}" data-cat="all">すべて</button>`]
    .concat(cats.map(c => `<button type="button" class="tag-filter-btn${current === c ? " active" : ""}" data-cat="${escAttr(c)}">${c}</button>`))
    .join("");
  applyPlaceFilter();
}
document.getElementById("category-filter").addEventListener("click", (e) => {
  const btn = e.target.closest(".tag-filter-btn");
  if(!btn) return;
  currentCategoryFilter = btn.dataset.cat;
  showAllItems = false;
  document.querySelectorAll("#category-filter .tag-filter-btn").forEach(b => b.classList.toggle("active", b === btn));
  applyPlaceFilter();
});
document.getElementById("place-search").addEventListener("input", () => { showAllItems = false; applyPlaceFilter(); });

/* ---------- 日本地図(地域ごとのピン) ---------- */
function renderJapanMap(){
  const items = Array.from(document.querySelectorAll("#place-list .place-item"));
  const counts = {};
  items.forEach(item => { const r = item.dataset.region; if(r) counts[r] = (counts[r] || 0) + 1; });
  const hasAny = Object.keys(counts).length > 0;
  document.getElementById("jp-map").classList.toggle("show", hasAny);
  document.querySelectorAll(".jp-region").forEach(btn => {
    const key = btn.dataset.key;
    const count = counts[key] || 0;
    btn.classList.toggle("has-pin", count > 0);
    btn.classList.toggle("active", currentRegionFilter === key);
    const existingPin = btn.querySelector(".jp-region-pin");
    if(existingPin) existingPin.remove();
    if(count > 0){
      const pin = document.createElement("span");
      pin.className = "jp-region-pin";
      pin.textContent = count;
      btn.appendChild(pin);
    }
  });
}
function toggleRegionFilter(key){
  currentRegionFilter = (currentRegionFilter === key) ? "" : key;
  showAllItems = true;
  renderJapanMap();
  applyPlaceFilter();
}
document.getElementById("jp-map").addEventListener("click", (e) => {
  const btn = e.target.closest(".jp-region");
  if(!btn || !btn.classList.contains("has-pin")) return;
  toggleRegionFilter(btn.dataset.key);
});
new MutationObserver(() => { renderCategoryFilter(); renderJapanMap(); renderDailyPick(); renderRelatedLinks(); }).observe(document.getElementById("place-list"), { childList: true, subtree: true, characterData: true });
renderCategoryFilter();
renderJapanMap();
renderDailyPick();
renderRelatedLinks();

/* ---------- 今日のピックアップ(日替わり・固定シード) ---------- */
function hashString(s){
  let h = 0;
  for(let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function renderDailyPick(){
  const wrap = document.getElementById("daily-pick");
  const items = Array.from(document.querySelectorAll("#place-list .place-item"));
  if(!items.length){ wrap.classList.remove("show"); wrap.innerHTML = ""; return; }
  const todayKey = new Date().toISOString().slice(0, 10);
  const idx = hashString(todayKey) % items.length;
  const picked = items[idx];
  const name = picked.querySelector(".place-name")?.textContent || "";
  const body = picked.querySelector(".place-body")?.textContent || "";
  wrap.classList.add("show");
  wrap.innerHTML = `<div class="daily-pick-label">✦ 今日のピックアップ</div>
    <div class="daily-pick-title">${escHtml(name)}</div>
    <div class="daily-pick-body">${escHtml(body)}</div>`;
  wrap.onclick = () => {
    document.getElementById("place-search").value = "";
    currentCategoryFilter = "all"; currentRegionFilter = ""; showAllItems = true;
    document.querySelectorAll("#category-filter .tag-filter-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === "all"));
    renderJapanMap();
    applyPlaceFilter();
    picked.scrollIntoView({ behavior: "smooth", block: "center" });
    picked.classList.add("place-flash");
    setTimeout(() => picked.classList.remove("place-flash"), 1400);
  };
}

/* ---------- 表示切替(通常/エリア別/時系列) ---------- */
function visitSortKey(visitedAt){
  const m = String(visitedAt || "").match(/(\d{4})年?(?:(\d{1,2})月)?/);
  if(!m) return "0000-00";
  const y = m[1];
  const mo = (m[2] || "00").padStart(2, "0");
  return `${y}-${mo}`;
}
const REGION_ORDER = ["hokkaido","tohoku","kanto","chubu","kinki","chugoku","shikoku","kyushu"];
let currentViewMode = "normal";
function applyPlaceViewMode(){
  const list = document.getElementById("place-list");
  const items = Array.from(list.querySelectorAll(".place-item"));
  if(currentViewMode === "timeline"){
    items.sort((a, b) => {
      const ka = visitSortKey(a.dataset.visit);
      const kb = visitSortKey(b.dataset.visit);
      if(ka !== kb) return kb.localeCompare(ka);
      return (parseInt(a.dataset.order || "0", 10) - parseInt(b.dataset.order || "0", 10));
    });
  } else if(currentViewMode === "area"){
    items.sort((a, b) => {
      const ia = REGION_ORDER.indexOf(a.dataset.region); const ib = REGION_ORDER.indexOf(b.dataset.region);
      const ra = ia === -1 ? 999 : ia; const rb = ib === -1 ? 999 : ib;
      if(ra !== rb) return ra - rb;
      return (parseInt(a.dataset.order || "0", 10) - parseInt(b.dataset.order || "0", 10));
    });
  } else {
    items.sort((a, b) => (parseInt(a.dataset.order || "0", 10) - parseInt(b.dataset.order || "0", 10)));
  }
  items.forEach(item => list.appendChild(item));
  applyPlaceFilter();
}
document.getElementById("view-mode-group").addEventListener("click", (e) => {
  const btn = e.target.closest(".view-mode-btn");
  if(!btn) return;
  currentViewMode = btn.dataset.mode;
  document.querySelectorAll("#view-mode-group .view-mode-btn").forEach(b => b.classList.toggle("active", b === btn));
  applyPlaceViewMode();
});

/* ---------- 関連する場所リンク ---------- */
function renderRelatedLinks(){
  const items = Array.from(document.querySelectorAll("#place-list .place-item"));
  const nameMap = new Map();
  items.forEach(item => {
    const n = item.querySelector(".place-name")?.textContent.trim();
    if(n) nameMap.set(n, item);
  });
  items.forEach(item => {
    const wrap = item.querySelector('[data-role="related"]');
    if(!wrap) return;
    const raw = item.dataset.related || "";
    const names = raw.split("|||").map(s => s.trim()).filter(Boolean);
    const valid = names.filter(n => nameMap.has(n) && nameMap.get(n) !== item);
    const newHtml = valid.length
      ? `<span class="related-label">関連:</span>` + valid.map(n => `<button type="button" class="related-link-btn" data-target="${escAttr(n)}">${escHtml(n)}</button>`).join("")
      : "";
    if(wrap.innerHTML !== newHtml) wrap.innerHTML = newHtml;
    const wantDisplay = valid.length ? "flex" : "none";
    if(wrap.style.display !== wantDisplay) wrap.style.display = wantDisplay;
  });
}
document.getElementById("place-list").addEventListener("click", (e) => {
  const btn = e.target.closest(".related-link-btn");
  if(!btn) return;
  const items = Array.from(document.querySelectorAll("#place-list .place-item"));
  const target = items.find(item => item.querySelector(".place-name")?.textContent.trim() === btn.dataset.target);
  if(!target) return;
  document.getElementById("place-search").value = "";
  currentCategoryFilter = "all"; currentRegionFilter = ""; showAllItems = true;
  document.querySelectorAll("#category-filter .tag-filter-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === "all"));
  renderJapanMap();
  applyPlaceFilter();
  target.scrollIntoView({ behavior: "smooth", block: "center" });
  target.classList.add("place-flash");
  setTimeout(() => target.classList.remove("place-flash"), 1400);
});

/* ---------- 編集モード(パスワードで保護) ---------- */
let editMode = false;
function setEditable(on){ document.querySelectorAll(".editable").forEach(el => { el.contentEditable = on; }); }


/* ---------- データのエクスポート・インポート(JSON) ---------- */

function rebuildPlacesFromData(data){
  if(data.navBrand !== undefined) document.getElementById("nav-brand").textContent = data.navBrand;
  if(data.backLinkUrl){
    const link = document.querySelector(".back-link");
    if(link){ link.setAttribute("href", data.backLinkUrl); link.dataset.url = data.backLinkUrl; }
  }
  if(data.eyebrow !== undefined) document.getElementById("p-eyebrow").textContent = data.eyebrow;
  if(data.title !== undefined) document.getElementById("p-title").textContent = data.title;
  if(data.desc !== undefined) document.getElementById("p-desc").textContent = data.desc;
  if(data.items){
    document.getElementById("place-list").innerHTML = data.items.map(placeItemHTML).join("");
    const maxOrder = Math.max(-1, ...data.items.map(it => parseInt(it.order, 10)).filter(n => !isNaN(n)));
    placeOrderCounter = Math.max(placeOrderCounter, maxOrder + 1);
  }
  setEditable(editMode);
  syncOgpTags();
  renderCategoryFilter();
  renderJapanMap();
  renderDailyPick();
  renderRelatedLinks();
  hasUnsavedChanges = true;
}


/* 編集モード中は、地図リンクをタップしても遷移させない */
document.addEventListener("click", (e) => {
  if(!document.body.classList.contains("editing")) return;
  const link = e.target.closest("a.place-map-link");
  if(link) e.preventDefault();
});

/* タップ数の計測(GA4イベント) */
document.addEventListener("click", (e) => {
  const link = e.target.closest("a[href]");
  if(!link) return;
  if(typeof gtag === "function"){
    const label = (link.textContent || "").trim().slice(0, 60) || link.getAttribute("href");
    gtag("event", "tap", { event_category: "link", event_label: label });
  }
});

/* 公開用HTML(編集機能を削除した閲覧専用版)を書き出す */


/* ---------- 同じ場所にある places-data.json があれば自動で読み込む ----------
   ・https(またはローカルサーバー)環境でのみ動作します(file:// では読み込めません)
   ・見つかった場合は、そちらの内容でページを上書きします
   ・見つからない/読み込めない場合は、何も起きず今の内容のまま表示されます */
(async function loadExternalDataIfAvailable(){
  const overlay = document.getElementById("initial-load-overlay");
  const hideOverlay = () => {
    if(!overlay || overlay.dataset.hidden) return;
    overlay.dataset.hidden = "1";
    overlay.classList.add("hide");
    setTimeout(() => overlay.remove(), 300);
  };
  const safetyTimer = setTimeout(hideOverlay, 1500); /* 通信が遅い・失敗している場合の保険。1.5秒経ったら諦めて今の内容を表示する */
  try{
    const res = await fetch("places-data.json", { cache: "no-store" });
    if(!res.ok) return;
    const data = await res.json();
    rebuildPlacesFromData(data);
    hasUnsavedChanges = false;
  }catch(e){
    /* file:// で開いている場合や、ファイルが存在しない場合はここに来ます。何もしません */
  }finally{
    clearTimeout(safetyTimer);
    hideOverlay();
  }
})();

</script>
