<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません | 原優寧 布教サイト</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root{
  --oshi-color: #e0233a;
  --oshi-color-deep: #b81b30;
  --oshi-color-soft: #ffe2e6;
  --accent2: #ece6e8;
  --ink: #2b2331;
  --sub-ink: #7d6b78;
  --paper: #fffaf9;
  --line: #f0dde6;
}
*{ box-sizing:border-box; }
body{
  margin:0;
  font-family:'Noto Sans JP', sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.wrap{
  max-width:420px;
  width:100%;
  text-align:center;
}
.mark{
  font-family:'Zen Maru Gothic', sans-serif;
  font-size:15px;
  font-weight:900;
  color:var(--oshi-color);
  letter-spacing:2px;
  margin-bottom:8px;
}
.code{
  font-family:'Zen Maru Gothic', sans-serif;
  font-size:72px;
  font-weight:900;
  color:var(--oshi-color-soft);
  line-height:1;
  margin:8px 0 4px;
  -webkit-text-stroke:2px var(--oshi-color);
}
h1{
  font-family:'Zen Maru Gothic', sans-serif;
  font-size:19px;
  font-weight:900;
  margin:12px 0 10px;
}
p{
  font-size:13.5px;
  color:var(--sub-ink);
  line-height:1.8;
  margin:0 0 28px;
}
.home-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--oshi-color);
  color:#fff;
  font-weight:700;
  font-size:14px;
  text-decoration:none;
  padding:12px 28px;
  border-radius:999px;
  box-shadow:0 6px 16px rgba(224,35,58,0.28);
}
.home-btn:hover{ background:var(--oshi-color-deep); }
.links{
  margin-top:28px;
  padding-top:20px;
  border-top:1px solid var(--line);
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}
.links a{
  font-size:11.5px;
  font-weight:700;
  color:var(--sub-ink);
  text-decoration:none;
  background:var(--accent2);
  padding:6px 12px;
  border-radius:999px;
}
.links a:hover{ color:var(--oshi-color); }
.heart{ color:var(--oshi-color-soft); font-size:20px; margin-top:6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">原優寧 布教サイト</div>
    <div class="code">404</div>
    <h1>このページは見つかりませんでした</h1>
    <p>お探しのページは移動または削除された可能性があります。<br>URLをご確認いただくか、トップページからお探しください。</p>
    <a class="home-btn" href="index.html">← トップに戻る</a>
    <div class="links">
      <a href="videos.html">動画まとめ</a>
      <a href="goods.html">グッズまとめ</a>
      <a href="wiki.html">豆知識</a>
      <a href="places.html">ゆかりの場所</a>
      <a href="member-profile.html">プロフィール</a>
      <a href="guide.html">はじめての方へ</a>
    </div>
    <div class="heart">♡</div>
  </div>
</body>
</html>
