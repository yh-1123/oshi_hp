<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root{
  --oshi-color: #e0233a;
  --oshi-color-deep: #b81b30;
  --oshi-color-soft: #ffe2e6;
  --accent2: #ece6e8;
  --ink: #2b2331;
  --sub-ink: #7d6b78;
  --paper: #fffaf9;
  --line: #f0dde6;
  --card: #ffffff;
  --shadow-sm: 0 2px 10px rgba(43,35,49,0.06);
  --shadow-md: 0 10px 26px rgba(43,35,49,0.12);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--oshi-color); outline-offset:2px; border-radius:4px;
}
html{ scroll-behavior:smooth; }
body{ font-family:'Noto Sans JP', sans-serif; background:var(--paper); color:var(--ink); line-height:1.75; overflow-x:hidden; padding-bottom:72px; font-size:15px; }
h1,h2,h3,.brand{ font-family:'Zen Maru Gothic', sans-serif; }
a{ color:inherit; text-decoration:none; }
.wrap{ max-width:640px; margin:0 auto; padding:0 18px; }

.topnav{ position:sticky; top:0; z-index:50; background:rgba(255,250,249,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
.topnav .wrap{ display:flex; align-items:center; justify-content:space-between; height:46px; }
.back-link{ font-size:12.5px; font-weight:700; color:var(--oshi-color); }
.brand{ font-size:12px; color:var(--sub-ink); }
.nav-icon-btn{ flex:none; border:none; background:transparent; font-size:15px; cursor:pointer; padding:4px 2px; color:var(--sub-ink); line-height:1; }
.nav-icon-btn:hover{ color:var(--oshi-color); }

.g-hero{ position:relative; padding:28px 0 20px; text-align:center; overflow:hidden; }
.g-hero::before{
  content:""; position:absolute; top:4px; left:50%; width:170px; height:120px; transform:translateX(-50%);
  background:radial-gradient(circle, var(--oshi-color-soft) 0%, transparent 68%);
  opacity:0.9; pointer-events:none;
}
.g-hero .eyebrow{ position:relative; display:inline-block; font-size:10px; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:999px; padding:3px 10px; margin-bottom:9px; font-weight:700; }
.g-hero h1{ position:relative; font-size:clamp(20px,7vw,26px); font-weight:900; }
.g-hero p{ position:relative; margin:9px auto 0; max-width:400px; font-size:12.5px; color:var(--sub-ink); }

section{ padding:30px 0; border-top:1px solid var(--line); }
.sec-head{ margin-bottom:16px; }
.sec-head h2{ font-size:16.5px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
.sec-head h2 .mark{ color:var(--oshi-color); font-size:14px; }
.sec-head p{ color:var(--sub-ink); font-size:12px; margin-top:4px; }

/* 申込方法 */
.howto-list{ display:flex; flex-direction:column; gap:14px; }
.howto-item{ position:relative; padding:16px 84px 16px 16px; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-sm); }
.howto-title{ font-size:14px; font-weight:700; color:var(--oshi-color); margin-bottom:8px; }
.howto-steps{ padding-left:20px; font-size:13px; }
.howto-steps li{ margin-bottom:12px; }
.howto-steps li:last-child{ margin-bottom:0; }
.step-photo{ width:100%; max-width:260px; border-radius:8px; margin:6px 0; display:block; box-shadow:var(--shadow-sm); }
.photo-preview{ width:100%; aspect-ratio:16/9; background-size:cover; background-position:center; border-radius:10px; margin-top:6px; border:1px solid var(--line); display:none; }

/* 手順の編集(モーダル内) */
.step-row{ border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; }
.step-row-top{ display:flex; gap:8px; align-items:center; }
.step-row-top .step-text{ flex:1; }
.step-row-remove{ flex:none; width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--sub-ink); cursor:pointer; font-size:13px; }
.step-row-remove:hover{ background:var(--oshi-color); color:#fff; border-color:var(--oshi-color); }
.step-link-fields{ display:flex; gap:6px; margin-top:8px; }
.step-link-fields input{ font-size:12px; }
.step-inline-link{ color:var(--oshi-color); text-decoration:underline; text-underline-offset:2px; }
.step-inline-link:hover{ color:var(--oshi-color-deep); }
.step-row .step-photo-file{ margin-top:8px; }
.step-photo-preview{ width:100%; aspect-ratio:16/9; background-size:cover; background-position:center; border-radius:8px; margin-top:6px; border:1px solid var(--line); display:none; }

/* 用語集 */
.glossary-list{ display:flex; flex-direction:column; gap:14px; }
.glossary-item{ position:relative; padding:14px 84px 14px 14px; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-sm); }
.glossary-term{ font-size:14px; font-weight:700; color:var(--oshi-color); margin-bottom:4px; }
.glossary-desc{ font-size:13px; }

/* よくある質問(アコーディオン) */
.faq-list{ display:flex; flex-direction:column; gap:10px; }
.faq-item{ position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow-sm); }
.faq-question{
  width:100%; text-align:left; background:none; border:none; padding:14px 84px 14px 16px; font-size:13.5px;
  font-weight:700; color:var(--ink); cursor:pointer; font-family:inherit; display:flex; gap:10px; align-items:flex-start;
}
.faq-question .faq-q-mark{ color:var(--oshi-color); flex:none; }
.faq-arrow{ position:absolute; top:14px; right:34px; color:var(--sub-ink); font-size:12px; transition:transform .2s ease; }
.faq-item.open .faq-arrow{ transform:rotate(180deg); }
.faq-answer{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
.faq-item.open .faq-answer{ max-height:600px; }
.faq-answer-inner{ padding:0 16px 16px 16px; font-size:13px; color:var(--sub-ink); }

.bio-text{ font-size:13.5px; white-space:pre-line; }

footer{ text-align:center; padding:30px 0 16px; color:var(--sub-ink); font-size:11px; }
.last-updated{ margin-top:8px; font-size:10.5px; color:var(--sub-ink); }
.last-updated:empty{ display:none; }

.back-to-top{
  position:fixed; right:16px; bottom:78px; z-index:90; width:42px; height:42px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--oshi-color); font-size:18px; cursor:pointer;
  box-shadow:0 6px 18px rgba(43,35,49,0.15); display:none; align-items:center; justify-content:center;
  opacity:0; transition:opacity .2s ease;
}
.back-to-top.show{ display:flex; opacity:1; }
.back-to-top:hover{ background:var(--oshi-color-soft); }

/* 編集モード */
.editable{ outline:none; }
body.editing .editable{ outline:1.5px dashed var(--oshi-color); outline-offset:2px; border-radius:4px; cursor:text; }
body.editing .editable:hover{ background:var(--oshi-color-soft); }
.edit-remove{
  display:none; position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:16px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
.edit-edit{
  display:none; position:absolute; top:8px; right:44px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:14px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
body.editing .edit-remove, body.editing .edit-edit{ display:flex; }
body.editing .edit-remove:hover, body.editing .edit-edit:hover{ background:var(--oshi-color); color:#fff; border-color:var(--oshi-color); }

.reorder-row{ display:none; gap:6px; margin-top:10px; padding:0 14px 12px; }
.faq-item .reorder-row{ padding:0 16px 14px; }
body.editing .reorder-row{ display:flex; }
.reorder-btn{
  border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:10.5px; font-weight:700;
  padding:4px 10px; border-radius:8px; cursor:pointer; font-family:inherit;
}
.reorder-btn:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }

.add-row{ display:none; margin-top:12px; }
body.editing .add-row{ display:flex; }
.add-btn{
  border:1.5px dashed var(--oshi-color); color:var(--oshi-color); background:#fff; border-radius:12px;
  padding:9px 16px; font-size:12.5px; font-weight:700; cursor:pointer; width:100%; text-align:center;
  transition:background .15s ease;
}
.add-btn:hover{ background:var(--oshi-color-soft); }

.edit-toolbar{
  display:none; position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
  border-radius:999px; padding:7px 8px; box-shadow:0 8px 24px rgba(43,35,49,0.18); z-index:100;
  max-width:94vw; overflow-x:auto; scrollbar-width:none;
}
.edit-toolbar.unlocked{ display:flex; }
.edit-toolbar::-webkit-scrollbar{ display:none; }
#footer-tap-target{ cursor:default; -webkit-tap-highlight-color:transparent; user-select:none; display:inline-block; }
.tb-btn{ flex:none; border:none; border-radius:999px; padding:9px 15px; font-size:12px; font-weight:700; cursor:pointer; background:var(--paper); color:var(--ink); white-space:nowrap; transition:background .15s ease; }
.tb-btn.primary{ background:var(--oshi-color); color:#fff; }
.tb-btn.primary:hover{ background:var(--oshi-color-deep); }
.tb-btn-icon{
  flex:none; border:none; border-radius:50%; width:34px; height:34px; font-size:14px; cursor:pointer;
  background:var(--paper); color:var(--ink); display:inline-flex; align-items:center; justify-content:center;
}
.tb-btn-icon:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }

.modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(43,35,49,0.45); z-index:200; align-items:center; justify-content:center; padding:20px; }
.modal-backdrop.open{ display:flex; }
.modal{ background:#fff; border-radius:18px; padding:20px; width:100%; max-width:380px; max-height:84vh; overflow-y:auto; }
.modal h3{ font-size:15px; margin-bottom:14px; }
.qa-label{ font-size:11px; color:var(--sub-ink); margin-top:12px; margin-bottom:2px; }
.qa-label:first-child{ margin-top:0; }
.qa-input{ border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); width:100%; }
.qa-textarea{ border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); width:100%; min-height:80px; resize:vertical; }
.qa-input:focus, .qa-textarea:focus{ outline:2px solid var(--oshi-color); outline-offset:1px; }
.modal-actions{ display:flex; gap:8px; margin-top:18px; }
.modal-actions button{ flex:1; }
.modal-actions .tb-btn{ background:var(--paper); border:1px solid var(--line); }
.modal-actions .add-btn{ border-style:solid; background:var(--oshi-color); color:#fff; }
.modal-actions .add-btn:hover{ background:var(--oshi-color-deep); }

@media (max-width:480px){
  .wrap{ padding:0 14px; }
  .g-hero{ padding:22px 0 16px; }
  section{ padding:24px 0; }
}
</style>

<script>
/* @EDIT_ONLY_START */
/* ==========================================================
   編集用パスワード。他のページと同じ仕組み(SHA-256ハッシュ)。
   初期パスワードは "oshikatsu2026" です。
   ========================================================== */
const EDIT_PASSWORD_HASH = "ce9d9c91a8374c694448bdb6f6591003c96353d8eaf6ee9e32c7e47d47c1ac14";
async function sha256Hex(text){
  if(!window.crypto || !window.crypto.subtle){ return Promise.reject(new Error("subtlecrypto-unavailable")); }
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
}
let authenticated = false;
/* @EDIT_ONLY_END */

const GUIDE = {
  eyebrow: "はじめての方へ",
  title: "推し活はじめてガイド",
  desc: "よく使う用語や、はじめての現場で気になることをまとめました。分からない言葉があったらここをチェックしてみてね。",
  howto: [
    { title: "劇場公演の申込方法", steps: [
      "公式サイトの公演スケジュールを確認する",
      "申込フォームから希望の公演日を選択する",
      "座席種別・枚数を選んで申し込む",
      "当落確認後、案内に従って支払い・受け取りを行う",
    ]},
    { title: "特典会の申込方法", steps: [
      "対象イベントの参加方法(店舗・オンライン抽選など)を確認する",
      "対象商品を購入して参加券を受け取る",
      "指定された時間・会場に参加券を持って向かう",
    ]},
  ],
  glossary: [
    { term: "サイリウム", desc: "ライブなどで振る、光る棒状の応援グッズ。推しのイメージカラーに合わせて色を選ぶのが定番です。" },
    { term: "現場・参戦", desc: "ライブや握手会など、実際に足を運んで参加するイベントのこと。「参戦する」のように使います。" },
    { term: "特典会", desc: "CDなどを購入すると参加できる交流イベント。少し会話できたり、握手できたりします。" },
    { term: "古参・新規", desc: "応援を始めた時期による呼び方。「古参」は昔から応援している人、「新規」は最近応援を始めた人のことです。" },
    { term: "沼落ち", desc: "すっかりハマってしまうこと。「沼」は抜け出せないほど夢中になっている状態を指します。" },
    { term: "箱推し", desc: "特定の一人ではなく、グループ全体を応援すること。" },
  ],
  faq: [
    { q: "初めて現場に行くのですが、何を持っていけばいいですか?", a: "基本的にはサイリウムがあれば十分です。会場によってルールが異なることもあるので、公式の注意事項は事前に確認しておくと安心です。" },
    { q: "サイリウムの色は自由に選んでいいの?", a: "基本的には自由ですが、推しのイメージカラーに合わせるのが一般的です。このサイトのトップページにも色の案内があるので参考にしてみてください。" },
    { q: "SNSで布教する時に気をつけることはありますか?", a: "ネタバレになる内容は控えめにし、公式が禁止している画像・映像の転載は避けましょう。良かった部分を自分の言葉で伝えるのが一番喜ばれます。" },
  ],
};

const REORDER_ROW = '<div class="reorder-row"><button class="reorder-btn move-up" type="button">↑ 上へ</button><button class="reorder-btn move-down" type="button">↓ 下へ</button></div>';
function escHtml(s){ return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function applyInlineLink(text, linkText, linkUrl){
  if(!linkText || !linkUrl){ return escHtml(text); }
  const idx = text.indexOf(linkText);
  if(idx === -1){ return escHtml(text); }
  const before = escHtml(text.slice(0, idx));
  const after = escHtml(text.slice(idx + linkText.length));
  const mid = `<a href="${linkUrl}" target="_blank" rel="noopener" class="step-inline-link">${escHtml(linkText)}</a>`;
  return before + mid + after;
}
function howtoItemHTML(h){
  const stepsHtml = (h.steps || []).map(s => {
    const text = typeof s === "string" ? s : (s.text || "");
    const photo = typeof s === "string" ? "" : (s.photo || "");
    const linkText = typeof s === "string" ? "" : (s.linkText || "");
    const linkUrl = typeof s === "string" ? "" : (s.linkUrl || "");
    const photoHtml = photo ? `<img class="step-photo" src="${photo}" alt="">` : "";
    const textHtml = applyInlineLink(text, linkText, linkUrl);
    return `<li data-photo="${escAttr(photo)}" data-link-text="${escAttr(linkText)}" data-link-url="${escAttr(linkUrl)}"><span class="step-text-display">${textHtml}</span>${photoHtml}</li>`;
  }).join("");
  return `<div class="howto-item">
    <button class="edit-edit" aria-label="編集">✎</button>
    <button class="edit-remove" aria-label="削除">×</button>
    <h3 class="howto-title editable" contenteditable="false">${h.title}</h3>
    <ol class="howto-steps">${stepsHtml}</ol>

    ${REORDER_ROW}
  </div>`;
}
function glossaryItemHTML(g){

const OGP_IMAGE_URL = "";
function syncOgpTags(){
  const title = document.getElementById("g-title").textContent.trim();
  const desc = document.getElementById("g-desc").textContent.trim();
  const setMeta = (selector, value) => {
    const el = document.querySelector(selector);
    if(el && value) el.setAttribute("content", value);
  };
  setMeta('meta[property="og:title"]', title || "推し活はじめてガイド");
  setMeta('meta[property="og:description"]', desc);
  setMeta('meta[name="twitter:title"]', title || "推し活はじめてガイド");
  setMeta('meta[name="twitter:description"]', desc);
  if(OGP_IMAGE_URL){ setMeta('meta[property="og:image"]', OGP_IMAGE_URL); setMeta('meta[name="twitter:image"]', OGP_IMAGE_URL); }
  if(location.href.indexOf("file://") !== 0){ setMeta('meta[property="og:url"]', location.href); }
}

function escAttr(s){ return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
/* @EDIT_ONLY_START */
const HOWTO_PHOTO_MAX_DIMENSION = 900;
function stepRowHTML(text, photo, linkText, linkUrl){
  return `<div class="step-row" data-photo="${escAttr(photo)}">
    <div class="step-row-top">
      <input class="qa-input step-text" type="text" value="${escAttr(text)}" placeholder="手順を入力してください">
      <button type="button" class="step-row-remove" aria-label="この手順を削除">×</button>
    </div>
    <div class="step-link-fields">
      <input class="qa-input step-link-text" type="text" value="${escAttr(linkText)}" placeholder="リンクにする文字(任意)">
      <input class="qa-input step-link-url" type="text" value="${escAttr(linkUrl)}" placeholder="リンク先URL(任意)">
    </div>
    <input type="file" accept="image/*" class="qa-input step-photo-file">
    <div class="step-photo-preview"${photo ? ` style="display:block;background-image:url('${photo}')"` : ""}></div>
  </div>`;
}
function addStepRow(text, photo, linkText, linkUrl){
  const editor = document.getElementById("howto-steps-editor");
  if(editor) editor.insertAdjacentHTML("beforeend", stepRowHTML(text || "", photo || "", linkText || "", linkUrl || ""));
}
/* 手順の追加・削除ボタン(モーダル内。要素は開くたびに作り直されるためイベント委譲) */
document.getElementById("modal-fields").addEventListener("click", (e) => {
  if(e.target.id === "add-step-row"){ addStepRow("", "", "", ""); return; }
  if(e.target.classList.contains("step-row-remove")){ e.target.closest(".step-row")?.remove(); }
});
/* 手順ごとの画像アップロード(モーダル内。イベント委譲) */
document.getElementById("modal-fields").addEventListener("change", (e) => {
  if(!e.target.classList.contains("step-photo-file")) return;
  const row = e.target.closest(".step-row");
  const file = e.target.files[0];
  if(!row || !file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, HOWTO_PHOTO_MAX_DIMENSION / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
      row.dataset.photo = dataUrl;
      const preview = row.querySelector(".step-photo-preview");
      if(preview){ preview.style.backgroundImage = `url('${dataUrl}')`; preview.style.display = "block"; }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

let hasUnsavedChanges = false;

function watchDirty(id){
  const el = document.getElementById(id);
  if(!el) return;
  new MutationObserver((mutations) => {
    const relevant = mutations.some(m => !(m.type === "attributes" && m.attributeName === "style"));
    if(relevant) hasUnsavedChanges = true;
  }).observe(el, { childList: true, subtree: true, characterData: true, attributes: true });
}

  const titles = { howto: "申込方法を追加", glossary: "用語を追加", faq: "質問を追加", password: "編集用パスワード" };

(async function loadExternalDataIfAvailable(){

    const data = await res.json();
    rebuildGuideFromData(data);
    hasUnsavedChanges = false;
  }catch(e){
    /* file:// で開いている場合や、ファイルが存在しない場合はここに来ます。何もしません */
  }
})();

</script>
