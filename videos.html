<title>動画まとめ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root{
  --oshi-color: #e0233a;
  --oshi-color-deep: #b81b30;
  --oshi-color-soft: #ffe2e6;
  --accent2: #ece6e8;
  --ink: #2b2331;
  --sub-ink: #7d6b78;
  --paper: #fffaf9;
  --line: #f0dde6;
  --card: #ffffff;
  --shadow-sm: 0 2px 10px rgba(43,35,49,0.06);
  --shadow-md: 0 10px 26px rgba(43,35,49,0.12);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--oshi-color); outline-offset:2px; border-radius:4px;
}
html{ scroll-behavior:smooth; }
body{ font-family:'Noto Sans JP', sans-serif; background:var(--paper); color:var(--ink); line-height:1.75; overflow-x:hidden; padding-bottom:72px; font-size:15px; }
h1,h2,h3,.brand{ font-family:'Zen Maru Gothic', sans-serif; }
a{ color:inherit; text-decoration:none; }
.wrap{ max-width:640px; margin:0 auto; padding:0 18px; }

.topnav{ position:sticky; top:0; z-index:50; background:rgba(255,250,249,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
.topnav .wrap{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; height:46px; column-gap:8px; }
.nav-left{ display:flex; align-items:center; gap:2px; justify-self:start; min-width:0; }
.back-link{ font-size:12.5px; font-weight:700; color:var(--oshi-color); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.back-link-edit{ display:none; border:none; background:transparent; color:var(--sub-ink); font-size:11px; cursor:pointer; padding:2px 4px; vertical-align:middle; flex:none; }
body.editing .back-link-edit{ display:inline-block; }
.back-link-edit:hover{ color:var(--oshi-color); }
.brand{ font-size:12px; color:var(--sub-ink); justify-self:center; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav-icons{ display:flex; align-items:center; gap:10px; justify-self:end; }
.nav-icon-btn{ flex:none; border:none; background:transparent; font-size:15px; cursor:pointer; padding:4px 2px; color:var(--sub-ink); line-height:1; }
.nav-icon-btn:hover{ color:var(--oshi-color); }

.p-hero{ position:relative; padding:26px 0 18px; text-align:center; overflow:hidden; }
.p-hero::before{
  content:""; position:absolute; top:4px; left:50%; width:170px; height:120px; transform:translateX(-50%);
  background:radial-gradient(circle, var(--oshi-color-soft) 0%, transparent 68%);
  opacity:0.9; pointer-events:none;
}
.p-hero .eyebrow{ position:relative; display:inline-block; font-size:10px; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:999px; padding:3px 10px; margin-bottom:9px; font-weight:700; }
.p-hero h1{ position:relative; font-size:clamp(19px,6.6vw,25px); font-weight:900; }
.p-hero p{ position:relative; margin:9px auto 0; max-width:420px; font-size:12.5px; color:var(--sub-ink); }

.daily-pick{ display:none; margin-top:16px; text-align:left; cursor:pointer; }
.daily-pick.show{ display:flex; gap:10px; background:linear-gradient(135deg, var(--oshi-color-soft), #fff); border:1px solid var(--oshi-color); border-radius:14px; padding:10px; }
.daily-pick-thumb{ flex:0 0 96px; aspect-ratio:16/9; border-radius:8px; overflow:hidden; background:var(--accent2); }
.daily-pick-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.daily-pick-body{ flex:1; min-width:0; }
.daily-pick-label{ font-size:10px; font-weight:700; color:var(--oshi-color); }
.daily-pick-title{ font-size:12.5px; font-weight:700; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.daily-pick-desc{ font-size:11px; color:var(--sub-ink); margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

.search-wrap{ position:relative; margin-top:16px; }
.search-input{
  width:100%; border:1px solid var(--line); border-radius:999px; padding:11px 16px; font-size:13px;
  font-family:inherit; background:#fff; color:var(--ink); box-shadow:var(--shadow-sm);
}
.search-input:focus{ outline:2px solid var(--oshi-color); outline-offset:1px; }
.category-filter{ display:none; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
.category-filter.show{ display:flex; }
.tag-filter-btn{
  border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:10.5px; font-weight:700;
  padding:5px 12px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.tag-filter-btn.active{ background:var(--oshi-color); border-color:var(--oshi-color); color:#fff; }
.sort-toggle-row{ display:flex; justify-content:center; margin-top:10px; }
.sort-toggle-btn{
  border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:11px; font-weight:700;
  padding:6px 14px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.sort-toggle-btn:hover{ border-color:var(--oshi-color); color:var(--oshi-color); }
.sort-toggle-btn.active{ background:var(--oshi-color); color:#fff; border-color:var(--oshi-color); }

section{ padding:20px 0 30px; }
.sec-head{ margin-bottom:16px; }
.sec-head-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.sec-head h2{ font-size:16.5px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
.sec-head h2 .mark{ color:var(--oshi-color); font-size:14px; }
.sec-head p{ color:var(--sub-ink); font-size:12px; margin-top:4px; }
.no-results{ display:none; text-align:center; color:var(--sub-ink); font-size:12.5px; padding:20px 0; }
.no-results.show{ display:block; }

/* 動画カード */
.video-list{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
@media (max-width:380px){ .video-list{ grid-template-columns:1fr; } }
.video-item{ position:relative; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow-sm); }
.video-thumb-link{ display:block; width:100%; position:relative; aspect-ratio:16/9; background:linear-gradient(135deg, var(--oshi-color-soft), var(--accent2)); border:none; padding:0; cursor:pointer; font-family:inherit; }
.video-thumb-link img{ width:100%; height:100%; object-fit:cover; display:block; }
.video-play-badge{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:30px; height:30px; border-radius:50%;
  background:rgba(20,20,20,0.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px;
  pointer-events:none;
}
.video-body{ padding:10px; }
.video-meta{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:5px; }
.video-category{ font-size:9px; font-weight:700; color:#fff; background:var(--oshi-color); border-radius:5px; padding:1px 7px; }
.video-date{ font-size:9px; font-weight:700; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:5px; padding:1px 7px; }
.video-new-badge{ font-size:9px; font-weight:700; color:#7a5c00; background:#ffd447; border-radius:5px; padding:1px 7px; }
.video-tags{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.video-tags:empty{ display:none; margin-top:0; }
.video-tag{ font-size:9.5px; font-weight:700; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:999px; padding:2px 8px; border:none; cursor:pointer; font-family:inherit; }
.video-tag:hover{ background:var(--oshi-color); color:#fff; }
.tag-chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
.tag-chip{
  display:inline-flex; align-items:center; gap:5px; background:var(--oshi-color); color:#fff; font-size:11.5px;
  font-weight:700; padding:5px 8px 5px 12px; border-radius:999px;
}
.tag-chip-remove{ border:none; background:rgba(255,255,255,0.3); color:#fff; width:16px; height:16px; border-radius:50%; font-size:10px; cursor:pointer; line-height:1; }
.tag-input-row{ display:flex; gap:6px; margin-top:6px; }
.tag-input-row .qa-input{ flex:1; }
.tag-add-btn{
  flex:none; border:1px solid var(--oshi-color); background:#fff; color:var(--oshi-color); font-size:12px; font-weight:700;
  padding:0 14px; border-radius:10px; cursor:pointer; font-family:inherit;
}
.tag-add-btn:hover{ background:var(--oshi-color-soft); }
.tag-suggest-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
.tag-suggest-label{ font-size:10.5px; color:var(--sub-ink); }
.chapter-chip-row{ display:flex; flex-direction:column; gap:6px; }
.chapter-chip{ display:flex; align-items:center; gap:8px; background:var(--accent2); border:1px solid var(--line); border-radius:10px; padding:6px 8px; }
.chapter-chip-time{ flex:none; font-weight:700; color:var(--oshi-color); font-size:12px; font-variant-numeric:tabular-nums; }
.chapter-chip-label{ flex:1; font-size:12px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chapter-chip-remove{ flex:none; border:none; background:var(--oshi-color-soft); color:var(--oshi-color); width:20px; height:20px; border-radius:50%; font-size:12px; cursor:pointer; line-height:1; }
.chapter-input-row{ display:flex; gap:6px; margin-top:6px; }
.chapter-input-row .qa-input:first-child{ flex:none; width:70px; }
.chapter-input-row .qa-input:last-child{ flex:1; }
.chapter-add-btn{
  flex:none; border:1px solid var(--oshi-color); background:#fff; color:var(--oshi-color); font-size:12px; font-weight:700;
  padding:0 14px; border-radius:10px; cursor:pointer; font-family:inherit;
}
.chapter-add-btn:hover{ background:var(--oshi-color-soft); }
.tag-suggest-btn{
  border:1px dashed var(--line); background:#fff; color:var(--sub-ink); font-size:11px; font-weight:700;
  padding:4px 10px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.tag-suggest-btn:hover{ border-color:var(--oshi-color); color:var(--oshi-color); }
.video-title{ font-size:12.5px; font-weight:700; margin-bottom:3px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.video-desc{ font-size:11px; color:var(--sub-ink); white-space:pre-line; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.video-recommend{
  margin-top:6px; background:#fffaf0; border:1px dashed #e0a800; border-radius:8px; padding:6px 8px;
  font-size:10.5px; color:#7a5c00;
}
.video-recommend-mark{ display:block; font-size:9px; font-weight:700; color:#c98a00; margin-bottom:2px; }
.video-watch-btn{
  display:inline-flex; align-items:center; gap:3px; margin-top:8px; border:1px solid var(--oshi-color); background:#fff;
  color:var(--oshi-color); font-size:10px; font-weight:700; padding:4px 10px; border-radius:999px; font-family:inherit; cursor:pointer;
}
.video-watch-btn:hover{ background:var(--oshi-color-soft); }
.video-dup-btn{
  display:none; margin-top:8px; width:100%; border:1px solid var(--line); background:#fff; color:var(--sub-ink);
  font-size:11.5px; font-weight:700; padding:7px 10px; border-radius:10px; cursor:pointer; font-family:inherit;
}
body.editing .video-dup-btn{ display:block; }
.video-dup-btn:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); border-color:var(--oshi-color); }
.video-related{ display:none; margin-top:10px; }
.video-related-label{ font-size:10.5px; color:var(--sub-ink); font-weight:700; margin-bottom:6px; }
.video-related-track{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; scroll-snap-type:x mandatory; cursor:grab; }
.video-related-track.dragging{ cursor:grabbing; scroll-snap-type:none; }
.video-related-track::-webkit-scrollbar{ display:none; }
.video-related-card{
  flex:0 0 96px; border:none; background:none; padding:0; cursor:pointer; text-align:left; font-family:inherit;
  scroll-snap-align:start;
}
.video-related-card img{ width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:8px; display:block; background:var(--accent2); border:1px solid var(--line); }
.video-related-card span{ display:block; margin-top:4px; font-size:10px; color:var(--ink); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.video-related-card:hover img{ opacity:0.85; }
.related-link-btn:hover{ background:var(--oshi-color-soft); }
.related-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.related-chip{
  display:inline-flex; align-items:center; gap:5px; background:var(--oshi-color); color:#fff; font-size:11.5px;
  font-weight:700; padding:5px 8px 5px 10px; border-radius:999px; max-width:220px;
}
.related-chip > :not(.related-chip-remove){ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.related-chip-remove{ border:none; background:rgba(255,255,255,0.3); color:#fff; width:16px; height:16px; border-radius:50%; font-size:10px; cursor:pointer; line-height:1; margin-left:2px; }
.related-order-btn{
  display:inline-flex; align-items:center; gap:4px; margin-top:8px; border:1px solid var(--oshi-color); background:#fff;
  color:var(--oshi-color); font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.related-order-btn:hover{ background:var(--oshi-color-soft); }
.related-order-row{ display:flex; align-items:center; gap:10px; background:var(--accent2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
input.related-order-input.qa-input{ flex:none; width:56px; text-align:center; padding:9px 4px; }
.related-order-title{ flex:1; font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.related-order-back-btn{
  display:block; width:100%; margin-top:14px; border:1px solid var(--line); background:#fff; color:var(--sub-ink);
  font-size:12.5px; font-weight:700; padding:9px; border-radius:10px; cursor:pointer; font-family:inherit;
}
.related-order-back-btn:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); border-color:var(--oshi-color); }
.dup-compare-heading{ font-size:11px; font-weight:700; color:var(--sub-ink); margin:12px 0 6px; }
.dup-compare-card{ display:flex; align-items:center; gap:10px; background:var(--accent2); border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:6px; }
.dup-compare-card img{ width:72px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; flex:none; background:#ddd; }
.dup-compare-info{ flex:1; min-width:0; }
.dup-compare-title{ font-size:12.5px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dup-compare-date{ font-size:10.5px; color:var(--sub-ink); margin-top:2px; }
.dup-confirm-btn{
  display:block; width:100%; margin-top:14px; border:1px solid var(--oshi-color); background:#fff; color:var(--oshi-color);
  font-size:13px; font-weight:900; padding:10px; border-radius:10px; cursor:pointer; font-family:inherit;
}
.dup-confirm-btn:hover{ background:var(--oshi-color-soft); }
.related-input-row{ display:flex; gap:6px; margin-top:6px; }
.related-input-row .qa-input{ flex:1; }
.related-add-btn{
  flex:none; border:1px solid var(--oshi-color); background:#fff; color:var(--oshi-color); font-size:12px; font-weight:700;
  padding:0 14px; border-radius:10px; cursor:pointer; font-family:inherit;
}
.related-add-btn:hover{ background:var(--oshi-color-soft); }
.related-suggest-label{ font-size:10.5px; color:var(--sub-ink); margin-top:8px; display:block; }
.related-suggest-list{ display:flex; flex-direction:column; gap:3px; margin-top:6px; max-height:160px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:5px; }
.related-suggest-item{
  display:flex; align-items:center; gap:6px; border:none; background:none; text-align:left; width:100%;
  padding:7px 8px; border-radius:8px; cursor:pointer; font-family:inherit; color:var(--ink); font-size:12.5px;
}
.related-suggest-item:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }
.related-suggest-item span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.related-suggest-empty{ font-size:11.5px; color:var(--sub-ink); padding:6px; text-align:center; }
@keyframes videoFlash{ 0%,100%{ box-shadow:var(--shadow-sm); } 30%{ box-shadow:0 0 0 4px var(--oshi-color-soft), var(--shadow-md); } }
.video-flash{ animation: videoFlash 1.4s ease; }

.load-more-btn{
  display:flex; align-items:center; justify-content:center; width:100%; margin-top:14px;
  border:1px solid var(--line); background:#fff; color:var(--oshi-color); font-weight:700; font-size:12.5px;
  padding:10px 16px; border-radius:12px; cursor:pointer; font-family:inherit;
}
.load-more-btn:hover{ background:var(--oshi-color-soft); }

footer{ text-align:center; padding:30px 0 16px; color:var(--sub-ink); font-size:11px; }
.last-updated{ margin-top:8px; font-size:10.5px; color:var(--sub-ink); }
.last-updated:empty{ display:none; }

.back-to-top{
  position:fixed; right:16px; bottom:78px; z-index:90; width:42px; height:42px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--oshi-color); font-size:18px; cursor:pointer;
  box-shadow:0 6px 18px rgba(43,35,49,0.15); display:none; align-items:center; justify-content:center;
  opacity:0; transition:opacity .2s ease;
}
.back-to-top.show{ display:flex; opacity:1; }
.back-to-top:hover{ background:var(--oshi-color-soft); }

/* 編集用の共通パーツ */
.editable{ outline:none; }
body.editing .editable{ outline:1.5px dashed var(--oshi-color); outline-offset:2px; border-radius:4px; cursor:text; }
body.editing .editable:hover{ background:var(--oshi-color-soft); }
.edit-remove{
  display:none; position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:16px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
.edit-edit{
  display:none; position:absolute; top:8px; right:44px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:14px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
body.editing .edit-remove, body.editing .edit-edit{ display:flex; }
body.editing .edit-remove:hover, body.editing .edit-edit:hover{ background:var(--oshi-color); color:#fff; border-color:var(--oshi-color); }

.reorder-row{ display:none; gap:6px; margin-top:8px; }
body.editing .reorder-row{ display:flex; }
.reorder-btn{
  border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:10.5px; font-weight:700;
  padding:4px 10px; border-radius:8px; cursor:pointer; font-family:inherit;
}
.reorder-btn:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }

.add-row{ display:none; margin-top:12px; }
body.editing .add-row{ display:flex; }
.add-btn{
  border:1.5px dashed var(--oshi-color); color:var(--oshi-color); background:#fff; border-radius:12px;
  padding:9px 16px; font-size:12.5px; font-weight:700; cursor:pointer; width:100%; text-align:center;
  transition:background .15s ease;
}
.add-btn:hover{ background:var(--oshi-color-soft); }

.edit-toolbar{
  display:none; position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
  border-radius:999px; padding:7px 8px; box-shadow:0 8px 24px rgba(43,35,49,0.18); z-index:100;
  max-width:94vw; overflow-x:auto; scrollbar-width:none;
}
.edit-toolbar.unlocked{ display:flex; }
.edit-toolbar::-webkit-scrollbar{ display:none; }
#footer-tap-target{ cursor:default; -webkit-tap-highlight-color:transparent; user-select:none; display:inline-block; }
.tb-btn{ flex:none; border:none; border-radius:999px; padding:9px 15px; font-size:12px; font-weight:700; cursor:pointer; background:var(--paper); color:var(--ink); white-space:nowrap; transition:background .15s ease; }
.tb-btn.primary{ background:var(--oshi-color); color:#fff; }
.tb-btn.primary:hover{ background:var(--oshi-color-deep); }
.tb-btn-icon{

<script>
/* @EDIT_ONLY_START */
/* ==========================================================
   編集用パスワード。他のページと同じ仕組み(SHA-256ハッシュ)。
   初期パスワードは "oshikatsu2026" です。
   ========================================================== */
const EDIT_PASSWORD_HASH = "ce9d9c91a8374c694448bdb6f6591003c96353d8eaf6ee9e32c7e47d47c1ac14";
async function sha256Hex(text){
  if(!window.crypto || !window.crypto.subtle){ return Promise.reject(new Error("subtlecrypto-unavailable")); }
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
}
let authenticated = false;
/* @EDIT_ONLY_END */
let editMode = false;

const VIDEOS = {
  navBrand: "動画まとめ",
  eyebrow: "公式チャンネルなど",
  title: "動画まとめ",
  desc: "公式チャンネルなどに投稿されている動画をまとめています。見逃した回もここでチェックできます。",
  items: [
    { title: "サンプル動画タイトル", category: "本編", date: "2026-06-01", desc: "動画の内容についての簡単な説明。", url: "", addedAt: "" },
    { title: "サンプルショート動画", category: "Shorts", date: "2026-06-10", desc: "", url: "", addedAt: "" },
  ],
};

function esc(s){ return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function isRecentlyAdded(addedAt){
  if(!addedAt) return false;
  const added = new Date(addedAt + "T00:00:00");
  if(isNaN(added.getTime())) return false;
  const diffDays = (new Date() - added) / (1000 * 60 * 60 * 24);
  return diffDays >= 0 && diffDays <= 7;
}
function formatDate(iso){
  if(!iso) return "";
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return iso;
  return `${m[1]}.${m[2]}.${m[3]}`;
}
function parseFlexibleDate(input){
  const raw = String(input || "").trim();
  if(!raw) return "";
  /* 全角数字・全角の区切り記号を半角に変換 */
  const s = raw
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．]/g, ".")
    .replace(/[／]/g, "/")
    .replace(/[－ー―]/g, "-");
  /* 前後に余分な文字が残っていても、日付らしき並びを拾えるよう部分一致で探す */
  let m = s.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?/);
  if(!m) m = s.match(/(\d{4})[\-\/\.](\d{1,2})[\-\/\.](\d{1,2})/);
  if(!m) m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(!m) return raw; /* 解釈できない場合は入力をそのまま返す(データを消さない) */
  const y = m[1];
  const mo = String(parseInt(m[2], 10)).padStart(2, "0");
  const d = String(parseInt(m[3], 10)).padStart(2, "0");
  const check = new Date(`${y}-${mo}-${d}T00:00:00`);
  if(isNaN(check.getTime())) return raw;
  return `${y}-${mo}-${d}`;
}
function getYouTubeId(url){
  if(!url) return null;
  try{
    const u = new URL(url);
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
    if(u.hostname.includes("youtube.com")){
      if(u.pathname === "/watch") return u.searchParams.get("v");
      const m = u.pathname.match(/\/(embed|shorts)\/([^/?]+)/);
      if(m) return m[2];
    }
  }catch(e){ /* 不正なURLは無視 */ }
  return null;
}
function parseChaptersField(raw){
  return (raw || "").split("|||").map(s => s.trim()).filter(Boolean).map(entry => {
    const sepIdx = entry.indexOf("::");
    if(sepIdx === -1) return null;
    const time = parseFloat(entry.slice(0, sepIdx));
    const label = entry.slice(sepIdx + 2);
    if(isNaN(time)) return null;
    return { time, label };
  }).filter(Boolean);
}
const REORDER_ROW = '<div class="reorder-row"><button class="reorder-btn move-up" type="button">↑ 上へ</button><button class="reorder-btn move-down" type="button">↓ 下へ</button></div>';

let videoOrderCounter = 0;
function videoItemHTML(v){
  const ytId = getYouTubeId(v.url);
  const thumbSrc = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : "";
  const thumbInner = thumbSrc ? `<img src="${thumbSrc}" alt="">` : "";
  let thumbHtml, watchBtn;
  if(ytId){
    thumbHtml = `<button type="button" class="video-thumb-link" data-yt-id="${ytId}" aria-label="動画を再生">${thumbInner}<span class="video-play-badge">▶</span></button>`;
    watchBtn = `<button type="button" class="video-watch-btn" data-yt-id="${ytId}">▶ 再生する</button>`;
  } else if(v.url){
    thumbHtml = `<a class="video-thumb-link" href="${esc(v.url)}" target="_blank" rel="noopener"><span class="video-play-badge">▶</span></a>`;
    watchBtn = `<a class="video-watch-btn" href="${esc(v.url)}" target="_blank" rel="noopener">▶ 視聴する</a>`;
  } else {
    thumbHtml = `<div class="video-thumb-link"><span class="video-play-badge">▶</span></div>`;
    watchBtn = "";
  }
  const newBadge = isRecentlyAdded(v.addedAt) ? `<span class="video-new-badge">NEW</span>` : "";
  const dateHtml = v.date ? `<span class="video-date">${formatDate(v.date)}</span>` : "";
  const order = (v.order !== undefined && v.order !== "") ? v.order : videoOrderCounter++;
  const relatedRaw = Array.isArray(v.related) ? v.related.join("|||") : (v.related || "");
  const recommendHtml = v.recommend
    ? `<div class="video-recommend editable" contenteditable="false"><span class="video-recommend-mark">💡 おすすめポイント</span>${esc(v.recommend)}</div>`
    : `<div class="video-recommend editable" contenteditable="false" style="display:none;"><span class="video-recommend-mark">💡 おすすめポイント</span></div>`;
  const tagsArr = Array.isArray(v.tags) ? v.tags : (v.tags ? String(v.tags).split("|||").filter(Boolean) : []);
  const tagsRaw = tagsArr.join("|||");
  const tagsHtml = tagsArr.length ? `<div class="video-tags">${tagsArr.map(t => `<button type="button" class="video-tag" data-tag="${escAttr(t)}">#${esc(t)}</button>`).join("")}</div>` : `<div class="video-tags"></div>`;
  const chaptersArr = Array.isArray(v.chapters) ? v.chapters : [];
  const chaptersRaw = chaptersArr.map(c => `${c.time}::${c.label}`).join("|||") || (typeof v.chapters === "string" ? v.chapters : "");
  return `<div class="editable-item video-item" data-category="${escAttr(v.category)}" data-date="${escAttr(v.date)}" data-url="${escAttr(v.url)}" data-added="${escAttr(v.addedAt)}" data-order="${order}" data-related="${escAttr(relatedRaw)}" data-tags="${escAttr(tagsRaw)}" data-pickup-comment="${escAttr(v.pickupComment)}" data-chapters="${escAttr(chaptersRaw)}" data-series-order="${escAttr(v.seriesOrder || "")}">
    <button class="edit-edit" aria-label="編集">✎</button>
    <button class="edit-remove" aria-label="削除">×</button>
    ${thumbHtml}
    <div class="video-body">
      <div class="video-meta">${newBadge}${dateHtml}<span class="video-category editable" contenteditable="false">${esc(v.category || "その他")}</span></div>
      <h3 class="video-title editable" contenteditable="false">${esc(v.title)}</h3>
      <p class="video-desc editable" contenteditable="false">${esc(v.desc)}</p>
      ${recommendHtml}
      ${tagsHtml}
      ${watchBtn}
      <button type="button" class="video-dup-btn">⧉ この内容で複製</button>
      <div class="video-related" data-role="related"></div>
    </div>
    ${REORDER_ROW}
  </div>`;
}

function renderAll(data){
  document.getElementById("nav-brand").textContent = data.navBrand;
  document.getElementById("p-eyebrow").textContent = data.eyebrow;
  document.getElementById("p-title").textContent = data.title;
  document.getElementById("p-desc").textContent = data.desc;
  document.getElementById("video-list").innerHTML = data.items.map(videoItemHTML).join("");
}
if(!document.body.dataset.rendered){
  renderAll(VIDEOS);
  document.body.dataset.rendered = "true";
}

/* ---------- SNSシェア用OGPタグの同期 ---------- */
const OGP_IMAGE_URL = "";
function syncOgpTags(){
  const title = document.getElementById("p-title").textContent.trim();
  const desc = document.getElementById("p-desc").textContent.trim();
  const setMeta = (selector, value) => {
    const el = document.querySelector(selector);
    if(el && value) el.setAttribute("content", value);
  };
  setMeta('meta[property="og:title"]', title || "動画まとめ");
  setMeta('meta[property="og:description"]', desc);
  setMeta('meta[name="twitter:title"]', title || "動画まとめ");
  setMeta('meta[name="twitter:description"]', desc);
  if(OGP_IMAGE_URL){ setMeta('meta[property="og:image"]', OGP_IMAGE_URL); setMeta('meta[name="twitter:image"]', OGP_IMAGE_URL); }
  if(location.href.indexOf("file://") !== 0){ setMeta('meta[property="og:url"]', location.href); }
}
syncOgpTags();

/* ---------- PWA:Service Worker登録 ---------- */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ---------- 未保存の変更を警告 ---------- */
let hasUnsavedChanges = false;
/* @EDIT_ONLY_START */
function watchDirty(id){
  const el = document.getElementById(id);
  if(!el) return;
  new MutationObserver((mutations) => {
    const relevant = mutations.some(m => !(m.type === "attributes" && m.attributeName === "style"));
    if(relevant) hasUnsavedChanges = true;
  }).observe(el, { childList: true, subtree: true, characterData: true, attributes: true });
}
["nav-brand","p-eyebrow","p-title","p-desc","video-list"].forEach(watchDirty);
window.addEventListener("beforeunload", (e) => {
  if(hasUnsavedChanges){ e.preventDefault(); e.returnValue = ""; }
});
/* @EDIT_ONLY_END */

/* ---------- シェアボタン ---------- */
document.getElementById("share-btn-nav").addEventListener("click", async () => {
  const title = document.getElementById("p-title").textContent.trim();
  const desc = document.getElementById("p-desc").textContent.trim();
  const shareText = desc ? `${title}｜${desc}` : title;
  const shareUrl = location.href;
  if(navigator.share){
    try{ await navigator.share({ title, text: shareText, url: shareUrl }); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  const intent = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`;
  const opened = window.open(intent, "_blank", "noopener");
  if(!opened){
    const fallbackText = `${shareText} ${shareUrl}`;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(fallbackText)
        .then(() => alert("シェア用の文章をコピーしました。SNSに貼り付けてご利用ください。\n\n" + fallbackText))
        .catch(() => alert("シェアウィンドウを開けませんでした(ポップアップブロックの可能性)。以下をコピーしてご利用ください。\n\n" + fallbackText));
    } else {
      alert("シェアウィンドウを開けませんでした(ポップアップブロックの可能性)。以下をコピーしてご利用ください。\n\n" + fallbackText);
    }
  }
});

/* ---------- 印刷 ---------- */
document.getElementById("print-btn").addEventListener("click", () => window.print());

/* ---------- 横スクロール一覧(次の動画・関連動画)をPCでも操作できるように ---------- */
document.addEventListener("wheel", (e) => {
  const track = e.target.closest(".up-next-track, .video-related-track");
  if(!track) return;
  if(track.scrollWidth <= track.clientWidth) return;
  if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault();
  track.scrollLeft += e.deltaY;
}, { passive: false });
(function initTrackDragScroll(){
  let dragTrack = null;
  let startX = 0;
  let startScroll = 0;
  let moved = false;
  document.addEventListener("mousedown", (e) => {
    const track = e.target.closest(".up-next-track, .video-related-track");
    if(!track || track.scrollWidth <= track.clientWidth) return;
    dragTrack = track;
    startX = e.clientX;
    startScroll = track.scrollLeft;
    moved = false;
    track.classList.add("dragging");
  });
  document.addEventListener("mousemove", (e) => {
    if(!dragTrack) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 4) moved = true;
    dragTrack.scrollLeft = startScroll - dx;
  });
  document.addEventListener("mouseup", () => {
    if(dragTrack) dragTrack.classList.remove("dragging");
    dragTrack = null;
  });
  document.addEventListener("click", (e) => {
    if(moved && e.target.closest(".up-next-track, .video-related-track")){
      e.preventDefault();
      e.stopPropagation();
      moved = false;
    }
  }, true);
})();

/* ---------- 関連動画:順番(010,020形式)の解析・並び替え共通処理 ---------- */
function parseRelatedField(raw){
  return (raw || "").split("|||").map(s => s.trim()).filter(Boolean).map(entry => {
    const sepIdx = entry.lastIndexOf("::");
    return sepIdx === -1 ? entry : entry.slice(0, sepIdx);
  });
}
function serializeRelatedField(list){
  return list.join("|||");
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sortRelatedEntries(list){
  const getOrder = (r) => (r.el && r.el.dataset.seriesOrder) || "";
  const hasOrder = (r) => { const o = getOrder(r); return o !== "" && !isNaN(parseFloat(o)); };
  const ordered = list.filter(hasOrder).slice().sort((a, b) => parseFloat(getOrder(a)) - parseFloat(getOrder(b)));
  const unordered = shuffleArray(list.filter(r => !hasOrder(r)));
  return ordered.concat(unordered);
}
const relatedSortCache = new WeakMap();
function getStableSortedRelated(item, parsedList){
  const raw = item.dataset.related || "";
  const cached = relatedSortCache.get(item);
  if(cached && cached.raw === raw) return cached.sorted;
  const sorted = sortRelatedEntries(parsedList);
  relatedSortCache.set(item, { raw, sorted });
  return sorted;
}
function renderRelatedLinks(){
  const items = Array.from(document.querySelectorAll("#video-list .video-item"));
  const titleMap = new Map();
  items.forEach(item => {
    const t = item.querySelector(".video-title")?.textContent.trim();
    if(t && !titleMap.has(t)) titleMap.set(t, item);
  });
  items.forEach(item => {
    const wrap = item.querySelector('[data-role="related"]');
    if(!wrap) return;
    const parsed = parseRelatedField(item.dataset.related)
      .map(title => ({ title, el: titleMap.get(title) }))
      .filter(r => r.el && r.el !== item);
    const validItems = getStableSortedRelated(item, parsed).map(r => r.el);
    const newHtml = validItems.length
      ? `<div class="video-related-label">🔗 関連動画・シリーズ</div><div class="video-related-track">${validItems.map(el => {
          const entry = buildUpNextEntry(el);
          const thumbHtml = entry.thumb ? `<img src="${entry.thumb}" alt="">` : "";
          return `<button type="button" class="video-related-card" data-target="${escAttr(entry.title)}">${thumbHtml}<span>${esc(entry.title)}</span></button>`;
        }).join("")}</div>`
      : "";
    if(wrap.innerHTML !== newHtml) wrap.innerHTML = newHtml;
    const wantDisplay = validItems.length ? "block" : "none";
    if(wrap.style.display !== wantDisplay) wrap.style.display = wantDisplay;
  });
}

function syncRelatedBidirectional(currentTitle, oldTitles, newTitles){
  const items = Array.from(document.querySelectorAll("#video-list .video-item"));
  const findByTitle = (t) => items.find(item => item.querySelector(".video-title")?.textContent.trim() === t);
  const added = newTitles.filter(t => !oldTitles.includes(t));
  const removed = oldTitles.filter(t => !newTitles.includes(t));
  added.forEach(targetTitle => {
    const target = findByTitle(targetTitle);
    if(!target) return;
    const targetRelated = parseRelatedField(target.dataset.related);
    if(!targetRelated.includes(currentTitle)){
      targetRelated.push(currentTitle);
      target.dataset.related = serializeRelatedField(targetRelated);
    }
  });
  removed.forEach(targetTitle => {
    const target = findByTitle(targetTitle);
    if(!target) return;
    const targetRelated = parseRelatedField(target.dataset.related);
    const idx = targetRelated.indexOf(currentTitle);
    if(idx !== -1){
      targetRelated.splice(idx, 1);
      target.dataset.related = serializeRelatedField(targetRelated);
    }
  });
}

let pendingChapters = [];
function formatSecondsToTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}
function parseTimeToSeconds(str){
  const trimmed = (str || "").trim();
  if(!trimmed) return null;
  const parts = trimmed.split(":").map(s => s.trim());
  if(parts.some(p => p === "" || isNaN(Number(p)))) return null;
  let sec = 0;
  for(const p of parts) sec = sec * 60 + Number(p);
  return sec;
}
function renderChapterChips(){
  const wrap = document.getElementById("chapter-chip-row");
  if(!wrap) return;
  wrap.innerHTML = pendingChapters.map((c, i) => `<div class="chapter-chip"><span class="chapter-chip-time">⏱ ${formatSecondsToTime(c.time)}</span><span class="chapter-chip-label">${esc(c.label)}</span><button type="button" class="chapter-chip-remove" data-idx="${i}" aria-label="削除">×</button></div>`).join("");
}
function addChapterChip(timeStr, label){
  const sec = parseTimeToSeconds(timeStr);
  const trimmedLabel = (label || "").trim();
  if(sec === null || !trimmedLabel) return false;
  pendingChapters.push({ time: sec, label: trimmedLabel });
  pendingChapters.sort((a, b) => a.time - b.time);
  renderChapterChips();
  return true;
}

let ytApiPromise = null;
function loadYouTubeAPI(){
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve) => {
    if(window.YT && window.YT.Player){ resolve(); return; }
    const prevCallback = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if(typeof prevCallback === "function") prevCallback(); resolve(); };
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  });
  return ytApiPromise;
}
let ytPlayer = null;
let currentPlayerSourceItem = null;
let currentPlayingYtId = null;
let lastUpNextList = [];
function buildUpNextEntry(el){
  return {
    ytId: getYouTubeId(el.dataset.url),
    title: el.querySelector(".video-title")?.textContent.trim() || "",
    thumb: el.querySelector(".video-thumb-link img")?.getAttribute("src") || "",
    item: el,
  };
}
function getUpNextSections(afterItem){
  const byTitle = new Map();
  Array.from(document.querySelectorAll("#video-list .video-item")).forEach(el => {
    const t = el.querySelector(".video-title")?.textContent.trim();
    if(t && !byTitle.has(t)) byTitle.set(t, el);
  });
  const relatedParsed = parseRelatedField(afterItem.dataset.related)
    .map(title => ({ title, el: byTitle.get(title) }))
    .filter(r => r.el && r.el !== afterItem);
  const relatedSorted = sortRelatedEntries(relatedParsed);
  const related = relatedSorted.map(r => buildUpNextEntry(r.el)).filter(v => v.ytId);
  const relatedElSet = new Set(relatedSorted.map(r => r.el));
  const visible = getMatchedVideoItems();
  const candidatePool = visible.filter(el => el !== afterItem && !relatedElSet.has(el));
  const next = shuffleArray(candidatePool).slice(0, 5).map(buildUpNextEntry).filter(v => v.ytId);
  return { related, next };
}
function renderUpNext(afterItem){
  const wrap = document.getElementById("video-up-next");
  const { related, next } = getUpNextSections(afterItem);
  const combined = related.concat(next);
  lastUpNextList = combined;
  if(!combined.length){ wrap.classList.remove("show"); wrap.innerHTML = ""; return; }
  let offset = 0;
  const buildTrack = (list) => {
    const html = list.map((v, i) => `<button type="button" class="up-next-card" data-idx="${offset + i}"><img src="${v.thumb}" alt="">${esc(v.title) ? `<span>${esc(v.title)}</span>` : ""}</button>`).join("");
    offset += list.length;
    return html;
  };
  const relatedHtml = related.length
    ? `<div class="up-next-label">🔗 関連動画・シリーズ</div><div class="up-next-track">${buildTrack(related)}</div>`
    : "";
  const nextHtml = next.length
    ? `<div class="up-next-label"${related.length ? ' style="margin-top:14px;"' : ""}><span class="up-next-badge">NEXT</span>次の動画</div><div class="up-next-track">${buildTrack(next)}</div>`
    : "";
  wrap.innerHTML = relatedHtml + nextHtml;
  wrap.classList.add("show");
  setTimeout(() => wrap.scrollIntoView({ behavior: "smooth", block: "nearest" }), 100);
}
let upNextCheckTimer = null;
const UP_NEXT_LEAD_SECONDS = 15;
function startUpNextWatcher(){
  clearInterval(upNextCheckTimer);
  let alreadyShown = false;
  upNextCheckTimer = setInterval(() => {
    if(!ytPlayer || typeof ytPlayer.getDuration !== "function") return;
    const duration = ytPlayer.getDuration();
    const current = ytPlayer.getCurrentTime();
    if(!duration || alreadyShown) return;
    if(duration - current <= UP_NEXT_LEAD_SECONDS){
      alreadyShown = true;
      renderUpNext(currentPlayerSourceItem);
    }
  }, 1000);
}
function stopUpNextWatcher(){
  clearInterval(upNextCheckTimer);
}
function watchDirectly(ytId){
  window.open(`https://www.youtube.com/watch?v=${ytId}`, "_blank", "noopener");
}
async function openVideoPlayer(ytId, sourceItem, startSeconds){
  if(location.protocol === "file:"){
    /* file://で開いている場合、埋め込み再生の仕組みが動作しないためYouTubeを直接開く */
    watchDirectly(ytId);
    return;
  }
  stopUpNextWatcher();
  currentPlayerSourceItem = sourceItem;
  currentPlayingYtId = ytId;
  document.getElementById("video-player-backdrop").classList.add("open");
  document.getElementById("video-up-next").classList.remove("show");
  document.getElementById("video-up-next").innerHTML = "";
  renderPlayerChapters(sourceItem);
  await loadYouTubeAPI();
  if(ytPlayer && typeof ytPlayer.loadVideoById === "function"){
    ytPlayer.loadVideoById({ videoId: ytId, startSeconds: startSeconds || 0 });
  } else {
    document.getElementById("video-player-frame").innerHTML = '<div id="yt-player-el"></div>';
    ytPlayer = new YT.Player("yt-player-el", {
      videoId: ytId,
      playerVars: { autoplay: 1, rel: 0, origin: location.origin, start: Math.floor(startSeconds || 0) },
      events: {
        onStateChange: (e) => {
          if(e.data === YT.PlayerState.PLAYING) startUpNextWatcher();
          if(e.data === YT.PlayerState.PAUSED) stopUpNextWatcher();
          if(e.data === YT.PlayerState.ENDED){ stopUpNextWatcher(); renderUpNext(currentPlayerSourceItem); }
        },
        onError: () => {
          closeVideoPlayer();
          alert("この動画は埋め込み再生ができないようです。YouTubeで直接開きます。");
          watchDirectly(currentPlayingYtId);
        },
      },
    });
  }
}
function renderPlayerChapters(sourceItem){
  const wrap = document.getElementById("video-player-chapters");
  const chapters = parseChaptersField(sourceItem?.dataset.chapters);
  if(!chapters.length){
    wrap.classList.remove("show");

  wrap.innerHTML = chapters.map(c => `<button type="button" class="video-player-chapter-btn" data-time="${c.time}">⏱ ${formatSecondsToTime(c.time)} ${esc(c.label)}</button>`).join("");

}

  if(typeof ytPlayer.playVideo === "function") ytPlayer.playVideo();
});
function closeVideoPlayer(){
  document.getElementById("video-player-backdrop").classList.remove("open");
  document.getElementById("video-up-next").classList.remove("show");
  stopUpNextWatcher();
  if(ytPlayer && typeof ytPlayer.stopVideo === "function") ytPlayer.stopVideo();
}
document.getElementById("video-player-close").addEventListener("click", closeVideoPlayer);
document.getElementById("video-player-backdrop").addEventListener("click", (e) => {
  if(e.target.id === "video-player-backdrop") closeVideoPlayer();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && document.getElementById("video-player-backdrop").classList.contains("open")) closeVideoPlayer();
});
document.getElementById("video-list").addEventListener("click", (e) => {
  if(document.body.classList.contains("editing")) return;
  const trigger = e.target.closest("[data-yt-id]");
  if(!trigger) return;
  e.preventDefault();
  const item = trigger.closest(".video-item");
  openVideoPlayer(trigger.dataset.ytId, item);
});
document.getElementById("video-list").addEventListener("click", (e) => {
  const tagBtn = e.target.closest(".video-tag");
  if(!tagBtn) return;
  currentCategoryFilter = "all";
  showAllItems = false;
  activeTagFilter = tagBtn.dataset.tag;
  document.querySelectorAll("#category-filter .tag-filter-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === "all"));
  const searchInput = document.getElementById("video-search");
  searchInput.value = tagBtn.dataset.tag;
  applyVideoFilter();
  searchInput.scrollIntoView({ behavior: "smooth", block: "center" });
});
document.getElementById("video-up-next").addEventListener("click", (e) => {
  const card = e.target.closest(".up-next-card");
  if(!card) return;
  const entry = lastUpNextList[parseInt(card.dataset.idx, 10)];
  if(!entry) return;
  openVideoPlayer(entry.ytId, entry.item);
});

/* ---------- データのエクスポート・インポート(JSON) ---------- */
/* @EDIT_ONLY_START */
function extractPageData(){
  return {
    navBrand: document.getElementById("nav-brand").textContent,
    eyebrow: document.getElementById("p-eyebrow").textContent,
    title: document.getElementById("p-title").textContent,
    desc: document.getElementById("p-desc").textContent,
    items: Array.from(document.querySelectorAll("#video-list .video-item")).map(el => ({
      title: el.querySelector(".video-title")?.textContent.trim() || "",
      url: el.dataset.url || "",
      category: el.dataset.category || "",
      date: el.dataset.date || "",
      desc: el.querySelector(".video-desc")?.textContent.trim() || "",
      recommend: el.querySelector(".video-recommend")?.textContent.replace(/^💡\s*おすすめポイント/, "").trim() || "",
      pickupComment: el.dataset.pickupComment || "",
      chapters: el.dataset.chapters || "",
      seriesOrder: el.dataset.seriesOrder || "",
      related: el.dataset.related || "",
      tags: el.dataset.tags || "",
      addedAt: el.dataset.added || "",
      order: el.dataset.order || "",
    })),
    backLinkUrl: document.querySelector(".back-link")?.getAttribute("href") || "",
  };
}
/* @EDIT_ONLY_END */
function rebuildFromData(data){
  if(data.navBrand !== undefined) document.getElementById("nav-brand").textContent = data.navBrand;
  if(data.eyebrow !== undefined) document.getElementById("p-eyebrow").textContent = data.eyebrow;
  if(data.title !== undefined) document.getElementById("p-title").textContent = data.title;
  if(data.desc !== undefined) document.getElementById("p-desc").textContent = data.desc;
  if(data.backLinkUrl){
    const link = document.querySelector(".back-link");
    if(link){ link.setAttribute("href", data.backLinkUrl); link.dataset.url = data.backLinkUrl; }
  }
  if(data.items){
    document.getElementById("video-list").innerHTML = data.items.map(videoItemHTML).join("");
    const maxOrder = Math.max(-1, ...data.items.map(it => parseInt(it.order, 10)).filter(n => !isNaN(n)));
    videoOrderCounter = Math.max(videoOrderCounter, maxOrder + 1);
    sortVideoList();
  }
  setEditable(editMode);
  syncOgpTags();
  renderCategoryFilter();
  renderDailyPick();
  renderRelatedLinks();
  hasUnsavedChanges = true;
}
/* @EDIT_ONLY_START */
document.getElementById("export-data").addEventListener("click", () => {
  const json = JSON.stringify(extractPageData(), null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "videos-data.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  hasUnsavedChanges = false;
});
document.getElementById("import-data").addEventListener("click", () => {
  document.getElementById("import-file-input").click();
});
document.getElementById("import-file-input").addEventListener("change", (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  if(!confirm("現在の内容を、選んだファイルの内容で上書きします。よろしいですか?")) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      rebuildFromData(data);
      alert("データを読み込みました。内容を確認して「🌐 公開用HTMLを書き出す」または「📤 データを書き出し」をご利用ください。");
    }catch(err){
      alert("ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。");
    }
  };
  reader.readAsText(file);
});
/* @EDIT_ONLY_END */

/* タップ数の計測(GA4イベント) */
document.addEventListener("click", (e) => {
  const link = e.target.closest("a[href]");
  if(!link) return;
  if(typeof gtag === "function"){
    const label = (link.textContent || "").trim().slice(0, 60) || link.getAttribute("href");
    gtag("event", "tap", { event_category: "link", event_label: label });
  }
});

/* 公開用HTML(編集機能を削除した閲覧専用版)を書き出す */
/* @EDIT_ONLY_START */
function generatePublicHtml(){
  const clone = document.documentElement.cloneNode(true);
  clone.querySelectorAll(".edit-toolbar, #modal-backdrop, .edit-edit, .edit-remove, .add-row, .reorder-row, .back-link-edit, .video-dup-btn").forEach(el => el.remove());
  const cloneBody = clone.querySelector("body");
  if(cloneBody){
    cloneBody.classList.remove("editing");
    let overlayClone = clone.querySelector("#initial-load-overlay");
    if(!overlayClone){
      overlayClone = document.createElement("div");
      overlayClone.id = "initial-load-overlay";
      overlayClone.className = "initial-load-overlay";
      overlayClone.innerHTML = '<div class="initial-load-spinner"></div>';
      cloneBody.insertBefore(overlayClone, cloneBody.firstChild);
    } else {
      overlayClone.classList.remove("hide");
      overlayClone.removeAttribute("data-hidden");
    }
  }
  const scripts = clone.querySelectorAll("script");
  const mainScript = scripts[scripts.length - 1];
  if(mainScript){
    mainScript.textContent = mainScript.textContent.replace(/\/\* @EDIT_ONLY_START \*\/[\s\S]*?\/\* @EDIT_ONLY_END \*\//g, "");
  }
  const htmlOut = "<!DOCTYPE html>\n" + clone.outerHTML;
  const blob = new Blob([htmlOut], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "videos-public.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
publicHtmlBtn.addEventListener("click", generatePublicHtml);
/* @EDIT_ONLY_END */

/* ---------- 同じ場所にある videos-data.json があれば自動で読み込む ----------
   ・https(またはローカルサーバー)環境でのみ動作します(file:// では読み込めません)
   ・見つかった場合は、そちらの内容でページを上書きします
   ・見つからない/読み込めない場合は、何も起きず今の内容のまま表示されます */
(async function loadExternalDataIfAvailable(){
  const overlay = document.getElementById("initial-load-overlay");
  const hideOverlay = () => {
    if(!overlay || overlay.dataset.hidden) return;
    overlay.dataset.hidden = "1";
    overlay.classList.add("hide");
    setTimeout(() => overlay.remove(), 300);
  };
  const safetyTimer = setTimeout(hideOverlay, 1500); /* 通信が遅い・失敗している場合の保険。1.5秒経ったら諦めて今の内容を表示する */
  try{
    const res = await fetch("videos-data.json", { cache: "no-store" });
    if(!res.ok) return;
    const data = await res.json();
    rebuildFromData(data);
    hasUnsavedChanges = false;
  }catch(e){
    /* file:// で開いている場合や、ファイルが存在しない場合はここに来ます。何もしません */
  }finally{
    clearTimeout(safetyTimer);
    hideOverlay();
  }
})();
