<script>
/* ---------- サイト全体のお知らせバナー(index.htmlで編集・書き出し) ---------- */
function renderSiteBanner(data){
  const banner = document.getElementById("site-banner");
  if(!banner) return;
  if(!data || !data.active || !data.text){ banner.style.display = "none"; return; }
  let dismissed = "";
  try{ dismissed = localStorage.getItem("oshi_banner_dismissed") || ""; }catch(e){ /* localStorage不可の環境 */ }
  document.getElementById("site-banner-text").textContent = data.text;
  document.getElementById("site-banner-link").href = data.url || "#";
  banner.style.display = (dismissed === data.text) ? "none" : "block";
}
document.getElementById("site-banner-close")?.addEventListener("click", () => {
  const text = document.getElementById("site-banner-text").textContent.trim();
  try{ localStorage.setItem("oshi_banner_dismissed", text); }catch(e){ /* localStorage不可の環境 */ }
  document.getElementById("site-banner").style.display = "none";
});
(async function loadBannerIfAvailable(){
  try{
    if(location.href.indexOf("file://") === 0) return;
    const res = await fetch("announcement-data.json?_=" + Date.now(), { cache: "no-store" });
    if(!res.ok) return;
    const data = await res.json();
    renderSiteBanner(data);
  }catch(e){ /* ファイルが無い場合は何もしない */ }
})();

function escapeHtml(str){
  return String(str || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ---------- サイトカラー(index.htmlで設定した色をこのページにも反映) ---------- */
const THEME_COLOR_KEY = "oshi-theme-color";
function hexToHsl(hex){
  const m = hex.replace("#", "").match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if(!m) return null;
  let r = parseInt(m[1], 16) / 255, g = parseInt(m[2], 16) / 255, b = parseInt(m[3], 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;
  const d = max - min;
  if(d === 0){ h = 0; s = 0; }
  else{
    s = d / (1 - Math.abs(2 * l - 1));
    switch(max){
      case r: h = ((g - b) / d) % 6; break;
      case g: h = (b - r) / d + 2; break;
      default: h = (r - g) / d + 4;
    }
    h *= 60;
    if(h < 0) h += 360;
  }
  return { h, s: s * 100, l: l * 100 };
}
function hslToCss(h, s, l){ return `hsl(${h.toFixed(1)}, ${Math.max(0, Math.min(100, s)).toFixed(1)}%, ${Math.max(0, Math.min(100, l)).toFixed(1)}%)`; }
function hslToRgbTriplet(h, s, l){
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if(h < 60){ r = c; g = x; b = 0; }
  else if(h < 120){ r = x; g = c; b = 0; }
  else if(h < 180){ r = 0; g = c; b = x; }
  else if(h < 240){ r = 0; g = x; b = c; }
  else if(h < 300){ r = x; g = 0; b = c; }
  else{ r = c; g = 0; b = x; }
  return [r, g, b].map(v => Math.round((v + m) * 255)).join(", ");
}
function applyThemeColor(hex){
  const hsl = hexToHsl(hex);
  if(!hsl) return;
  const { h, s } = hsl;
  let style = document.getElementById("theme-color-override");
  if(!style){ style = document.createElement("style"); style.id = "theme-color-override"; document.head.appendChild(style); }
  style.textContent = `
    :root{
      --oshi-color: ${hslToCss(h, s, 50)};
      --oshi-color-rgb: ${hslToRgbTriplet(h, s, 50)};
      --oshi-color-deep: ${hslToCss(h, s, 38)};
      --oshi-color-soft: ${hslToCss(h, Math.min(100, s * 0.6), 92)};
      --paper: ${hslToCss(h, Math.min(100, s * 0.5), 97.3)};
      --accent2: ${hslToCss(h, Math.min(100, s * 0.35), 90)};
      --line: ${hslToCss(h, Math.min(100, s * 0.6), 88)};
    }
    html.dark-mode{
      --oshi-color: ${hslToCss(h, s, 66)};
      --oshi-color-rgb: ${hslToRgbTriplet(h, s, 66)};
      --oshi-color-deep: ${hslToCss(h, s, 76)};
      --oshi-color-soft: ${hslToCss(h, Math.min(100, s * 0.7), 18)};
      --paper: ${hslToCss(h, Math.min(100, s * 0.35), 8)};
      --accent2: ${hslToCss(h, Math.min(100, s * 0.3), 16)};
      --line: ${hslToCss(h, Math.min(100, s * 0.3), 21)};
      --card: ${hslToCss(h, Math.min(100, s * 0.3), 14)};
    }
  `;
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  if(themeMeta) themeMeta.setAttribute("content", hex);
}
function loadThemeColor(){
  try{
    const saved = localStorage.getItem(THEME_COLOR_KEY);
    if(saved) applyThemeColor(saved);
  }catch(e){ /* ストレージ利用不可の場合は無視 */ }
}
loadThemeColor();
/* ---------- 今週の推し活まとめ:各ページの新着・最近の日付のものを集める ---------- */
const DIGEST_SOURCES = [
  { file: "log-data.json", label: "配信ログ", url: "log.html", dateField: "date" },
  { file: "setlist-data.json", label: "セトリまとめ", url: "setlist.html", dateField: "date" },
  { file: "updates-data.json", label: "更新履歴", url: "updates.html", dateField: "date" },
  { file: "goods-data.json", label: "グッズ", url: "goods.html", dateField: "addedAt", listKey: "items" },
  { file: "achievements-data.json", label: "活動実績", url: "achievements.html", dateField: "addedAt", listKey: ["songs","performances","media"] },
  { file: "videos-data.json", label: "動画まとめ", url: "videos.html", dateField: "addedAt", listKey: "videos" },
];
const DIGEST_DAYS = 7;
function parseAnyDate(str){
  const s = String(str || "");
  let m = s.match(/^(\d{4})[年.\-\/](\d{1,2})[月.\-\/](\d{1,2})/);
  if(m) return new Date(parseInt(m[1],10), parseInt(m[2],10) - 1, parseInt(m[3],10));
  return null;
}
function withinDigestWindow(date){
  if(!date || isNaN(date.getTime())) return false;
  const now = new Date();
  const diffDays = (now - date) / (1000 * 60 * 60 * 24);
  return diffDays >= -1 && diffDays <= DIGEST_DAYS;
}
function collectDigestItems(data, source){
  const results = [];
  const lists = Array.isArray(source.listKey) ? source.listKey : (source.listKey ? [source.listKey] : ["pages"]);
  lists.forEach(listKey => {
    const arr = data[listKey];
    if(!Array.isArray(arr)) return;
    arr.forEach(item => {
      const dateVal = item[source.dateField];
      const parsed = parseAnyDate(dateVal);
      if(!withinDigestWindow(parsed)) return;
      const title = item.title || item.name || "";
      if(!title) return;
      const snippetParts = [];
      ["desc","body"].forEach(k => { if(typeof item[k] === "string" && item[k].trim()) snippetParts.push(item[k].trim()); });
      results.push({
        title, dateVal, parsedDate: parsed,
        snippet: snippetParts.join(" ").slice(0, 80),
        sourceLabel: source.label, sourceUrl: source.url,
      });
    });
  });
  return results;
}
async function loadDigest(){
  const statusEl = document.getElementById("search-status");
  const listEl = document.getElementById("search-result-list");
  if(location.href.indexOf("file://") === 0){
    statusEl.textContent = "このページはサイト公開後(https環境)でご利用いただけます。";
    return;
  }
  let results = [];
  await Promise.all(DIGEST_SOURCES.map(async (source) => {
    try{
      const res = await fetch(source.file + "?_=" + Date.now(), { cache: "no-store" });
      if(!res.ok) return;
      const data = await res.json();
      results = results.concat(collectDigestItems(data, source));
    }catch(e){ /* データがまだ無い場合はスキップ */ }
  }));
  results.sort((a, b) => (b.parsedDate || 0) - (a.parsedDate || 0));
  if(!results.length){
    statusEl.textContent = "直近1週間の新着はまだありません。";
    listEl.innerHTML = "";
    return;
  }
  statusEl.textContent = `直近${DIGEST_DAYS}日間で${results.length}件の新着・更新がありました。`;
  listEl.innerHTML = results.map(item => `
    <a class="search-result-card" href="${escapeHtml(item.sourceUrl)}">
      <span class="search-result-source">${escapeHtml(item.sourceLabel)}・${escapeHtml(item.dateVal)}</span>
      <span class="search-result-title">${escapeHtml(item.title)}</span>
      ${item.snippet ? `<span class="search-result-snippet">${escapeHtml(item.snippet)}</span>` : ""}
    </a>`).join("");
}
loadDigest();

document.getElementById("dark-mode-toggle")?.addEventListener("click", () => {
  const isDark = document.documentElement.classList.toggle("dark-mode");
  try{ localStorage.setItem("oshi_dark_mode", isDark ? "1" : "0"); }catch(e){ /* localStorage不可の環境 */ }
});
</script>
</body>
</html>
