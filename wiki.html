<title>推しの豆知識・エピソード集</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root{
  --oshi-color: #e0233a;
  --oshi-color-deep: #b81b30;
  --oshi-color-soft: #ffe2e6;
  --accent2: #ece6e8;
  --ink: #2b2331;
  --sub-ink: #7d6b78;
  --paper: #fffaf9;
  --line: #f0dde6;
  --card: #ffffff;
  --shadow-sm: 0 2px 10px rgba(43,35,49,0.06);
  --shadow-md: 0 10px 26px rgba(43,35,49,0.12);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--oshi-color); outline-offset:2px; border-radius:4px;
}
html{ scroll-behavior:smooth; overflow-x:hidden; width:100%; }
body{ font-family:'Noto Sans JP', sans-serif; background:var(--paper); color:var(--ink); line-height:1.75; overflow-x:hidden; padding-bottom:72px; font-size:15px; }
h1,h2,h3,.brand{ font-family:'Zen Maru Gothic', sans-serif; }
a{ color:inherit; text-decoration:none; }
.wrap{ max-width:640px; margin:0 auto; padding:0 18px; }

.topnav{ position:sticky; top:0; z-index:50; background:rgba(255,250,249,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
.topnav .wrap{ display:flex; align-items:center; justify-content:space-between; height:46px; }
.back-link{ font-size:12.5px; font-weight:700; color:var(--oshi-color); }
.brand{ font-size:12px; color:var(--sub-ink); }
.nav-icon-btn{ flex:none; border:none; background:transparent; font-size:15px; cursor:pointer; padding:4px 2px; color:var(--sub-ink); line-height:1; }
.nav-icons{ display:flex; align-items:center; gap:10px; }
.nav-icon-btn:hover{ color:var(--oshi-color); }

.w-hero{ position:relative; padding:26px 0 18px; text-align:center; overflow:hidden; }
.w-hero::before{
  content:""; position:absolute; top:4px; left:50%; width:170px; height:120px; transform:translateX(-50%);
  background:radial-gradient(circle, var(--oshi-color-soft) 0%, transparent 68%);
  opacity:0.9; pointer-events:none;
}
.w-hero .eyebrow{ position:relative; display:inline-block; font-size:10px; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:999px; padding:3px 10px; margin-bottom:9px; font-weight:700; }
.w-hero h1{ position:relative; font-size:clamp(19px,6.6vw,25px); font-weight:900; }
.w-hero p{ position:relative; margin:9px auto 0; max-width:420px; font-size:12.5px; color:var(--sub-ink); }

/* 検索・カテゴリ絞り込み */
.search-wrap{ position:relative; margin-top:16px; }
.search-input{
  width:100%; border:1px solid var(--line); border-radius:999px; padding:11px 16px; font-size:13px;
  font-family:inherit; background:#fff; color:var(--ink); box-shadow:var(--shadow-sm);
}
.search-input:focus{ outline:2px solid var(--oshi-color); outline-offset:1px; }
.category-filter{ display:none; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
.category-filter.show{ display:flex; }
.tag-filter-btn{
  border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:10.5px; font-weight:700;
  padding:5px 12px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.tag-filter-btn.active{ background:var(--oshi-color); border-color:var(--oshi-color); color:#fff; }

section{ padding:26px 0 30px; }
.sec-head{ margin-bottom:16px; }
.sec-head h2{ font-size:16.5px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
.sec-head h2 .mark{ color:var(--oshi-color); font-size:14px; }
.sec-head-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.sec-head-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.view-toggle-btn{
  flex:none; border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:11px; font-weight:700;
  padding:6px 12px; border-radius:999px; cursor:pointer; font-family:inherit; margin-bottom:2px;
}
.view-toggle-btn.active{ background:var(--oshi-color); border-color:var(--oshi-color); color:#fff; }
.sec-head p{ color:var(--sub-ink); font-size:12px; margin-top:4px; }

/* 今日のピックアップ */
.daily-pick{ position:relative; display:none; margin-top:16px; text-align:left; background:linear-gradient(135deg, var(--oshi-color-soft), #fff); border:1px solid var(--oshi-color); border-radius:14px; padding:14px 50px 14px 16px; cursor:pointer; opacity:1; transition:opacity .25s ease; }
.pickup-shuffle-btn{
  position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%;
  border:1px solid var(--oshi-color); background:#fff; color:var(--oshi-color); font-size:13px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit;
}
.pickup-shuffle-btn:hover{ background:var(--oshi-color-soft); }
.pickup-shuffle-btn:active{ transform:scale(0.92); }
.pickup-shuffle-btn.spinning{ animation:shuffleSpin .5s ease; }
@keyframes shuffleSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
.daily-pick.fading{ opacity:0; }
.daily-pick.show{ display:block; }
.daily-pick-label{ font-size:10px; font-weight:700; color:var(--oshi-color); }
.daily-pick-title{ font-size:14px; font-weight:700; margin-top:4px; }
.daily-pick-body{ font-size:12.5px; color:var(--sub-ink); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.no-results{ display:none; text-align:center; color:var(--sub-ink); font-size:12.5px; padding:20px 0; }
.no-results.show{ display:block; }

/* 豆知識カード */
.wiki-list{ display:flex; flex-direction:column; gap:14px; }
.wiki-item{ position:relative; padding:16px 84px 16px 16px; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-sm); }
.wiki-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.wiki-category{ font-size:10px; font-weight:700; color:#fff; background:var(--oshi-color); border-radius:6px; padding:2px 9px; }
.wiki-source{ font-size:10px; font-weight:700; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:6px; padding:2px 9px; }
.wiki-new-badge{ font-size:10px; font-weight:700; color:#7a5c00; background:#ffd447; border-radius:6px; padding:2px 9px; }
.wiki-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.wiki-tags:empty{ display:none; margin-top:0; }
.wiki-tag{ font-size:11.5px; font-weight:700; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:999px; padding:3px 11px; border:none; cursor:pointer; font-family:inherit; }
.wiki-tag:hover{ background:var(--oshi-color); color:#fff; }
.tag-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.tag-chip{
  display:inline-flex; align-items:center; gap:5px; background:var(--oshi-color); color:#fff; font-size:11.5px;
  font-weight:700; padding:5px 8px 5px 12px; border-radius:999px;
}
.tag-chip-remove{ border:none; background:rgba(255,255,255,0.3); color:#fff; width:16px; height:16px; border-radius:50%; font-size:10px; cursor:pointer; line-height:1; }
.tag-input-row{ display:flex; gap:6px; margin-top:6px; }
.tag-input-row .qa-input{ flex:1; }
.tag-add-btn{
  flex:none; border:1px solid var(--oshi-color); background:#fff; color:var(--oshi-color); font-size:12px; font-weight:700;
  padding:0 14px; border-radius:10px; cursor:pointer; font-family:inherit;
}
.tag-add-btn:hover{ background:var(--oshi-color-soft); }
.tag-suggest-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
.tag-suggest-label{ font-size:10.5px; color:var(--sub-ink); }
.tag-suggest-btn{
  border:1px dashed var(--line); background:#fff; color:var(--sub-ink); font-size:11px; font-weight:700;
  padding:4px 10px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.tag-suggest-btn:hover{ border-color:var(--oshi-color); color:var(--oshi-color); }
.wiki-title{ font-size:16px; font-weight:900; color:var(--ink); margin-bottom:8px; line-height:1.5; }
.wiki-body{ font-size:13.5px; color:var(--sub-ink); white-space:pre-line; }
.wiki-photo{ width:100%; max-width:280px; border-radius:10px; margin-top:10px; display:block; box-shadow:var(--shadow-sm); }
.wiki-link-btn{
  display:inline-flex; align-items:center; gap:4px; margin-top:10px; border:1px solid var(--oshi-color); background:#fff;
  color:var(--oshi-color); font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px;
}
.wiki-link-btn:hover{ background:var(--oshi-color-soft); }

.load-more-btn{
  display:flex; align-items:center; justify-content:center; width:100%; margin-top:14px;
  border:1px solid var(--line); background:#fff; color:var(--oshi-color); font-weight:700; font-size:12.5px;
  padding:10px 16px; border-radius:12px; cursor:pointer; font-family:inherit; transition:background .15s ease;
}
.load-more-btn:hover{ background:var(--oshi-color-soft); }

/* 関連項目リンク */
.wiki-related{ display:none; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; }
.related-label{ font-size:11px; color:var(--sub-ink); font-weight:700; }
.related-link-btn{ border:1px solid var(--line); background:#fff; color:var(--oshi-color); font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; cursor:pointer; font-family:inherit; }
.related-link-btn:hover{ background:var(--oshi-color-soft); }
@keyframes wikiFlash{ 0%,100%{ box-shadow:var(--shadow-sm); } 30%{ box-shadow:0 0 0 4px var(--oshi-color-soft), var(--shadow-md); } }
.wiki-flash{ animation: wikiFlash 1.4s ease; }

/* 画像でシェア */
.share-image-btn{
  margin-top:10px; border:1px solid var(--line); background:#fff; color:var(--oshi-color); font-size:11px; font-weight:700;
  padding:5px 12px; border-radius:8px; cursor:pointer; font-family:inherit;
}
.share-image-btn:hover{ background:var(--oshi-color-soft); }

footer{ text-align:center; padding:30px 0 16px; color:var(--sub-ink); font-size:11px; }
.last-updated{ margin-top:8px; font-size:10.5px; color:var(--sub-ink); }
.last-updated:empty{ display:none; }

.back-to-top{
  position:fixed; right:16px; bottom:78px; z-index:90; width:42px; height:42px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--oshi-color); font-size:18px; cursor:pointer;
  box-shadow:0 6px 18px rgba(43,35,49,0.15); display:none; align-items:center; justify-content:center;
  opacity:0; transition:opacity .2s ease;
}
.back-to-top.show{ display:flex; opacity:1; }
.back-to-top:hover{ background:var(--oshi-color-soft); }

/* 編集モード */
.editable{ outline:none; }
body.editing .editable{ outline:1.5px dashed var(--oshi-color); outline-offset:2px; border-radius:4px; cursor:text; }
body.editing .editable:hover{ background:var(--oshi-color-soft); }
.edit-remove{
  display:none; position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:16px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
.edit-edit{
  display:none; position:absolute; top:8px; right:44px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:14px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
body.editing .edit-remove, body.editing .edit-edit{ display:flex; }
body.editing .edit-remove:hover, body.editing .edit-edit:hover{ background:var(--oshi-color); color:#fff; border-color:var(--oshi-color); }

.reorder-row{ display:none; gap:6px; margin-top:10px; }
body.editing .reorder-row{ display:flex; }
.reorder-btn{
  border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:10.5px; font-weight:700;
  padding:4px 10px; border-radius:8px; cursor:pointer; font-family:inherit;
}
.reorder-btn:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }

.add-row{ display:none; margin-top:12px; }
body.editing .add-row{ display:flex; }
.add-btn{
  border:1.5px dashed var(--oshi-color); color:var(--oshi-color); background:#fff; border-radius:12px;
  padding:9px 16px; font-size:12.5px; font-weight:700; cursor:pointer; width:100%; text-align:center;
  transition:background .15s ease;
}
.add-btn:hover{ background:var(--oshi-color-soft); }

.edit-toolbar{
  display:none; position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
  border-radius:999px; padding:7px 8px; box-shadow:0 8px 24px rgba(43,35,49,0.18); z-index:100;
  max-width:94vw; overflow-x:auto; scrollbar-width:none;
}
.edit-toolbar.unlocked{ display:flex; }
.edit-toolbar::-webkit-scrollbar{ display:none; }
#footer-tap-target{ cursor:default; -webkit-tap-highlight-color:transparent; user-select:none; display:inline-block; }
.tb-btn{ flex:none; border:none; border-radius:999px; padding:9px 15px; font-size:12px; font-weight:700; cursor:pointer; background:var(--paper); color:var(--ink); white-space:nowrap; transition:background .15s ease; }
.tb-btn.primary{ background:var(--oshi-color); color:#fff; }
.tb-btn.primary:hover{ background:var(--oshi-color-deep); }
.tb-btn-icon{
  flex:none; border:none; border-radius:50%; width:34px; height:34px; font-size:14px; cursor:pointer;
  background:var(--paper); color:var(--ink); display:inline-flex; align-items:center; justify-content:center;
}
.tb-btn-icon:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }

.modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(43,35,49,0.45); z-index:200; align-items:center; justify-content:center; padding:20px; }
.modal-backdrop.open{ display:flex; }
.modal{ background:#fff; border-radius:18px; padding:20px; width:100%; max-width:380px; max-height:84vh; overflow-y:auto; }
.modal h3{ font-size:15px; margin-bottom:14px; }
.qa-label{ font-size:11px; color:var(--sub-ink); margin-top:12px; margin-bottom:2px; }
.qa-label:first-child{ margin-top:0; }
.qa-input{ border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); width:100%; }
.qa-textarea{ border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); width:100%; min-height:90px; resize:vertical; }
.qa-input:focus, .qa-textarea:focus{ outline:2px solid var(--oshi-color); outline-offset:1px; }
.photo-preview{ width:100%; aspect-ratio:16/9; background-size:cover; background-position:center; border-radius:10px; margin-top:6px; border:1px solid var(--line); display:none; }
.related-select-row{ display:flex; flex-wrap:wrap; gap:6px; }
.related-select-empty{ font-size:11px; color:var(--sub-ink); }
.related-select-btn{
  border:1.5px solid var(--line); background:#fff; color:var(--sub-ink); font-size:11px; font-weight:700;
  padding:6px 12px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.related-select-btn.active{ border-color:var(--oshi-color); color:var(--oshi-color); background:var(--oshi-color-soft); }
.modal-actions{ display:flex; gap:8px; margin-top:18px; }
.modal-actions button{ flex:1; }
.modal-actions .tb-btn{ background:var(--paper); border:1px solid var(--line); }
.modal-actions .add-btn{ border-style:solid; background:var(--oshi-color); color:#fff; }
.modal-actions .add-btn:hover{ background:var(--oshi-color-deep); }

@media (max-width:480px){
  .wrap{ padding:0 14px; }
  .w-hero{ padding:20px 0 14px; }
  section{ padding:20px 0 24px; }
}

/* ---------- 印刷用レイアウト ---------- */
@media print{
  .topnav, .edit-toolbar, .back-to-top, .search-wrap, .category-filter,
  .load-more-btn, .add-row, .view-toggle-btn, .share-image-btn,
  .edit-edit, .edit-remove, .reorder-row{ display:none !important; }
  body{ padding-bottom:0; background:#fff; }
  .wiki-item{ break-inside:avoid; box-shadow:none; border:1px solid #ccc; }
  a{ text-decoration:underline; }
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="wrap">
    <a class="back-link" href="oshi-tool.html">← トップに戻る</a>
    <div class="brand">豆知識・エピソード集</div>
    <div class="nav-icons">
      <button class="nav-icon-btn" id="print-btn" type="button" aria-label="印刷用に表示" title="印刷・PDF保存">🖨️</button>
      <button class="nav-icon-btn" id="share-btn-nav" type="button" aria-label="シェアする" title="シェアする">📣</button>
    </div>
  </div>
</nav>

<header class="w-hero">
  <div class="wrap">
    <span class="eyebrow editable" id="w-eyebrow" contenteditable="false">新規さんも古参さんも</span>
    <h1 class="editable" id="w-title" contenteditable="false">推しの豆知識・エピソード集</h1>
    <p class="editable" id="w-desc" contenteditable="false">配信で話していた小ネタや、知ってるとちょっと嬉しい話をまとめています。リアルタイムで配信を追えなかった方もここでチェックできます。</p>
    <div class="daily-pick" id="daily-pick"></div>
    <div class="search-wrap">
      <input type="search" id="wiki-search" class="search-input" placeholder="🔍 気になるキーワードで検索">
    </div>
    <div class="category-filter" id="category-filter"></div>
  </div>
</header>

<section id="wiki">
  <div class="wrap">
    <div class="sec-head sec-head-row">
      <div>
        <h2><span class="mark">◆</span>まとめ一覧</h2>
      </div>
      <div class="sec-head-actions">
        <button class="view-toggle-btn" id="view-toggle" type="button">🕒 時系列で見る</button>
        <button class="view-toggle-btn" id="random-intro-btn" type="button">🎲 ランダムで表示する</button>
      </div>
    </div>
    <div class="wiki-list" id="wiki-list"></div>
    <p class="no-results" id="no-results">条件に合う項目が見つかりませんでした。</p>
    <button class="load-more-btn" id="load-more-wiki" type="button" style="display:none;">＋ もっと見る</button>
    <div class="add-row"><button class="add-btn" id="add-wiki">＋ 項目を追加</button></div>
  </div>
</section>

<footer>
  <span id="footer-tap-target">推し活は無理なく、楽しく♡</span>
  <div class="last-updated" id="last-updated"></div>
</footer>

<button class="back-to-top" id="back-to-top" type="button" aria-label="トップに戻る">↑</button>

<div class="edit-toolbar">
  <button class="tb-btn primary" id="toggle-edit">編集する</button>
  <button class="tb-btn" id="save-html" style="display:none">保存(ダウンロード)</button>
  <button class="tb-btn-icon" id="export-data" style="display:none" type="button" aria-label="データを書き出し" title="データを書き出し(JSON)">📤</button>
  <button class="tb-btn-icon" id="import-data" style="display:none" type="button" aria-label="データを読み込み" title="データを読み込み(JSON)">📥</button>
  <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;">
</div>

<div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h3 id="modal-title">追加</h3>
    <div id="modal-fields"></div>
    <div class="modal-actions">
      <button class="tb-btn" id="modal-cancel" type="button">キャンセル</button>
      <button class="add-btn" id="modal-submit" type="button">追加する</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   編集用パスワード。他のページと同じ仕組み(SHA-256ハッシュ)。

function getYouTubeId(url){
  if(!url) return null;
  try{
    const u = new URL(url);
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
    if(u.hostname.includes("youtube.com")){
      if(u.pathname === "/watch") return u.searchParams.get("v");
      const m = u.pathname.match(/\/(embed|shorts)\/([^/?]+)/);
      if(m) return m[2];
    }
  }catch(e){ /* 不正なURLは無視 */ }
  return null;
}
function isRecentlyAdded(addedAt){
  if(!addedAt) return false;
  const added = new Date(addedAt + "T00:00:00");
  if(isNaN(added.getTime())) return false;
  const diffDays = (new Date() - added) / (1000 * 60 * 60 * 24);
  return diffDays >= 0 && diffDays <= 7;
}

const WIKI_PHOTO_MAX_DIMENSION = 900;
function initWikiPhotoUpload(){
  const input = document.getElementById("f-photo-file");
  if(!input) return;
  input.addEventListener("change", () => {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, WIKI_PHOTO_MAX_DIMENSION / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        pendingWikiPhoto = canvas.toDataURL("image/jpeg", 0.82);
        const preview = document.getElementById("wiki-photo-preview");
        if(preview){ preview.style.backgroundImage = `url('${pendingWikiPhoto}')`; preview.style.display = "block"; }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- ピックアップカード(数秒ごとに自動で入れ替え) ---------- */
function hashString(s){
  let h = 0;
  for(let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
let pickupRotateTimer = null;
let pickupShownItem = null;
function renderPickupContent(picked){
  const wrap = document.getElementById("daily-pick");
  const title = picked.querySelector(".wiki-title")?.textContent || "";
  const body = picked.querySelector(".wiki-body")?.textContent || "";
  wrap.classList.add("show");
  wrap.innerHTML = `<button type="button" class="pickup-shuffle-btn" aria-label="別の話に切り替える" title="別の話に切り替える">🔀</button>
    <div class="daily-pick-label">✦ こんな話も</div>
    <div class="daily-pick-title">${escHtml(title)}</div>
    <div class="daily-pick-body">${escHtml(body)}</div>`;
  wrap.onclick = (e) => {
    const shuffleBtn = e.target.closest(".pickup-shuffle-btn");
    if(shuffleBtn){
      shuffleBtn.classList.add("spinning");
      triggerPickupShuffle();
      return;
    }
    picked.scrollIntoView({ behavior: "smooth", block: "center" });
    picked.classList.add("wiki-flash");
    setTimeout(() => picked.classList.remove("wiki-flash"), 1400);
  };
  pickupShownItem = picked;
}
function pickupNextRandom(){
  const items = Array.from(document.querySelectorAll("#wiki-list .wiki-item"));
  if(!items.length) return null;
  let candidates = items;
  if(items.length > 1 && pickupShownItem) candidates = items.filter(it => it !== pickupShownItem);
  return candidates[Math.floor(Math.random() * candidates.length)];
}
function triggerPickupShuffle(){
  const wrap = document.getElementById("daily-pick");
  const next = pickupNextRandom();
  if(!next) return;
  wrap.classList.add("fading");
  setTimeout(() => {
    renderPickupContent(next);
    wrap.classList.remove("fading");
  }, 260);
  startPickupRotation();
}
function startPickupRotation(){
  clearInterval(pickupRotateTimer);
  if(document.querySelectorAll("#wiki-list .wiki-item").length < 2) return;
  pickupRotateTimer = setInterval(() => {
    const wrap = document.getElementById("daily-pick");
    const next = pickupNextRandom();
    if(!next) return;
    wrap.classList.add("fading");
    setTimeout(() => {
      renderPickupContent(next);
      wrap.classList.remove("fading");
    }, 260);
  }, 6000);
}
function renderDailyPick(){
  const wrap = document.getElementById("daily-pick");
  const items = Array.from(document.querySelectorAll("#wiki-list .wiki-item"));
  if(!items.length){ wrap.classList.remove("show"); wrap.innerHTML = ""; clearInterval(pickupRotateTimer); return; }
  const todayKey = new Date().toISOString().slice(0, 10);
  const idx = hashString(todayKey) % items.length;
  renderPickupContent(items[idx]);
  startPickupRotation();
}

/* ---------- 関連項目リンク ---------- */
function syncRelatedBidirectional(currentTitle, oldRelatedList, newRelatedList){
  const items = Array.from(document.querySelectorAll("#wiki-list .wiki-item"));
  const findByTitle = (t) => items.find(item => item.querySelector(".wiki-title")?.textContent.trim() === t);
  const added = newRelatedList.filter(t => !oldRelatedList.includes(t));
  const removed = oldRelatedList.filter(t => !newRelatedList.includes(t));
  added.forEach(targetTitle => {
    const target = findByTitle(targetTitle);
    if(!target) return;
    const targetRelated = (target.dataset.related || "").split("|||").map(s => s.trim()).filter(Boolean);
    if(!targetRelated.includes(currentTitle)){
      targetRelated.push(currentTitle);
      target.dataset.related = targetRelated.join("|||");
    }
  });
  removed.forEach(targetTitle => {
    const target = findByTitle(targetTitle);
    if(!target) return;
    const targetRelated = (target.dataset.related || "").split("|||").map(s => s.trim()).filter(Boolean);
    const idx = targetRelated.indexOf(currentTitle);
    if(idx !== -1){
      targetRelated.splice(idx, 1);
      target.dataset.related = targetRelated.join("|||");
    }
  });
}
function renderRelatedLinks(){
  const items = Array.from(document.querySelectorAll("#wiki-list .wiki-item"));

      : "";
    if(wrap.innerHTML !== newHtml) wrap.innerHTML = newHtml;
    const wantDisplay = valid.length ? "flex" : "none";
    if(wrap.style.display !== wantDisplay) wrap.style.display = wantDisplay;

}

/* ---------- SNSシェア用の画像を作成 ---------- */
function measureWrappedLines(ctx, text, maxWidth, maxLines){
  const chars = String(text || "").split("");
  const lines = [];
  let line = "";
  for(let i = 0; i < chars.length; i++){
    const testLine = line + chars[i];
    if(ctx.measureText(testLine).width > maxWidth && line !== ""){
      lines.push(line);
      line = chars[i];
      if(maxLines && lines.length >= maxLines){ line = ""; break; }
    } else {
      line = testLine;
    }
  }
  if(line && (!maxLines || lines.length < maxLines)) lines.push(line);
  return lines;
}
function drawTextLines(ctx, lines, x, y, lineHeight){
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
  return y + lines.length * lineHeight;
}
function drawCanvasStar(ctx, cx, cy, r, color, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  for(let i = 0; i < 5; i++){
    const angle = (Math.PI * 2 * i) / 5 - Math.PI / 2;
    const angle2 = angle + Math.PI / 5;
    ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    ctx.lineTo(cx + r * 0.42 * Math.cos(angle2), cy + r * 0.42 * Math.sin(angle2));
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
async function generateShareImage(item){
  const category = item.querySelector(".wiki-category")?.textContent || "";
  const title = item.querySelector(".wiki-title")?.textContent || "";
  const body = item.querySelector(".wiki-body")?.textContent || "";
  const source = item.querySelector(".wiki-source")?.textContent || "";
  const tags = (item.dataset.tags || "").split("|||").map(s => s.trim()).filter(Boolean);

  /* フォントの読み込みを待ってから描画(未読込みだと既定フォントになるため) */
  try{
    if(document.fonts && document.fonts.load){
      await Promise.all([
        document.fonts.load("bold 46px 'Zen Maru Gothic'"),
        document.fonts.load("bold 30px 'Zen Maru Gothic'"),
        document.fonts.load("bold 26px 'Zen Maru Gothic'"),
        document.fonts.load("32px 'Noto Sans JP'"),
      ]);
    }
  }catch(e){ /* 読み込みに失敗しても既定フォントで続行 */ }

  const W = 1080;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = 1080; /* 計測用の仮サイズ(後で実サイズに変更します) */
  const ctx = canvas.getContext("2d");

  const cardX = 60, cardW = 960, radius = 36;
  const textX = cardX + 48;
  const textW = cardW - 96;

  /* ---- 内容を実際に描く前に、必要な行数・高さを計測する ---- */
  ctx.font = "bold 46px 'Zen Maru Gothic', sans-serif";
  const titleLines = measureWrappedLines(ctx, title, textW, 4);
  ctx.font = "32px 'Noto Sans JP', sans-serif";
  const bodyLines = measureWrappedLines(ctx, body, textW, 20);

  let tagRowCount = 0;
  if(tags.length){
    ctx.font = "bold 22px 'Zen Maru Gothic', sans-serif";
    let tagX = 0;
    tagRowCount = 1;
    tags.forEach(t => {
      const w = ctx.measureText(`#${t}`).width + 28;
      if(tagX + w > textW){ tagX = 0; tagRowCount++; }
      tagX += w + 10;
    });
  }

  const TITLE_LINE_H = 62, BODY_LINE_H = 48, TAG_ROW_H = 46;
  let contentH = 56; /* カード上部からバッジ開始位置までの余白 */
  contentH += (category || source) ? 90 : 16; /* バッジ分(実際の描画と同じ分岐) */
  contentH += 46; /* バッジ〜タイトル1行目までの間隔 */
  contentH += titleLines.length * TITLE_LINE_H;
  contentH += 30; /* タイトルと本文の間隔 */
  contentH += bodyLines.length * BODY_LINE_H;
  if(tagRowCount) contentH += 34 + tagRowCount * TAG_ROW_H;
  contentH += 60; /* カード下部の余白 */

  const cardY = 96;
  const cardH = Math.max(700, contentH);
  const H = cardY * 2 + cardH;
  canvas.width = W; canvas.height = H; /* 実サイズに変更(内容はリセットされるので、ここから改めて描画) */

  /* 背景グラデーション */
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, "#ffe2e6");
  bgGrad.addColorStop(0.55, "#fff7f5");
  bgGrad.addColorStop(1, "#ffffff");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  /* 背景の装飾(星・円) */
  drawCanvasStar(ctx, 950, 96, 26, "#e0233a", 0.20);
  drawCanvasStar(ctx, 108, H - 96, 20, "#e0233a", 0.18);
  drawCanvasStar(ctx, 966, H - 118, 15, "#e0233a", 0.24);
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = "#e0233a";
  ctx.beginPath(); ctx.arc(40, 40, 100, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W - 40, H - 40, 140, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  /* カード */
  ctx.save();
  ctx.shadowColor = "rgba(43,35,49,0.20)";
  ctx.shadowBlur = 44;
  ctx.shadowOffsetY = 20;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(cardX, cardY, cardW, cardH, radius); else ctx.rect(cardX, cardY, cardW, cardH);
  ctx.fill();
  ctx.restore();

  /* カード上部の推し色アクセントバー */
  ctx.save();
  ctx.fillStyle = "#e0233a";
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(cardX, cardY, cardW, 14, [radius, radius, 0, 0]); else ctx.rect(cardX, cardY, cardW, 14);
  ctx.fill();
  ctx.restore();

  /* 装飾クォートマーク(バッジ・タイトルと重ならないよう右上の隅に小さく収める) */
  ctx.save();
  ctx.font = "bold 120px Georgia, serif";
  ctx.fillStyle = "rgba(224,35,58,0.09)";
  ctx.textBaseline = "top";
  ctx.fillText("❝", cardX + cardW - 130, cardY + 28);
  ctx.textBaseline = "alphabetic";
  ctx.restore();

  let cursorY = cardY + 56;

  /* カテゴリ・情報源バッジ(横並び) */
  let badgeX = textX;
  if(category){
    ctx.font = "bold 26px 'Zen Maru Gothic', sans-serif";
    const badgeW = ctx.measureText(category).width + 56;
    ctx.fillStyle = "#ffe2e6";
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(badgeX, cursorY, badgeW, 52, 26); else ctx.rect(badgeX, cursorY, badgeW, 52);
    ctx.fill();
    ctx.fillStyle = "#b81b30";
    ctx.textBaseline = "middle";
    ctx.fillText(category, badgeX + 28, cursorY + 27);
    ctx.textBaseline = "alphabetic";
    badgeX += badgeW + 14;
  }
  if(source){
    const label = `情報源:${source}`;
    ctx.font = "bold 24px 'Zen Maru Gothic', sans-serif";
    const badgeW = ctx.measureText(label).width + 50;
    ctx.fillStyle = "#ffe2e6";
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(badgeX, cursorY, badgeW, 52, 26); else ctx.rect(badgeX, cursorY, badgeW, 52);
    ctx.fill();
    ctx.fillStyle = "#b81b30";
    ctx.textBaseline = "middle";
    ctx.fillText(label, badgeX + 25, cursorY + 27);
    ctx.textBaseline = "alphabetic";
    badgeX += badgeW + 14;
  }
  cursorY += (category || source) ? 90 : 16;

  /* タイトル */
  ctx.fillStyle = "#2b2331";
  ctx.font = "bold 46px 'Zen Maru Gothic', sans-serif";
  cursorY = drawTextLines(ctx, titleLines, textX, cursorY + 46, TITLE_LINE_H);

  /* 本文 */
  cursorY += 30;
  ctx.fillStyle = "#5a4b56";
  ctx.font = "32px 'Noto Sans JP', sans-serif";
  cursorY = drawTextLines(ctx, bodyLines, textX, cursorY, BODY_LINE_H);

  /* タグ */
  if(tags.length){
    cursorY += 34;
    ctx.font = "bold 22px 'Zen Maru Gothic', sans-serif";
    let tagX = textX;
    const rightLimit = textX + textW;
    tags.forEach(t => {
      const label = `#${t}`;
      const w = ctx.measureText(label).width + 28;
      if(tagX + w > rightLimit){ tagX = textX; cursorY += TAG_ROW_H; }
      ctx.fillStyle = "#ffe2e6";
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(tagX, cursorY, w, 36, 18); else ctx.rect(tagX, cursorY, w, 36);
      ctx.fill();
      ctx.fillStyle = "#b81b30";
      ctx.textBaseline = "middle";
      ctx.fillText(label, tagX + 14, cursorY + 19);
      ctx.textBaseline = "alphabetic";
      tagX += w + 10;
    });
  }

  const link = document.createElement("a");
  link.download = "wiki-share-" + Date.now() + ".png";
  link.href = canvas.toDataURL("image/png");
  document.body.appendChild(link);
  link.click();
  link.remove();
}

      addedAt: card.dataset.added || "",

    });

document.addEventListener("click", (e) => {
  if(e.target.closest(".edit-edit")){
    const card = e.target.closest(".wiki-item");
    if(card) openEditModal(card);
    return;
  }
  if(e.target.classList.contains("edit-remove")){
    const card = e.target.closest(".wiki-item");
    if(card){
      const title = card.querySelector(".wiki-title")?.textContent.trim() || "";
      card.remove();
      if(title){
        document.querySelectorAll("#wiki-list .wiki-item").forEach(item => {
          const list = (item.dataset.related || "").split("|||").map(s => s.trim()).filter(Boolean);
          const idx = list.indexOf(title);
          if(idx !== -1){
            list.splice(idx, 1);
            item.dataset.related = list.join("|||");
          }
        });
        renderRelatedLinks();
      }
    }
    return;
  }
  const upBtn = e.target.closest(".move-up");
  const downBtn = e.target.closest(".move-down");
  if(upBtn || downBtn){
    const card = e.target.closest(".wiki-item");
    if(card && card.parentElement){
      const swapOrder = (a, b) => { const t = a.dataset.order; a.dataset.order = b.dataset.order; b.dataset.order = t; };
      if(upBtn && card.previousElementSibling){
        swapOrder(card, card.previousElementSibling);
        card.parentElement.insertBefore(card, card.previousElementSibling);
      }
      if(downBtn && card.nextElementSibling){
        swapOrder(card, card.nextElementSibling);
        card.parentElement.insertBefore(card.nextElementSibling, card);
      }
      hasUnsavedChanges = true;
    }
  }
});

function extractWikiData(){

function rebuildWikiFromData(data){
  if(data.eyebrow !== undefined) document.getElementById("w-eyebrow").textContent = data.eyebrow;
  if(data.title !== undefined) document.getElementById("w-title").textContent = data.title;
  if(data.desc !== undefined) document.getElementById("w-desc").textContent = data.desc;
  if(data.items){
    document.getElementById("wiki-list").innerHTML = data.items.map(wikiItemHTML).join("");
    const maxOrder = Math.max(-1, ...data.items.map(it => parseInt(it.order, 10)).filter(n => !isNaN(n)));
    wikiOrderCounter = Math.max(wikiOrderCounter, maxOrder + 1);
  }

  renderRelatedLinks();
  renderDailyPick();
  hasUnsavedChanges = true;
}
document.getElementById("export-data").addEventListener("click", () => {
  const json = JSON.stringify(extractWikiData(), null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "wiki-data.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});
document.getElementById("import-data").addEventListener("click", () => {
  document.getElementById("import-file-input").click();
});
document.getElementById("import-file-input").addEventListener("change", (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  if(!confirm("現在の内容を、選んだファイルの内容で上書きします。よろしいですか?")) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      rebuildWikiFromData(data);
      alert("データを読み込みました。内容を確認して「保存(ダウンロード)」してください。");
    }catch(err){
      alert("ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。");
    }
  };
  reader.readAsText(file);
});

/* 編集モード中は、項目のリンクをタップしても遷移させない */
document.addEventListener("click", (e) => {
  if(!document.body.classList.contains("editing")) return;
  const link = e.target.closest("a.wiki-link-btn");
  if(link) e.preventDefault();
});

/* タップ数の計測(GA4イベント) */
document.addEventListener("click", (e) => {
  const link = e.target.closest("a[href]");
  if(!link) return;
  if(typeof gtag === "function"){
    const label = (link.textContent || "").trim().slice(0, 60) || link.getAttribute("href");
    gtag("event", "tap", { event_category: "link", event_label: label });
  }
});

/* 保存(編集内容を反映した新しいHTMLファイルをダウンロード) */
saveBtn.addEventListener("click", () => {
  exitEditMode();
  closeModal();
  syncOgpTags();
  const luEl = document.getElementById("last-updated");
  if(luEl){
    const d = new Date();
    luEl.textContent = `最終更新:${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  }
  const htmlOut = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([htmlOut], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "wiki-edited.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  hasUnsavedChanges = false;
});

/* ---------- 同じ場所にある wiki-data.json があれば自動で読み込む ----------
   ・https(またはローカルサーバー)環境でのみ動作します(file:// では読み込めません)
   ・見つかった場合は、そちらの内容でページを上書きします
   ・見つからない/読み込めない場合は、何も起きず今の内容のまま表示されます */
(async function loadExternalDataIfAvailable(){
  try{
    const res = await fetch("wiki-data.json", { cache: "no-store" });
    if(!res.ok) return;
    const data = await res.json();
    rebuildWikiFromData(data);
    hasUnsavedChanges = false;
  }catch(e){
    /* file:// で開いている場合や、ファイルが存在しない場合はここに来ます。何もしません */
  }
})();
