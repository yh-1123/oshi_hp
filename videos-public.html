<title>動画まとめ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root{
  --oshi-color: #e0233a;
  --oshi-color-deep: #b81b30;
  --oshi-color-soft: #ffe2e6;
  --accent2: #ece6e8;
  --ink: #2b2331;
  --sub-ink: #7d6b78;
  --paper: #fffaf9;
  --line: #f0dde6;
  --card: #ffffff;
  --shadow-sm: 0 2px 10px rgba(43,35,49,0.06);
  --shadow-md: 0 10px 26px rgba(43,35,49,0.12);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--oshi-color); outline-offset:2px; border-radius:4px;
}
html{ scroll-behavior:smooth; }
body{ font-family:'Noto Sans JP', sans-serif; background:var(--paper); color:var(--ink); line-height:1.75; overflow-x:hidden; padding-bottom:72px; font-size:15px; }
h1,h2,h3,.brand{ font-family:'Zen Maru Gothic', sans-serif; }
a{ color:inherit; text-decoration:none; }
.wrap{ max-width:640px; margin:0 auto; padding:0 18px; }

.topnav{ position:sticky; top:0; z-index:50; background:rgba(255,250,249,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
.topnav .wrap{ display:flex; align-items:center; justify-content:space-between; height:46px; }
.back-link{ font-size:12.5px; font-weight:700; color:var(--oshi-color); }
.back-link-edit{ display:none; border:none; background:transparent; color:var(--sub-ink); font-size:11px; cursor:pointer; padding:2px 4px; vertical-align:middle; }
body.editing .back-link-edit{ display:inline-block; }
.back-link-edit:hover{ color:var(--oshi-color); }
.brand{ font-size:12px; color:var(--sub-ink); }
.nav-icons{ display:flex; align-items:center; gap:10px; }
.nav-icon-btn{ flex:none; border:none; background:transparent; font-size:15px; cursor:pointer; padding:4px 2px; color:var(--sub-ink); line-height:1; }
.nav-icon-btn:hover{ color:var(--oshi-color); }

.p-hero{ position:relative; padding:26px 0 18px; text-align:center; overflow:hidden; }
.p-hero::before{
  content:""; position:absolute; top:4px; left:50%; width:170px; height:120px; transform:translateX(-50%);
  background:radial-gradient(circle, var(--oshi-color-soft) 0%, transparent 68%);
  opacity:0.9; pointer-events:none;
}
.p-hero .eyebrow{ position:relative; display:inline-block; font-size:10px; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:999px; padding:3px 10px; margin-bottom:9px; font-weight:700; }
.p-hero h1{ position:relative; font-size:clamp(19px,6.6vw,25px); font-weight:900; }
.p-hero p{ position:relative; margin:9px auto 0; max-width:420px; font-size:12.5px; color:var(--sub-ink); }

.daily-pick{ display:none; margin-top:16px; text-align:left; cursor:pointer; }
.daily-pick.show{ display:flex; gap:10px; background:linear-gradient(135deg, var(--oshi-color-soft), #fff); border:1px solid var(--oshi-color); border-radius:14px; padding:10px; }
.daily-pick-thumb{ flex:0 0 96px; aspect-ratio:16/9; border-radius:8px; overflow:hidden; background:var(--accent2); }
.daily-pick-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.daily-pick-body{ flex:1; min-width:0; }
.daily-pick-label{ font-size:10px; font-weight:700; color:var(--oshi-color); }
.daily-pick-title{ font-size:12.5px; font-weight:700; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.daily-pick-desc{ font-size:11px; color:var(--sub-ink); margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

.search-wrap{ position:relative; margin-top:16px; }
.search-input{
  width:100%; border:1px solid var(--line); border-radius:999px; padding:11px 16px; font-size:13px;
  font-family:inherit; background:#fff; color:var(--ink); box-shadow:var(--shadow-sm);
}
.search-input:focus{ outline:2px solid var(--oshi-color); outline-offset:1px; }
.category-filter{ display:none; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
.category-filter.show{ display:flex; }
.tag-filter-btn{
  border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:10.5px; font-weight:700;
  padding:5px 12px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.tag-filter-btn.active{ background:var(--oshi-color); border-color:var(--oshi-color); color:#fff; }

section{ padding:20px 0 30px; }
.sec-head{ margin-bottom:16px; }
.sec-head-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.sec-head h2{ font-size:16.5px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
.sec-head h2 .mark{ color:var(--oshi-color); font-size:14px; }
.sec-head p{ color:var(--sub-ink); font-size:12px; margin-top:4px; }
.no-results{ display:none; text-align:center; color:var(--sub-ink); font-size:12.5px; padding:20px 0; }
.no-results.show{ display:block; }

/* 動画カード */
.video-list{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
@media (max-width:380px){ .video-list{ grid-template-columns:1fr; } }
.video-item{ position:relative; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow-sm); }
.video-thumb-link{ display:block; width:100%; position:relative; aspect-ratio:16/9; background:linear-gradient(135deg, var(--oshi-color-soft), var(--accent2)); border:none; padding:0; cursor:pointer; font-family:inherit; }
.video-thumb-link img{ width:100%; height:100%; object-fit:cover; display:block; }
.video-play-badge{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:30px; height:30px; border-radius:50%;
  background:rgba(20,20,20,0.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px;
  pointer-events:none;
}
.video-body{ padding:10px; }
.video-meta{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:5px; }
.video-category{ font-size:9px; font-weight:700; color:#fff; background:var(--oshi-color); border-radius:5px; padding:1px 7px; }
.video-date{ font-size:9px; font-weight:700; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:5px; padding:1px 7px; }
.video-new-badge{ font-size:9px; font-weight:700; color:#7a5c00; background:#ffd447; border-radius:5px; padding:1px 7px; }
.video-tags{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.video-tags:empty{ display:none; margin-top:0; }
.video-tag{ font-size:9.5px; font-weight:700; color:var(--oshi-color); background:var(--oshi-color-soft); border-radius:999px; padding:2px 8px; border:none; cursor:pointer; font-family:inherit; }
.video-tag:hover{ background:var(--oshi-color); color:#fff; }
.tag-chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
.tag-chip{
  display:inline-flex; align-items:center; gap:5px; background:var(--oshi-color); color:#fff; font-size:11.5px;
  font-weight:700; padding:5px 8px 5px 12px; border-radius:999px;
}
.tag-chip-remove{ border:none; background:rgba(255,255,255,0.3); color:#fff; width:16px; height:16px; border-radius:50%; font-size:10px; cursor:pointer; line-height:1; }
.tag-input-row{ display:flex; gap:6px; margin-top:6px; }
.tag-input-row .qa-input{ flex:1; }
.tag-add-btn{
  flex:none; border:1px solid var(--oshi-color); background:#fff; color:var(--oshi-color); font-size:12px; font-weight:700;
  padding:0 14px; border-radius:10px; cursor:pointer; font-family:inherit;
}
.tag-add-btn:hover{ background:var(--oshi-color-soft); }
.tag-suggest-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
.tag-suggest-label{ font-size:10.5px; color:var(--sub-ink); }
.tag-suggest-btn{
  border:1px dashed var(--line); background:#fff; color:var(--sub-ink); font-size:11px; font-weight:700;
  padding:4px 10px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.tag-suggest-btn:hover{ border-color:var(--oshi-color); color:var(--oshi-color); }
.video-title{ font-size:12.5px; font-weight:700; margin-bottom:3px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.video-desc{ font-size:11px; color:var(--sub-ink); white-space:pre-line; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.video-recommend{
  margin-top:6px; background:#fffaf0; border:1px dashed #e0a800; border-radius:8px; padding:6px 8px;
  font-size:10.5px; color:#7a5c00;
}
.video-recommend-mark{ display:block; font-size:9px; font-weight:700; color:#c98a00; margin-bottom:2px; }
.video-watch-btn{
  display:inline-flex; align-items:center; gap:3px; margin-top:8px; border:1px solid var(--oshi-color); background:#fff;
  color:var(--oshi-color); font-size:10px; font-weight:700; padding:4px 10px; border-radius:999px; font-family:inherit; cursor:pointer;
}
.video-watch-btn:hover{ background:var(--oshi-color-soft); }
.video-related{ display:none; flex-wrap:wrap; gap:5px; align-items:center; margin-top:8px; }
.related-label{ font-size:10px; color:var(--sub-ink); font-weight:700; }
.related-link-btn{ border:1px solid var(--line); background:#fff; color:var(--oshi-color); font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; cursor:pointer; font-family:inherit; }
.related-link-btn:hover{ background:var(--oshi-color-soft); }
.related-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.related-chip{
  display:inline-flex; align-items:center; gap:5px; background:var(--oshi-color); color:#fff; font-size:11.5px;
  font-weight:700; padding:5px 8px 5px 12px; border-radius:999px;
}
.related-chip-remove{ border:none; background:rgba(255,255,255,0.3); color:#fff; width:16px; height:16px; border-radius:50%; font-size:10px; cursor:pointer; line-height:1; }
.related-input-row{ display:flex; gap:6px; margin-top:6px; }
.related-input-row .qa-input{ flex:1; }
.related-add-btn{
  flex:none; border:1px solid var(--oshi-color); background:#fff; color:var(--oshi-color); font-size:12px; font-weight:700;
  padding:0 14px; border-radius:10px; cursor:pointer; font-family:inherit;
}
.related-add-btn:hover{ background:var(--oshi-color-soft); }
.related-suggest-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
.related-suggest-label{ font-size:10.5px; color:var(--sub-ink); }
.related-suggest-btn{
  border:1px dashed var(--line); background:#fff; color:var(--sub-ink); font-size:11px; font-weight:700;
  padding:4px 10px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.related-suggest-btn:hover{ border-color:var(--oshi-color); color:var(--oshi-color); }
@keyframes videoFlash{ 0%,100%{ box-shadow:var(--shadow-sm); } 30%{ box-shadow:0 0 0 4px var(--oshi-color-soft), var(--shadow-md); } }
.video-flash{ animation: videoFlash 1.4s ease; }

.load-more-btn{
  display:flex; align-items:center; justify-content:center; width:100%; margin-top:14px;
  border:1px solid var(--line); background:#fff; color:var(--oshi-color); font-weight:700; font-size:12.5px;
  padding:10px 16px; border-radius:12px; cursor:pointer; font-family:inherit;
}
.load-more-btn:hover{ background:var(--oshi-color-soft); }

footer{ text-align:center; padding:30px 0 16px; color:var(--sub-ink); font-size:11px; }
.last-updated{ margin-top:8px; font-size:10.5px; color:var(--sub-ink); }
.last-updated:empty{ display:none; }

.back-to-top{
  position:fixed; right:16px; bottom:78px; z-index:90; width:42px; height:42px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--oshi-color); font-size:18px; cursor:pointer;
  box-shadow:0 6px 18px rgba(43,35,49,0.15); display:none; align-items:center; justify-content:center;
  opacity:0; transition:opacity .2s ease;
}
.back-to-top.show{ display:flex; opacity:1; }
.back-to-top:hover{ background:var(--oshi-color-soft); }

/* 編集用の共通パーツ */
.editable{ outline:none; }
body.editing .editable{ outline:1.5px dashed var(--oshi-color); outline-offset:2px; border-radius:4px; cursor:text; }
body.editing .editable:hover{ background:var(--oshi-color-soft); }
.edit-remove{
  display:none; position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:16px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
.edit-edit{
  display:none; position:absolute; top:8px; right:44px; width:32px; height:32px; border-radius:50%;
  background:#fff; border:1px solid var(--line); color:var(--sub-ink); font-size:14px; line-height:1;
  cursor:pointer; align-items:center; justify-content:center; z-index:5;
}
body.editing .edit-remove, body.editing .edit-edit{ display:flex; }
body.editing .edit-remove:hover, body.editing .edit-edit:hover{ background:var(--oshi-color); color:#fff; border-color:var(--oshi-color); }

.reorder-row{ display:none; gap:6px; margin-top:8px; }
body.editing .reorder-row{ display:flex; }
.reorder-btn{
  border:1px solid var(--line); background:#fff; color:var(--sub-ink); font-size:10.5px; font-weight:700;
  padding:4px 10px; border-radius:8px; cursor:pointer; font-family:inherit;
}
.reorder-btn:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }

.add-row{ display:none; margin-top:12px; }
body.editing .add-row{ display:flex; }
.add-btn{
  border:1.5px dashed var(--oshi-color); color:var(--oshi-color); background:#fff; border-radius:12px;
  padding:9px 16px; font-size:12.5px; font-weight:700; cursor:pointer; width:100%; text-align:center;
  transition:background .15s ease;
}
.add-btn:hover{ background:var(--oshi-color-soft); }

.edit-toolbar{
  display:none; position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
  border-radius:999px; padding:7px 8px; box-shadow:0 8px 24px rgba(43,35,49,0.18); z-index:100;
  max-width:94vw; overflow-x:auto; scrollbar-width:none;
}
.edit-toolbar.unlocked{ display:flex; }
.edit-toolbar::-webkit-scrollbar{ display:none; }
#footer-tap-target{ cursor:default; -webkit-tap-highlight-color:transparent; user-select:none; display:inline-block; }
.tb-btn{ flex:none; border:none; border-radius:999px; padding:9px 15px; font-size:12px; font-weight:700; cursor:pointer; background:var(--paper); color:var(--ink); white-space:nowrap; transition:background .15s ease; }
.tb-btn.primary{ background:var(--oshi-color); color:#fff; }
.tb-btn.primary:hover{ background:var(--oshi-color-deep); }
.tb-btn-icon{
  flex:none; border:none; border-radius:50%; width:34px; height:34px; font-size:14px; cursor:pointer;
  background:var(--paper); color:var(--ink); display:inline-flex; align-items:center; justify-content:center;
}
.tb-btn-icon:hover{ background:var(--oshi-color-soft); color:var(--oshi-color); }

.modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(43,35,49,0.45); z-index:200; align-items:center; justify-content:center; padding:20px; }
.modal-backdrop.open{ display:flex; }
.modal{ background:#fff; border-radius:18px; padding:20px; width:100%; max-width:380px; max-height:84vh; overflow-y:auto; }
.modal h3{ font-size:15px; margin-bottom:14px; }
.qa-label{ font-size:11px; color:var(--sub-ink); margin-top:12px; margin-bottom:6px; }
.qa-label:first-child{ margin-top:0; }
.qa-input{ border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); width:100%; }
.qa-textarea{ border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); width:100%; min-height:80px; resize:vertical; }
.qa-input:focus, .qa-textarea:focus{ outline:2px solid var(--oshi-color); outline-offset:1px; }
.modal-actions{ display:flex; gap:8px; margin-top:18px; }
.modal-actions button{ flex:1; }
.modal-actions .tb-btn{ background:var(--paper); border:1px solid var(--line); }
.modal-actions .add-btn{ border-style:solid; background:var(--oshi-color); color:#fff; }
.modal-actions .add-btn:hover{ background:var(--oshi-color-deep); }

/* ---------- 動画プレイヤー(タップでその場で再生) ---------- */
.video-player-backdrop{ display:none; position:fixed; inset:0; background:rgba(20,15,18,0.92); z-index:250; align-items:center; justify-content:center; padding:16px; }
.video-player-backdrop.open{ display:flex; }
.video-player-box{ width:100%; max-width:640px; position:relative; }
.video-player-frame{ position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; box-shadow:var(--shadow-md); }
.video-player-frame iframe{ width:100%; height:100%; border:0; display:block; }
.video-player-close{
  position:absolute; top:-46px; right:0; width:36px; height:36px; border-radius:50%; border:none;
  background:rgba(255,255,255,0.15); color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.video-player-close:hover{ background:rgba(255,255,255,0.3); }

.up-next{ display:none; margin-top:14px; }
.up-next.show{ display:block; }
.up-next-label{ color:#fff; font-size:12px; font-weight:700; margin-bottom:8px; }
.up-next-track{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; scroll-snap-type:x mandatory; }
.up-next-track::-webkit-scrollbar{ display:none; }
.up-next-card{
  flex:0 0 130px; border:none; background:none; padding:0; cursor:pointer; text-align:left; font-family:inherit;
  scroll-snap-align:start;
}
.up-next-card img{ width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:8px; display:block; background:var(--accent2); }
.up-next-card span{ display:block; margin-top:4px; font-size:10.5px; color:#fff; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.up-next-card:hover img{ opacity:0.85; }

@media (max-width:480px){
  .wrap{ padding:0 14px; }
  .p-hero{ padding:20px 0 14px; }
  section{ padding:16px 0 26px; }
}

/* ---------- 印刷用レイアウト ---------- */
@media print{
  .topnav, .edit-toolbar, .back-to-top, .search-wrap, .category-filter, .daily-pick,
  .load-more-btn, .add-row, .edit-edit, .edit-remove, .reorder-row, .video-player-backdrop{ display:none !important; }
  body{ padding-bottom:0; background:#fff; }
  .video-item{ break-inside:avoid; box-shadow:none; border:1px solid #ccc; }
  a{ text-decoration:underline; }
}
</style>

function esc(s){ return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function isRecentlyAdded(addedAt){
  if(!addedAt) return false;
  const added = new Date(addedAt + "T00:00:00");
  if(isNaN(added.getTime())) return false;
  const diffDays = (new Date() - added) / (1000 * 60 * 60 * 24);
  return diffDays >= 0 && diffDays <= 7;
}
function formatDate(iso){
  if(!iso) return "";
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return iso;
  return `${m[1]}.${m[2]}.${m[3]}`;
}
function parseFlexibleDate(input){
  const raw = String(input || "").trim();
  if(!raw) return "";
  /* 全角数字・全角の区切り記号を半角に変換 */
  const s = raw
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．]/g, ".")
    .replace(/[／]/g, "/")
    .replace(/[－ー―]/g, "-");
  /* 前後に余分な文字が残っていても、日付らしき並びを拾えるよう部分一致で探す */
  let m = s.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?/);
  if(!m) m = s.match(/(\d{4})[\-\/\.](\d{1,2})[\-\/\.](\d{1,2})/);
  if(!m) m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(!m) return raw; /* 解釈できない場合は入力をそのまま返す(データを消さない) */
  const y = m[1];
  const mo = String(parseInt(m[2], 10)).padStart(2, "0");
  const d = String(parseInt(m[3], 10)).padStart(2, "0");
  const check = new Date(`${y}-${mo}-${d}T00:00:00`);
  if(isNaN(check.getTime())) return raw;
  return `${y}-${mo}-${d}`;
}
function getYouTubeId(url){
  if(!url) return null;
  try{
    const u = new URL(url);
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
    if(u.hostname.includes("youtube.com")){
      if(u.pathname === "/watch") return u.searchParams.get("v");
      const m = u.pathname.match(/\/(embed|shorts)\/([^/?]+)/);
      if(m) return m[2];
    }
  }catch(e){ /* 不正なURLは無視 */ }
  return null;
}

  const order = (v.order !== undefined && v.order !== "") ? v.order : videoOrderCounter++;
  const relatedRaw = Array.isArray(v.related) ? v.related.join("|||") : (v.related || "");

      ${watchBtn}

    ${REORDER_ROW}

let currentCategoryFilter = "all";

const VIDEO_INITIAL_VISIBLE = 6;
function currentSearchQuery(){
  const el = document.getElementById("video-search");
  return el ? el.value.trim().toLowerCase() : "";
}
function applyVideoFilter(){
  const q = currentSearchQuery();
  const allItems = Array.from(document.querySelectorAll("#video-list .video-item"));
  const matched = allItems.filter(item => {
    const categoryOk = (currentCategoryFilter === "all" || item.dataset.category === currentCategoryFilter);
    const searchOk = !q || item.textContent.toLowerCase().includes(q);
    return categoryOk && searchOk;
  });
  const isNarrowed = currentCategoryFilter !== "all" || !!q;
  const limitActive = !showAllItems && !isNarrowed && matched.length > VIDEO_INITIAL_VISIBLE;
  allItems.forEach(item => { item.style.display = "none"; });
  matched.forEach((item, i) => {
    if(limitActive && i >= VIDEO_INITIAL_VISIBLE) return;
    item.style.display = "";
  });
  document.getElementById("no-results").classList.toggle("show", matched.length === 0 && allItems.length > 0);
  const loadMoreBtn = document.getElementById("load-more-videos");
  if(limitActive){
    loadMoreBtn.style.display = "flex";
    loadMoreBtn.textContent = `＋ もっと見る(残り${matched.length - VIDEO_INITIAL_VISIBLE}件)`;
  } else {
    loadMoreBtn.style.display = "none";
  }
}
document.getElementById("load-more-videos").addEventListener("click", () => { showAllItems = true; applyVideoFilter(); });
function renderCategoryFilter(){
  const wrap = document.getElementById("category-filter");

  if(cats.length < 2){
    wrap.classList.remove("show");
    wrap.innerHTML = "";
    currentCategoryFilter = "all";
    applyVideoFilter();

  }
  const current = cats.includes(currentCategoryFilter) ? currentCategoryFilter : "all";
  currentCategoryFilter = current;

  wrap.innerHTML = [`<button type="button" class="tag-filter-btn${current === "all" ? " active" : ""}" data-cat="all">すべて</button>`]
    .concat(cats.map(c => `<button type="button" class="tag-filter-btn${current === c ? " active" : ""}" data-cat="${escAttr(c)}">${c}</button>`))
    .join("");

}

function sortVideosByDate(){

  items.sort((a, b) => {
    const da = a.dataset.date || "0000-00-00";
    const db = b.dataset.date || "0000-00-00";
    if(da !== db) return db.localeCompare(da);
    return (parseInt(a.dataset.order || "0", 10) - parseInt(b.dataset.order || "0", 10));
  });
  items.forEach(item => list.appendChild(item));
  applyVideoFilter();
}

}

let ytApiPromise = null;
function loadYouTubeAPI(){
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve) => {
    if(window.YT && window.YT.Player){ resolve(); return; }
    const prevCallback = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if(typeof prevCallback === "function") prevCallback(); resolve(); };
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  });
  return ytApiPromise;
}
let ytPlayer = null;
let currentPlayerSourceItem = null;
let currentPlayingYtId = null;
let lastUpNextList = [];
function buildUpNextEntry(el){
  return {
    ytId: getYouTubeId(el.dataset.url),
    title: el.querySelector(".video-title")?.textContent.trim() || "",
    thumb: el.querySelector(".video-thumb-link img")?.getAttribute("src") || "",
    item: el,
  };
}
function getUpNextList(afterItem){
  const allItems = Array.from(document.querySelectorAll("#video-list .video-item"));
  const relatedTitles = (afterItem.dataset.related || "").split("|||").map(s => s.trim()).filter(Boolean);
  if(relatedTitles.length){
    const byTitle = new Map();
    allItems.forEach(el => {
      const t = el.querySelector(".video-title")?.textContent.trim();
      if(t && !byTitle.has(t)) byTitle.set(t, el);
    });
    const manual = relatedTitles
      .map(t => byTitle.get(t))
      .filter(el => el && el !== afterItem)
      .map(buildUpNextEntry)
      .filter(v => v.ytId);
    if(manual.length) return manual;
  }
  const visible = allItems.filter(el => el.style.display !== "none");
  const idx = visible.indexOf(afterItem);
  if(idx === -1) return [];
  return visible.slice(idx + 1, idx + 6).map(buildUpNextEntry).filter(v => v.ytId);
}
function renderUpNext(afterItem){
  const wrap = document.getElementById("video-up-next");
  const list = getUpNextList(afterItem);
  lastUpNextList = list;
  if(!list.length){ wrap.classList.remove("show"); wrap.innerHTML = ""; return; }
  wrap.innerHTML = `<div class="up-next-label">▶ 次の動画</div><div class="up-next-track">${list.map((v, i) => `<button type="button" class="up-next-card" data-idx="${i}"><img src="${v.thumb}" alt="">${esc(v.title) ? `<span>${esc(v.title)}</span>` : ""}</button>`).join("")}</div>`;
  wrap.classList.add("show");
}
function watchDirectly(ytId){
  window.open(`https://www.youtube.com/watch?v=${ytId}`, "_blank", "noopener");
}
async function openVideoPlayer(ytId, sourceItem){
  if(location.protocol === "file:"){
    /* file://で開いている場合、埋め込み再生の仕組みが動作しないためYouTubeを直接開く */
    watchDirectly(ytId);
    return;
  }
  currentPlayerSourceItem = sourceItem;
  currentPlayingYtId = ytId;
  document.getElementById("video-player-backdrop").classList.add("open");
  document.getElementById("video-up-next").classList.remove("show");
  document.getElementById("video-up-next").innerHTML = "";
  await loadYouTubeAPI();
  if(ytPlayer && typeof ytPlayer.loadVideoById === "function"){
    ytPlayer.loadVideoById(ytId);
  } else {
    document.getElementById("video-player-frame").innerHTML = '<div id="yt-player-el"></div>';
    ytPlayer = new YT.Player("yt-player-el", {
      videoId: ytId,
      playerVars: { autoplay: 1, rel: 0, origin: location.origin },
      events: {
        onStateChange: (e) => {
          if(e.data === YT.PlayerState.ENDED) renderUpNext(currentPlayerSourceItem);
        },
        onError: () => {
          closeVideoPlayer();
          alert("この動画は埋め込み再生ができないようです。YouTubeで直接開きます。");
          watchDirectly(currentPlayingYtId);
        },
      },
    });
  }
}
function closeVideoPlayer(){
  document.getElementById("video-player-backdrop").classList.remove("open");
  document.getElementById("video-up-next").classList.remove("show");
  if(ytPlayer && typeof ytPlayer.stopVideo === "function") ytPlayer.stopVideo();
}
document.getElementById("video-player-close").addEventListener("click", closeVideoPlayer);
document.getElementById("video-player-backdrop").addEventListener("click", (e) => {
  if(e.target.id === "video-player-backdrop") closeVideoPlayer();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && document.getElementById("video-player-backdrop").classList.contains("open")) closeVideoPlayer();
});
document.getElementById("video-list").addEventListener("click", (e) => {
  if(document.body.classList.contains("editing")) return;
  const trigger = e.target.closest("[data-yt-id]");
  if(!trigger) return;
  e.preventDefault();
  const item = trigger.closest(".video-item");
  openVideoPlayer(trigger.dataset.ytId, item);
});
document.getElementById("video-list").addEventListener("click", (e) => {
  const tagBtn = e.target.closest(".video-tag");
  if(!tagBtn) return;
  currentCategoryFilter = "all";
  showAllItems = false;
  document.querySelectorAll("#category-filter .tag-filter-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === "all"));
  const searchInput = document.getElementById("video-search");
  searchInput.value = tagBtn.dataset.tag;
  applyVideoFilter();
  searchInput.scrollIntoView({ behavior: "smooth", block: "center" });
});
document.getElementById("video-up-next").addEventListener("click", (e) => {
  const card = e.target.closest(".up-next-card");
  if(!card) return;
  const entry = lastUpNextList[parseInt(card.dataset.idx, 10)];
  if(!entry) return;
  openVideoPlayer(entry.ytId, entry.item);
});

/* ---------- データのエクスポート・インポート(JSON) ---------- */

function rebuildFromData(data){
  if(data.navBrand !== undefined) document.getElementById("nav-brand").textContent = data.navBrand;
  if(data.eyebrow !== undefined) document.getElementById("p-eyebrow").textContent = data.eyebrow;
  if(data.title !== undefined) document.getElementById("p-title").textContent = data.title;
  if(data.desc !== undefined) document.getElementById("p-desc").textContent = data.desc;
  if(data.backLinkUrl){
    const link = document.querySelector(".back-link");
    if(link){ link.setAttribute("href", data.backLinkUrl); link.dataset.url = data.backLinkUrl; }
  }
  if(data.items){
    document.getElementById("video-list").innerHTML = data.items.map(videoItemHTML).join("");
    const maxOrder = Math.max(-1, ...data.items.map(it => parseInt(it.order, 10)).filter(n => !isNaN(n)));
    videoOrderCounter = Math.max(videoOrderCounter, maxOrder + 1);
    sortVideosByDate();
  }
  setEditable(editMode);
  syncOgpTags();
  renderCategoryFilter();
  renderDailyPick();
  renderRelatedLinks();
  hasUnsavedChanges = true;
}


/* タップ数の計測(GA4イベント) */
document.addEventListener("click", (e) => {
  const link = e.target.closest("a[href]");
  if(!link) return;
  if(typeof gtag === "function"){
    const label = (link.textContent || "").trim().slice(0, 60) || link.getAttribute("href");
    gtag("event", "tap", { event_category: "link", event_label: label });
  }
});

/* 公開用HTML(編集機能を削除した閲覧専用版)を書き出す */


/* ---------- 同じ場所にある videos-data.json があれば自動で読み込む ----------
   ・https(またはローカルサーバー)環境でのみ動作します(file:// では読み込めません)
   ・見つかった場合は、そちらの内容でページを上書きします
   ・見つからない/読み込めない場合は、何も起きず今の内容のまま表示されます */
(async function loadExternalDataIfAvailable(){
  try{
    const res = await fetch("videos-data.json", { cache: "no-store" });
    if(!res.ok) return;
    const data = await res.json();
    rebuildFromData(data);
    hasUnsavedChanges = false;
  }catch(e){
    /* file:// で開いている場合や、ファイルが存在しない場合はここに来ます。何もしません */
  }
})();
