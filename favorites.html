<script>
/* ---------- サイト全体のお知らせバナー(index.htmlで編集・書き出し) ---------- */
function renderSiteBanner(data){
  const banner = document.getElementById("site-banner");
  if(!banner) return;
  if(!data || !data.active || !data.text){ banner.style.display = "none"; return; }
  let dismissed = "";
  try{ dismissed = localStorage.getItem("oshi_banner_dismissed") || ""; }catch(e){ /* localStorage不可の環境 */ }
  document.getElementById("site-banner-text").textContent = data.text;
  document.getElementById("site-banner-link").href = data.url || "#";
  banner.style.display = (dismissed === data.text) ? "none" : "block";
}
document.getElementById("site-banner-close")?.addEventListener("click", () => {
  const text = document.getElementById("site-banner-text").textContent.trim();
  try{ localStorage.setItem("oshi_banner_dismissed", text); }catch(e){ /* localStorage不可の環境 */ }
  document.getElementById("site-banner").style.display = "none";
});
(async function loadBannerIfAvailable(){
  try{
    if(location.href.indexOf("file://") === 0) return;
    const res = await fetch("announcement-data.json?_=" + Date.now(), { cache: "no-store" });
    if(!res.ok) return;
    const data = await res.json();
    renderSiteBanner(data);
  }catch(e){ /* ファイルが無い場合は何もしない */ }
})();

/* ---------- お気に入り統合表示 ---------- */
function escapeHtml(str){
  return String(str || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
const FAVORITE_SOURCES = [
  { key:"wiki", label:"豆知識・エピソード集", icon:"📚", pageUrl:"wiki.html", jsonFile:"wiki-data.json", storageKey:"oshi-favorites-wiki", titleField:"title", descField:"body" },
  { key:"places", label:"ゆかりの場所まとめ", icon:"📍", pageUrl:"places.html", jsonFile:"places-data.json", storageKey:"oshi-favorites-places", titleField:"name", descField:"body" },
  { key:"videos", label:"動画まとめ", icon:"🎬", pageUrl:"videos.html", jsonFile:"videos-data.json", storageKey:"oshi-favorites-videos", titleField:"title", descField:"desc" },
  { key:"goods", label:"グッズまとめ", icon:"🛍️", pageUrl:"goods.html", jsonFile:"goods-data.json", storageKey:"oshi-favorites-goods", titleField:"title", descField:"desc" },
  { key:"tools", label:"便利なツール", icon:"🔧", pageUrl:"tools.html", jsonFile:"tools-data.json", storageKey:"oshi-favorites-tools", titleField:"title", descField:"desc" },
];
function getFavTitles(storageKey){
  try{
    const raw = localStorage.getItem(storageKey);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function favoriteCardHTML(source, item){
  const title = item[source.titleField] || "";
  const desc = (item[source.descField] || "").slice(0, 80);
  return `<div class="page-card">
    <span class="page-icon">${source.icon}</span>
    <span class="page-body">
      <span class="page-title">${escapeHtml(title)}</span><br>
      <span class="page-desc">${escapeHtml(desc)}${desc.length >= 80 ? "…" : ""}</span>
    </span>
    <a class="page-arrow-link" href="${source.pageUrl}" aria-label="${escapeHtml(source.label)}を見る">›</a>
  </div>`;
}
async function loadFavoritesFromSource(source){
  const titles = getFavTitles(source.storageKey);
  if(!titles.length) return [];
  try{
    if(location.href.indexOf("file://") === 0) return [];
    const res = await fetch(source.jsonFile + "?_=" + Date.now(), { cache: "no-store" });
    if(!res.ok) return [];
    const data = await res.json();
    const items = Array.isArray(data.items) ? data.items : [];
    return items
      .filter(item => titles.includes((item[source.titleField] || "").trim()))
      .map(item => ({ source, item }));
  }catch(e){ return []; }
}
async function renderFavorites(){
  const results = await Promise.all(FAVORITE_SOURCES.map(loadFavoritesFromSource));
  const all = results.flat();
  const listEl = document.getElementById("favorites-list");
  const emptyEl = document.getElementById("favorites-empty");
  if(!all.length){
    listEl.innerHTML = "";
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";
  listEl.innerHTML = all.map(({source, item}) => favoriteCardHTML(source, item)).join("");
}
renderFavorites();


document.getElementById("dark-mode-toggle")?.addEventListener("click", () => {
  const isDark = document.documentElement.classList.toggle("dark-mode");
  try{ localStorage.setItem("oshi_dark_mode", isDark ? "1" : "0"); }catch(e){ /* localStorage不可の環境 */ }
});
</script>
